        // --- 分頁 2：現貨市場 ---
        const MarketTab = ({ marketSales, setMarketSales, expenses = [], setConfirmDialog }) => {
            const currentDate = new Date().toISOString().split('T')[0];
            const [editingId, setEditingId] = useState(null);
            
            const [date, setDate] = useState(currentDate);
            const [location, setLocation] = useState('');
            const [revenue, setRevenue] = useState('');
            const [soldQty, setSoldQty] = useState(''); 
            const [rent, setRent] = useState('');
            const [note, setNote] = useState('');
            const [electricity, setElectricity] = useState('');
            const [cleaning, setCleaning] = useState('');
            const [toll, setToll] = useState('');
            const [parking, setParking] = useState('');
            const [hasGift, setHasGift] = useState(false);
            const [giftCount, setGiftCount] = useState('');
            const [acc, setAcc] = useState({ necklace: '', hat: '', bag: '', other: '' });

            const [viewMonthStr, setViewMonthStr] = useState(currentDate.substring(0, 7));
            const [selectedDay, setSelectedDay] = useState(currentDate);
            const [searchTerm, setSearchTerm] = useState('');

            // 計算系統全期的平均衣服進貨成本
            const avgUnitCost = useMemo(() => {
                if (!expenses || expenses.length === 0) return 0;
                const wholesaleExpenses = expenses.filter(e => e.type === 'wholesale' && e.isArrived !== false);
                const accumulatedWholesaleCost = wholesaleExpenses.reduce((sum, e) => sum + (Number(e.amount)||0), 0);
                const accumulatedWholesaleQty = wholesaleExpenses.reduce((sum, e) => sum + (Number(e.qty)||0), 0);
                return accumulatedWholesaleQty > 0 ? (accumulatedWholesaleCost / accumulatedWholesaleQty) : 0;
            }, [expenses]);

            const dailyStats = useMemo(() => {
                const stats = {};
                marketSales.forEach(m => {
                    const mDate = safeStr(m.date);
                    if (mDate.startsWith(viewMonthStr)) {
                        if (!stats[mDate]) stats[mDate] = { revenue: 0, locations: [] };
                        stats[mDate].revenue += (Number(m.revenue) || 0);
                        if (m.location && !stats[mDate].locations.includes(m.location)) stats[mDate].locations.push(m.location);
                    }
                });
                return stats;
            }, [marketSales, viewMonthStr]);

            const resetForm = () => {
                setEditingId(null); setDate(currentDate); setLocation(''); setRevenue(''); setSoldQty(''); setRent(''); setNote(''); 
                setElectricity(''); setCleaning(''); setToll(''); setParking(''); setHasGift(false); setGiftCount(''); 
                setAcc({ necklace: '', hat: '', bag: '', other: '' });
                setSearchTerm('');
            };

            const handleRevenueChange = (e) => {
                const val = e.target.value;
                setRevenue(val);
                if (val !== '') { setSoldQty(Math.round(Number(val) / 200).toString()); } else { setSoldQty(''); }
            };

            const handleAddMarket = () => {
                if (!location) return;
                const recordData = {
                    date, location, revenue: Number(revenue) || 0, soldQty: Number(soldQty) || 0, rent: Number(rent) || 0, note,
                    electricity: Number(electricity) || 0, cleaning: Number(cleaning) || 0, toll: Number(toll) || 0, parking: Number(parking) || 0, gas: 0, 
                    hasGift, giftCount: hasGift ? (Number(giftCount) || 0) : 0, accessories: { necklace: Number(acc.necklace) || 0, hat: Number(acc.hat) || 0, bag: Number(acc.bag) || 0, other: Number(acc.other) || 0 }
                };
                
                if (editingId) {
                    setMarketSales(prev => prev.map(m => m.id === editingId ? { ...m, ...recordData } : m).sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                } else {
                    const newRecord = { id: Date.now().toString(), ...recordData };
                    setMarketSales(prev => [{ ...newRecord }, ...prev].sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                }
                resetForm();
            };

            const handleEditClick = (record) => {
                setEditingId(record.id); setDate(record.date); setLocation(record.location); setRevenue(record.revenue || ''); setSoldQty(record.soldQty || '');
                setRent(record.rent || ''); setNote(record.note || ''); setElectricity(record.electricity || ''); setCleaning(record.cleaning || ''); setToll(record.toll || ''); setParking(record.parking || ''); setHasGift(record.hasGift || false); setGiftCount(record.giftCount || '');
                setAcc({ necklace: record.accessories?.necklace || '', hat: record.accessories?.hat || '', bag: record.accessories?.bag || '', other: record.accessories?.other || '' });
                setSearchTerm(''); scrollToTop();
            };

            const changeMonth = (offset) => {
                const parts = safeStr(viewMonthStr).split('-');
                if (parts.length >= 2 && !isNaN(parseInt(parts[0], 10))) {
                    const newDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1 + offset, 1);
                    setViewMonthStr(`${newDate.getFullYear()}-${String(newDate.getMonth() + 1).padStart(2, '0')}`);
                }
            };

            const renderCalendarDays = () => {
                const parts = safeStr(viewMonthStr).split('-');
                if (parts.length < 2 || isNaN(parseInt(parts[0], 10))) return [];
                const y = parseInt(parts[0], 10), m = parseInt(parts[1], 10) - 1;
                const daysInMonth = new Date(y, m + 1, 0).getDate();
                const startDayOfWeek = new Date(y, m, 1).getDay();
                const days = [];
                for (let i = 0; i < startDayOfWeek; i++) days.push(<div key={`empty-${i}`} className="h-[4.5rem]"></div>);
                for (let i = 1; i <= daysInMonth; i++) {
                    const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                    const isSelected = dateStr === selectedDay;
                    const stat = dailyStats[dateStr];
                    const hasData = !!stat;
                    const rev = hasData ? stat.revenue : 0;
                    const locStr = hasData ? stat.locations.join(', ') : '';

                    days.push(
                        <div key={dateStr} onClick={() => {setSelectedDay(dateStr); setDate(dateStr);}} 
                             className={`h-[4.5rem] py-1 flex flex-col items-center justify-start rounded-xl cursor-pointer transition-all overflow-hidden ${isSelected ? 'bg-[#bc9f8b] text-white shadow-md' : hasData ? 'border border-[#bc9f8b] bg-[#fdfaf7] text-[#5c4d43]' : 'text-[#7a6453] hover:bg-[#f2e7df]'}`}>
                            <span className={`text-sm font-bold ${isSelected ? 'text-white' : ''} leading-tight mb-0.5`}>{i}</span>
                            {hasData && (
                                <div className="flex flex-col items-center w-full px-0.5">
                                    {locStr && <span className={`text-[9px] w-full truncate text-center mb-0.5 ${isSelected ? 'text-[#f0e6e0]' : 'text-[#a89689]'}`}>{locStr}</span>}
                                    <span className={`text-[11px] font-black leading-none ${isSelected ? 'text-white' : 'text-[#4caf50]'}`}>{formatRevenueStr(rev)}</span>
                                </div>
                            )}
                        </div>
                    );
                }
                return days;
            };

            const searchedSales = searchTerm ? marketSales.filter(m => safeStr(m.location).includes(searchTerm)).sort((a, b) => safeTime(b.date) - safeTime(a.date)) : [];

            const renderSearchResults = () => {
                if (!searchTerm) return null;
                if (searchedSales.length === 0) return <div className="text-center text-[#c4b5aa] py-8 mx-2 mt-4 bg-white rounded-2xl border border-dashed border-[#e0d6ce]">找不到「{searchTerm}」的歷史紀錄 🥺</div>;

                const times = searchedSales.length;
                const totalRev = searchedSales.reduce((sum, m) => sum + (Number(m.revenue) || 0), 0);
                const totalProfit = searchedSales.reduce((sum, m) => {
                    const dailyMisc = (Number(m.electricity) || 0) + (Number(m.cleaning) || 0) + (Number(m.toll) || 0) + (Number(m.parking) || 0);
                    const cogs = Math.round((Number(m.soldQty)||0) * avgUnitCost);
                    return sum + (Number(m.revenue) || 0) - (Number(m.rent) || 0) - dailyMisc - cogs;
                }, 0);

                return (
                    <div className="animate-fade-in mt-6">
                        <Card className="bg-gradient-to-r from-[#fffde7] to-[#fff8e1] border-[#fff59d] mb-4">
                            <div className="flex items-center text-[#f57f17] font-bold text-lg mb-3 pb-2 border-b border-[#fff59d]"><Icon name="analytics" className="mr-2" /> 「{searchTerm}」績效評估報告</div>
                            <div className="grid grid-cols-2 gap-y-3 gap-x-2 text-sm text-[#7a6453]">
                                <div className="flex flex-col"><span className="text-[10px] text-[#a89689] font-bold">出攤次數</span><span className="font-black text-lg text-[#5c4d43]">{times} 次</span></div>
                                <div className="flex flex-col"><span className="text-[10px] text-[#a89689] font-bold">累積總業績</span><span className="font-black text-lg text-[#5c4d43]">${totalRev.toLocaleString()}</span></div>
                                <div className="flex flex-col"><span className="text-[10px] text-[#a89689] font-bold">平均單次業績</span><span className="font-black text-xl text-[#4caf50]">${Math.round(totalRev / times).toLocaleString()}</span></div>
                                <div className="flex flex-col"><span className="text-[10px] text-[#a89689] font-bold">單次淨利(含扣衣成本)</span><span className="font-black text-xl text-[#e57373]">${Math.round(totalProfit / times).toLocaleString()}</span></div>
                            </div>
                        </Card>
                        
                        <div className="text-[#9b4949] font-bold px-2 text-lg mb-2"><Icon name="history" className="align-middle text-[20px] mr-1" /> 歷史足跡明細</div>
                        {searchedSales.map(m => {
                            const dailyMisc = (Number(m.electricity) || 0) + (Number(m.cleaning) || 0) + (Number(m.toll) || 0) + (Number(m.parking) || 0);
                            const cogs = Math.round((Number(m.soldQty)||0) * avgUnitCost);
                            const operatingProfit = (Number(m.revenue)||0) - (Number(m.rent)||0) - dailyMisc - cogs; 
                            return (
                                <div key={m.id} className="bg-white rounded-xl p-4 mb-3 shadow-sm border border-[#f2e7df] relative mx-1">
                                    <div className="absolute top-4 right-4 flex gap-1">
                                        <button onClick={() => handleEditClick(m)} className="p-1.5 bg-[#fdfaf7] text-[#bc9f8b] rounded-lg shadow-sm"><Icon name="edit" className="text-[18px]" /></button>
                                        <button onClick={() => setConfirmDialog({isOpen: true, id: m.id, collection: 'market_sales', message: "確定要刪除這筆市場紀錄嗎？"})} className="p-1.5 bg-[#fdf2f2] text-[#e57373] rounded-lg shadow-sm"><Icon name="delete" className="text-[18px]" /></button>
                                    </div>
                                    <div className="font-bold text-[#5c4d43] mb-1 text-base flex items-center"><span className="bg-[#bc9f8b] w-2 h-2 rounded-full mr-2"></span>{m.location} <span className="ml-2 text-xs font-normal text-[#a89689] bg-[#fdfaf7] px-1 rounded">{m.date}</span></div>
                                    {m.note && <div className="text-xs text-[#a89689] mb-2 pl-4">備註: {m.note}</div>}
                                    <div className="text-sm text-[#7a6453] grid grid-cols-2 gap-y-1.5 mt-3 pt-3 border-t border-[#fdfaf7] pl-4">
                                        <div>營業額: <span className="font-bold text-[#5c4d43]">${m.revenue}</span> <span className="ml-1 bg-orange-50 text-[#bc9f8b] text-[10px] px-1 rounded">{m.soldQty||0}件</span></div>
                                        <div>攤租雜支: <span className="font-medium">-${(Number(m.rent)||0) + dailyMisc}</span></div>
                                        <div className="col-span-2 flex justify-between items-end mt-1 pt-2 border-t border-dashed border-[#f2e7df]">
                                            <span className="text-[11px] text-[#a89689]">衣服成本(均價計算): -${cogs}</span>
                                            <span className="font-bold text-[#5c4d43] text-base">單日淨利: <span className={operatingProfit >= 0 ? 'text-[#4caf50]' : 'text-[#e57373]'}>${operatingProfit}</span></span>
                                        </div>
                                    </div>
                                </div>
                            )
                        })}
                    </div>
                );
            };

            const filteredSales = marketSales.filter(m => m.date === selectedDay);
            const viewParts = safeStr(viewMonthStr).split('-');

            return (
                <div className="animate-fade-in pb-20">
                    <Card className={editingId ? 'border-2 border-[#bc9f8b]' : ''}>
                        <div className="flex items-center mb-4 text-[#7a6453] font-bold text-lg"><Icon name={editingId ? 'edit' : 'storefront'} className="mr-2 text-[#bc9f8b]" /> {editingId ? '編輯市場營業' : '新增市場營業'}</div>
                        <Input type="date" value={date} onChange={e => { setDate(e.target.value); setSelectedDay(e.target.value); setViewMonthStr(safeStr(e.target.value).substring(0,7)); }} />
                        
                        {/* 排序：地點 | 位租 */}
                        <div className="grid grid-cols-2 gap-3">
                            <Input placeholder="地點" value={location} onChange={e => setLocation(e.target.value)} />
                            <Input type="number" placeholder="位租" value={rent} onChange={e => setRent(e.target.value)} />
                        </div>
                        {/* 排序：當日業績 | 售出件數 */}
                        <div className="grid grid-cols-2 gap-3">
                            <Input type="number" placeholder="當日業績" value={revenue} onChange={handleRevenueChange} />
                            <Input type="number" placeholder="售出件數 (自動推算)" value={soldQty} onChange={e => setSoldQty(e.target.value)} />
                        </div>
                        {/* 獨立備註列 */}
                        <Input placeholder="備註 (選填)" value={note} onChange={e => setNote(e.target.value)} />
                        
                        <div className="grid grid-cols-2 gap-3 mt-1">
                            <Input type="number" placeholder="電費 (選填)" value={electricity} onChange={e => setElectricity(e.target.value)} />
                            <Input type="number" placeholder="清潔費 (選填)" value={cleaning} onChange={e => setCleaning(e.target.value)} />
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <Input type="number" placeholder="過路費 (選填)" value={toll} onChange={e => setToll(e.target.value)} />
                            <Input type="number" placeholder="停車費 (選填)" value={parking} onChange={e => setParking(e.target.value)} />
                        </div>
                        
                        <div className="flex items-center justify-center text-[11px] text-[#a89689] bg-[#fdfaf7] rounded-xl border border-[#f2e7df] border-dashed py-2 mb-3">※交通油資請至「現貨支出」紀錄</div>
                        
                        <div className="grid grid-cols-2 gap-3 mb-4 mt-1">
                            <button className={`w-full h-[48px] rounded-xl border text-[15px] transition-colors font-wawa font-bold flex items-center justify-center ${hasGift ? 'border-[#bc9f8b] bg-[#fdfaf7] text-[#bc9f8b]' : 'border-[#f0e6e0] bg-[#fdfdfd] text-[#a89689]'}`} onClick={(e) => { e.preventDefault(); setHasGift(!hasGift); }}>🎁 {hasGift ? '有贈品' : '無贈品'}</button>
                            <Input type="number" placeholder="贈品數量" value={giftCount} onChange={e => setGiftCount(e.target.value)} disabled={!hasGift} />
                        </div>

                        <div className="border-t border-[#f2e7df] pt-4 mb-4">
                            <div className="flex items-center text-sm font-bold text-[#5c4d43] mb-3"><Icon name="diamond" className="mr-1 text-[#64b5f6] text-[18px]" /> 配飾販售數量 (不計入業績)</div>
                            <div className="grid grid-cols-4 gap-2 text-center text-xs text-[#a89689]">
                                {['項鍊', '帽子', '包包', '其他'].map((label, idx) => {
                                    const keys = ['necklace', 'hat', 'bag', 'other'];
                                    return ( <div key={label}><label className="block mb-1">{label}</label><input type="number" value={acc[keys[idx]]} onChange={e=>setAcc({...acc, [keys[idx]]: e.target.value})} className="w-full h-[40px] bg-[#fdfdfd] border border-[#f0e6e0] rounded-lg px-2 text-center outline-none focus:border-[#bc9f8b] font-wawa" /></div> )
                                })}
                            </div>
                        </div>
                        <div className="flex gap-3">{editingId && <Button onClick={resetForm} className="flex-1 bg-[#f2e7df] !text-[#7a6453]">取消</Button>}<Button onClick={handleAddMarket} className={editingId ? 'flex-[2] bg-[#bc9f8b] text-white' : 'w-full bg-[#bc9f8b] text-white'}>{editingId ? '儲存修改' : '儲存紀錄'}</Button></div>
                    </Card>

                    {/* 地點績效搜尋器 */}
                    <div className="mb-4 px-1">
                        <div className={`flex items-center bg-white border ${searchTerm ? 'border-[#bc9f8b] shadow-sm' : 'border-[#e0d6ce]'} rounded-xl px-3 h-[48px] transition-colors`}>
                            <Icon name="search" className={`mr-2 text-[20px] ${searchTerm ? 'text-[#bc9f8b]' : 'text-[#c4b5aa]'}`} />
                            <input type="text" placeholder="🔍 搜尋地點 (例如: 果菜) 評估歷史績效" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="bg-transparent w-full h-full outline-none text-[#5c4d43] placeholder-[#c4b5aa] text-[15px] font-wawa" />
                            {searchTerm && <button onClick={() => setSearchTerm('')}><Icon name="close" className="text-[#c4b5aa] text-[18px]" /></button>}
                        </div>
                    </div>

                    {!searchTerm ? (
                        <React.Fragment>
                            <Card className="px-2 pt-2 pb-4">
                                <div className="flex justify-between items-center px-2 mb-4 mt-2">
                                    <button onClick={() => changeMonth(-1)} className="p-1.5 text-[#a89689] bg-[#fdfaf7] rounded-full hover:bg-[#f2e7df]"><Icon name="chevron_left" /></button>
                                    <div className="font-bold text-[#7a6453] text-lg tracking-wider">{viewParts[0]||''}年 {parseInt(viewParts[1]||1, 10)}月</div>
                                    <button onClick={() => changeMonth(1)} className="p-1.5 text-[#a89689] bg-[#fdfaf7] rounded-full hover:bg-[#f2e7df]"><Icon name="chevron_right" /></button>
                                </div>
                                <div className="grid grid-cols-7 text-center text-xs font-bold text-[#a89689] mb-3"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
                                <div className="grid grid-cols-7 gap-y-2 gap-x-1">{renderCalendarDays()}</div>
                            </Card>

                            <div className="mt-6 mb-2 flex items-center text-[#9b4949] font-bold px-2 text-lg">
                                <Icon name="location_on" className="mr-1 text-[20px]" /> {parseInt(safeStr(selectedDay).split('-')[1]||0, 10)}/{parseInt(safeStr(selectedDay).split('-')[2]||0, 10)} 營業紀錄 
                                <span className="ml-2 bg-[#f2e7df] text-[#7a6453] text-xs px-2.5 py-1 rounded-full font-bold">{filteredSales.length} 筆</span>
                            </div>
                            {filteredSales.length === 0 ? (
                                <div className="bg-white rounded-2xl border border-dashed border-[#e0d6ce] text-center text-[#c4b5aa] text-sm py-8 mx-2 mt-4">這天沒有擺攤，是休息日喔 ☕</div>
                            ) : filteredSales.map(m => {
                                const dailyMisc = (Number(m.electricity) || 0) + (Number(m.cleaning) || 0) + (Number(m.toll) || 0) + (Number(m.parking) || 0);
                                const cogs = Math.round((Number(m.soldQty)||0) * avgUnitCost);
                                const operatingProfit = (Number(m.revenue)||0) - (Number(m.rent)||0) - dailyMisc - cogs; 
                                return (
                                    <div key={m.id} className="bg-white rounded-xl p-4 mb-3 shadow-sm border border-[#f2e7df] relative mx-1">
                                        <div className="absolute top-4 right-4 flex gap-1">
                                            <button onClick={() => handleEditClick(m)} className="p-1.5 bg-[#fdfaf7] text-[#bc9f8b] rounded-lg shadow-sm"><Icon name="edit" className="text-[18px]" /></button>
                                            <button onClick={() => setConfirmDialog({isOpen: true, id: m.id, collection: 'market_sales', message: "確定要刪除這筆市場紀錄嗎？"})} className="p-1.5 bg-[#fdf2f2] text-[#e57373] rounded-lg shadow-sm"><Icon name="delete" className="text-[18px]" /></button>
                                        </div>
                                        <div className="font-bold text-[#5c4d43] mb-1 text-base flex items-center"><span className="bg-[#bc9f8b] w-2 h-2 rounded-full mr-2"></span>{m.location}</div>
                                        {m.note && <div className="text-xs text-[#a89689] mb-2 pl-4">備註: {m.note}</div>}
                                        <div className="text-sm text-[#7a6453] grid grid-cols-2 gap-y-1.5 mt-3 pt-3 border-t border-[#fdfaf7] pl-4">
                                            <div>營業額: <span className="font-bold text-[#5c4d43]">${m.revenue}</span> <span className="ml-1 bg-orange-50 text-[#bc9f8b] text-[10px] px-1 rounded">{m.soldQty||0}件</span></div>
                                            <div>攤租雜支: <span className="font-medium">-${(Number(m.rent)||0) + dailyMisc}</span></div>
                                            <div className="col-span-2 flex justify-between items-end mt-1 pt-2 border-t border-dashed border-[#f2e7df]">
                                                <span className="text-[11px] text-[#a89689]">衣服成本(均價計算): -${cogs}</span>
                                                <span className="font-bold text-[#5c4d43] text-base">單日淨利: <span className={operatingProfit >= 0 ? 'text-[#4caf50]' : 'text-[#e57373]'}>${operatingProfit}</span></span>
                                            </div>
                                        </div>
                                    </div>
                                )
                            })}
                        </React.Fragment>
                    ) : renderSearchResults()}
                </div>
            );
        };

        // --- 分頁 3：現貨支出 ---
        const ExpenseTab = ({ expenses, setExpenses, setConfirmDialog }) => {
            const [editingId, setEditingId] = useState(null);
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [type, setType] = useState('wholesale'); 
            const [name, setName] = useState('');
            const [amount, setAmount] = useState('');
            const [qty, setQty] = useState(''); 
            const [isArrived, setIsArrived] = useState(true);
            const [isPaid, setIsPaid] = useState(true); 
            const [flowType, setFlowType] = useState('in');
            
            const [expandedTypes, setExpandedTypes] = useState({});

            const resetForm = () => { setEditingId(null); setDate(new Date().toISOString().split('T')[0]); setType('wholesale'); setName(''); setAmount(''); setQty(''); setIsArrived(true); setIsPaid(true); setFlowType('in'); };

            const handleAddExpense = () => {
                if (!name || !amount) return;
                const recordData = { 
                    date, type, name, amount: Number(amount), 
                    qty: type === 'wholesale' ? (Number(qty) || 0) : 0, 
                    isArrived: type === 'wholesale' ? isArrived : true, 
                    isPaid: type === 'wholesale' ? isPaid : true, 
                    flowType: type === 'financing' ? flowType : 'out' 
                };
                if (editingId) setExpenses(prev => prev.map(e => e.id === editingId ? { ...e, ...recordData } : e).sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                else setExpenses(prev => [{ id: Date.now().toString(), ...recordData }, ...prev].sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                resetForm();
            };

            const handleEditClick = (record) => { 
                setEditingId(record.id); setDate(record.date); setType(record.type); setName(record.name); setAmount(record.amount); setQty(record.qty || ''); 
                setIsArrived(record.isArrived !== false); 
                setIsPaid(record.isPaid !== false); 
                setFlowType(record.flowType || 'in'); 
                scrollToTop(); 
            };
            const toggleArriveStatus = (id) => setExpenses(prev => prev.map(e => e.id === id ? { ...e, isArrived: true } : e));
            const toggleType = (t) => setExpandedTypes(prev => ({ ...prev, [t]: !prev[t] }));

            const wholesaleTotalPaid = expenses.filter(e => e.type === 'wholesale' && e.isPaid !== false).reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const wholesaleTotalUnpaid = expenses.filter(e => e.type === 'wholesale' && e.isPaid === false).reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            
            const currentMonth = safeStr(date).substring(0, 7);
            const currentMonthExpenses = expenses.filter(e => safeStr(e.date).startsWith(currentMonth));
            
            const typeConfig = {
                wholesale: { label: '現貨進貨', color: 'bg-[#e57373]', text: 'text-[#e57373]', bgLight: 'bg-[#ffebee]', placeholder: '現貨品名 / 廠商', icon: 'inventory_2' },
                supply: { label: '生財包材', color: 'bg-[#64b5f6]', text: 'text-[#64b5f6]', bgLight: 'bg-[#e0f7fa]', placeholder: '品牌袋、衣架、文具', icon: 'shopping_bag' },
                fixed: { label: '倉租水電', color: 'bg-[#81c784]', text: 'text-[#81c784]', bgLight: 'bg-[#e8f5e9]', placeholder: '倉庫租金、水電網費', icon: 'home' },
                traffic: { label: '交通油資', color: 'bg-[#ba68c8]', text: 'text-[#ab47bc]', bgLight: 'bg-[#f3e5f5]', placeholder: '加油、高鐵、客運', icon: 'local_gas_station' },
                salary: { label: '老闆支薪', color: 'bg-[#ffd54f]', text: 'text-[#fbc02d]', bgLight: 'bg-[#fffde7]', placeholder: '老闆薪水', icon: 'account_balance_wallet' },
                financing: { label: '資金借還', color: 'bg-[#9e9e9e]', text: 'text-[#757575]', bgLight: 'bg-[#f5f5f5]', placeholder: '借入週轉金 / 償還欠款', icon: 'swap_horiz' }
            };

            const groupedExpenses = useMemo(() => {
                const groups = {};
                expenses.forEach(e => { const t = e.type || 'wholesale'; if (!groups[t]) groups[t] = []; groups[t].push(e); });
                return groups;
            }, [expenses]);

            return (
                <div className="animate-fade-in pb-20">
                    <Card className={editingId && typeConfig[type] ? `border-2 border-${typeConfig[type].color.split('-')[1]}` : ''}>
                        <div className="flex items-center mb-4 text-[#7a6453] font-bold text-lg"><Icon name={editingId ? 'edit' : 'account_balance_wallet'} className="mr-2 text-[#7a6453]" /> {editingId ? '編輯支出紀錄' : '公司營運支出'}</div>
                        <div className="grid grid-cols-3 gap-2 mb-4">
                            {Object.keys(typeConfig).map(tKey => {
                                const tConf = typeConfig[tKey];
                                return ( <button key={tKey} onClick={() => { setType(tKey); setQty(''); setIsArrived(true); setIsPaid(true); }} className={`py-2 rounded-xl text-[12px] font-bold transition-all border ${type === tKey ? `${tConf.color} text-white border-transparent shadow-md` : 'bg-white border-[#f0e6e0] text-[#a89689]'}`}> {tConf.label.split(' ')[0]} </button> );
                            })}
                        </div>

                        <Input type="date" value={date} onChange={e => setDate(e.target.value)} />
                        
                        {type === 'financing' && (
                            <div className="flex items-center gap-3 mb-4">
                                <button className={`flex-1 h-[48px] rounded-xl border text-[13px] transition-colors font-wawa font-bold flex items-center justify-center shadow-sm ${flowType === 'in' ? 'border-[#4caf50] bg-[#f0f9f0] text-[#4caf50]' : 'border-[#e0e0e0] bg-[#fdfdfd] text-[#9e9e9e]'}`} onClick={(e) => { e.preventDefault(); setFlowType('in'); }}>📥 借入週轉金 (現金+)</button>
                                <button className={`flex-1 h-[48px] rounded-xl border text-[13px] transition-colors font-wawa font-bold flex items-center justify-center shadow-sm ${flowType === 'out' ? 'border-[#e57373] bg-[#fff2f2] text-[#e57373]' : 'border-[#e0e0e0] bg-[#fdfdfd] text-[#9e9e9e]'}`} onClick={(e) => { e.preventDefault(); setFlowType('out'); }}>📤 償還本金 (現金-)</button>
                            </div>
                        )}

                        <Input placeholder={typeConfig[type] ? typeConfig[type].placeholder : '名稱'} value={name} onChange={e => setName(e.target.value)} />
                        
                        {type === 'wholesale' ? (
                            <React.Fragment>
                                <div className="grid grid-cols-2 gap-3 mb-3"><Input type="number" placeholder="現貨單筆總成本" value={amount} onChange={e => setAmount(e.target.value)} /><Input type="number" placeholder="進貨總件數" value={qty} onChange={e => setQty(e.target.value)} /></div>
                                <div className="flex items-center gap-2 mb-4">
                                    <button className={`flex-1 h-[44px] rounded-xl border text-[12px] transition-colors font-wawa font-bold flex items-center justify-center shadow-sm ${isArrived ? 'border-[#4caf50] bg-[#f0f9f0] text-[#4caf50]' : 'border-[#ffb300] bg-[#fffde7] text-[#f57f17]'}`} onClick={(e) => { e.preventDefault(); setIsArrived(!isArrived); }}>
                                        {isArrived ? '📦 已入庫' : '🚚 貨在途'}
                                    </button>
                                    <button className={`flex-1 h-[44px] rounded-xl border text-[12px] transition-colors font-wawa font-bold flex items-center justify-center shadow-sm ${isPaid ? 'border-[#4caf50] bg-[#f0f9f0] text-[#4caf50]' : 'border-[#e57373] bg-[#fff2f2] text-[#e57373]'}`} onClick={(e) => { e.preventDefault(); setIsPaid(!isPaid); }}>
                                        {isPaid ? '💸 已結清(扣現)' : '📝 未付/寄賣'}
                                    </button>
                                </div>
                            </React.Fragment>
                        ) : (
                            <Input type="number" placeholder={type === 'financing' ? (flowType === 'in' ? '借入金額' : '償還金額') : "支出總金額"} value={amount} onChange={e => setAmount(e.target.value)} />
                        )}

                        {type === 'wholesale' && amount && qty && <div className="text-right text-xs text-[#e57373] font-bold mb-3 px-1">單筆平均進價：${(Number(amount) / Number(qty)).toFixed(1)} /件</div>}
                        <div className="flex gap-3">{editingId && <Button onClick={resetForm} className="flex-1 bg-[#f2e7df] !text-[#7a6453]">取消</Button>}<Button onClick={handleAddExpense} className={`${typeConfig[type] ? typeConfig[type].color : 'bg-gray-400'} hover:opacity-90 text-white ${editingId ? 'flex-[2]' : 'w-full'}`}>{editingId ? '儲存修改' : (type === 'financing' ? '儲存借還紀錄' : '儲存支出')}</Button></div>
                    </Card>

                    <div className="grid grid-cols-2 gap-3 mb-6">
                        {[{k:'wholesale', t:'歷史已付現貨款', l:'e57373'},{k:'supply', t:'歷史總生財包材', l:'64b5f6'},{k:'fixed', t:'歷史總倉租水電', l:'81c784'},{k:'traffic', t:'歷史總交通油資', l:'ab47bc'},{k:'salary', t:'歷史總老闆支薪', l:'fbc02d'}].map(c => {
                            let tot, mTot;
                            if(c.k === 'wholesale') {
                                tot = wholesaleTotalPaid; 
                                mTot = currentMonthExpenses.filter(e=>e.type===c.k && e.isPaid !== false).reduce((s,e)=>s+(Number(e.amount)||0),0);
                            } else {
                                tot = expenses.filter(e=>e.type===c.k).reduce((s,e)=>s+(Number(e.amount)||0),0);
                                mTot = currentMonthExpenses.filter(e=>e.type===c.k).reduce((s,e)=>s+(Number(e.amount)||0),0);
                            }
                            
                            return (
                                <div key={c.k} className="bg-white rounded-xl p-3 shadow-sm border border-[#f2e7df] text-center flex flex-col justify-between">
                                    <div>
                                        <div className="text-[11px] text-[#a89689] font-bold mb-1">{c.t}</div>
                                        <div className={`text-lg font-black text-[#${c.l}]`}>${tot.toLocaleString()}</div>
                                        {c.k === 'wholesale' && wholesaleTotalUnpaid > 0 && <div className="text-[9px] text-[#f57f17] font-bold mt-0.5">另有未付/寄賣 ${wholesaleTotalUnpaid.toLocaleString()}</div>}
                                    </div>
                                    <div className="text-[10px] text-[#7a6453] font-bold mt-1.5 pt-1.5 border-t border-[#fdfaf7] bg-[#fdfaf7] rounded -mx-1 -mb-1 pb-1">本月 ({parseInt(currentMonth.substring(5,7))}月): <span className={`text-[#${c.l}]`}>${mTot.toLocaleString()}</span></div>
                                </div>
                            );
                        })}
                        <div className="bg-white rounded-xl p-3 shadow-sm border border-[#f2e7df] text-center flex flex-col justify-between bg-gray-50 border-gray-200">
                            <div>
                                <div className="text-[11px] text-[#a89689] font-bold mb-1">歷史淨借入週轉金</div>
                                <div className={`text-lg font-black ${(expenses.filter(e=>e.type==='financing'&&e.flowType==='in').reduce((s,e)=>s+(Number(e.amount)||0),0) - expenses.filter(e=>e.type==='financing'&&e.flowType!=='in').reduce((s,e)=>s+(Number(e.amount)||0),0)) >= 0 ? 'text-[#4caf50]' : 'text-[#e57373]'}`}>${(expenses.filter(e=>e.type==='financing'&&e.flowType==='in').reduce((s,e)=>s+(Number(e.amount)||0),0) - expenses.filter(e=>e.type==='financing'&&e.flowType!=='in').reduce((s,e)=>s+(Number(e.amount)||0),0)).toLocaleString()}</div>
                            </div>
                            <div className="text-[10px] text-[#7a6453] font-bold mt-1.5 pt-1.5 border-t border-[#fdfaf7] bg-[#fdfaf7] rounded -mx-1 -mb-1 pb-1">(不計入損益計算)</div>
                        </div>
                    </div>

                    <div className="mt-8 mb-2 flex items-center text-[#7a6453] font-bold px-2 text-lg"><Icon name="folder_open" className="mr-1 text-[20px]" /> 支出明細分類庫</div>
                    {expenses.length === 0 ? (
                        <div className="text-center text-[#c4b5aa] text-sm py-8 bg-white rounded-2xl border border-dashed border-[#e0d6ce] mt-4 mx-2">目前尚無支出紀錄</div>
                    ) : (
                        <div className="mt-4 space-y-3 px-1">
                            {Object.keys(typeConfig).map(tKey => {
                                const items = groupedExpenses[tKey];
                                if (!items || items.length === 0) return null;
                                const conf = typeConfig[tKey];
                                
                                return (
                                    <div key={tKey} className="bg-white rounded-xl shadow-sm border border-[#f2e7df] overflow-hidden">
                                        <button onClick={() => toggleType(tKey)} className={`w-full flex justify-between items-center p-3 ${conf.bgLight} ${conf.text} transition-colors`}>
                                            <div className="flex items-center font-bold text-sm tracking-wide"><Icon name={conf.icon} className="mr-2 text-[18px] opacity-80" />{conf.label} 紀錄</div>
                                            <div className="flex items-center"><span className={`text-[11px] bg-white ${conf.text} px-2 py-0.5 rounded-full mr-2 font-bold shadow-sm`}>{items.length} 筆</span><Icon name={expandedTypes[tKey] ? "expand_less" : "expand_more"} className="text-[20px] opacity-70" /></div>
                                        </button>
                                        
                                        {expandedTypes[tKey] && (
                                            <div className="p-2 bg-[#fafafa] space-y-2 animate-expand border-t border-gray-100">
                                                {items.map(e => {
                                                    const isBorrow = e.type === 'financing' && e.flowType === 'in';
                                                    return (
                                                        <div key={e.id} className="bg-white rounded-lg p-3 border border-[#f0f0f0] flex justify-between items-center opacity-95 shadow-sm">
                                                            <div className="flex flex-col flex-1">
                                                                <div className="flex items-center gap-1.5 mb-1 flex-wrap">
                                                                    <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${conf.bgLight} ${conf.text} shrink-0`}>{conf.label.split(' ')[0]}</span>
                                                                    <span className="font-bold text-[#5c4d43] text-base truncate max-w-[120px]">{e.name}</span>
                                                                    {e.type === 'wholesale' && e.isArrived === false && <button onClick={() => toggleArriveStatus(e.id)} className="shrink-0 text-[10px] bg-[#fffde7] text-[#f57f17] border border-[#ffe082] px-2 py-0.5 rounded shadow-sm hover:bg-[#fff9c4] transition-colors">點擊入庫</button>}
                                                                    {e.type === 'wholesale' && e.isArrived !== false && <span className="shrink-0 text-[10px] bg-[#f0f9f0] text-[#4caf50] px-1.5 py-0.5 rounded">已入庫</span>}
                                                                    {e.type === 'wholesale' && e.isPaid === false && <span className="shrink-0 text-[10px] bg-[#fff2f2] text-[#e57373] border border-[#ffcdd2] px-1.5 py-0.5 rounded shadow-sm">未付款(應付)</span>}
                                                                    {e.type === 'financing' && <span className={`shrink-0 text-[10px] px-1.5 py-0.5 rounded ${isBorrow ? 'bg-[#f0f9f0] text-[#4caf50]' : 'bg-[#fff2f2] text-[#e57373]'}`}>{isBorrow ? '借入' : '償還'}</span>}
                                                                </div>
                                                                <div className="text-xs text-[#a89689]">{e.date} {e.type === 'wholesale' && e.qty > 0 && <span className="ml-1 text-[#e57373]">({e.qty}件)</span>}</div>
                                                            </div>
                                                            <div className="flex items-center gap-1.5 shrink-0 pl-1">
                                                                <div className={`font-black text-base mr-1 ${isBorrow ? 'text-[#4caf50]' : conf.text}`}>{isBorrow ? '+' : '-'}${e.amount}</div>
                                                                <button onClick={() => handleEditClick(e)} className="p-1.5 bg-[#fdfaf7] text-[#bc9f8b] rounded-lg shadow-sm"><Icon name="edit" className="text-[18px]" /></button>
                                                                <button onClick={() => setConfirmDialog({isOpen: true, id: e.id, collection: 'expenses', message: "確定要刪除這筆支出嗎？"})} className="p-1.5 bg-[#fdf2f2] text-[#e57373] rounded-lg shadow-sm"><Icon name="delete" className="text-[18px]" /></button>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        // --- 4. 營運報表 ---
        const ReportTab = ({ deliveries, marketSales, expenses, preorders, settings, setSettings, marketSoldStats, setMarketSoldStats, setDialog }) => {
            const [reportMonth, setReportMonth] = useState(() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; });
            const [isCheckingInventory, setIsCheckingInventory] = useState(false);
            const [actualInv, setActualInv] = useState('');
            const [expState, setExpState] = useState({});

            const toggleExp = (key) => setExpState(prev => ({...prev, [key]: !prev[key]}));

            const changeMonth = (offset) => {
                const parts = safeStr(reportMonth).split('-');
                if(parts.length >= 2) {
                    const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1 + offset, 1);
                    setReportMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
                }
                setIsCheckingInventory(false); setActualInv(''); setExpState({});
            };

            const currentStartupCap = settings && settings.startupCapital !== undefined ? settings.startupCapital : 36284;

            const handleCapitalChange = () => {
                const newCapital = window.prompt("請輸入您的「初期創業本金」(系統會自動幫您推算帳面資金！)：", currentStartupCap);
                if (newCapital !== null && newCapital.trim() !== '' && !isNaN(Number(newCapital))) {
                    setSettings({ ...(settings || {}), startupCapital: Number(newCapital) });
                }
            };

            // ---- 全期存摺 ----
            const allTimeMarketRev = marketSales.reduce((sum, m) => sum + (Number(m.revenue)||0), 0);
            const allTimeStoreRev = deliveries.reduce((sum, d) => sum + (Number(d.revenue)||0), 0);
            const allTimeStoreShipIn = deliveries.reduce((sum, d) => sum + (Number(d.shippingIncome)||0), 0);
            const allTimeRev = allTimeMarketRev + allTimeStoreRev + allTimeStoreShipIn; 
            
            const allTimeMarketExp = marketSales.reduce((sum, m) => sum + (Number(m.rent)||0) + (Number(m.electricity)||0) + (Number(m.cleaning)||0) + (Number(m.toll)||0) + (Number(m.parking)||0), 0) + deliveries.reduce((sum, d) => sum + (Number(d.shippingExpense)||0), 0);
            
            // 只有「已付款」的進貨才會扣除現金
            const allTimeWholePaidArrived = expenses.filter(e => e.type === 'wholesale' && e.isArrived !== false && e.isPaid !== false).reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const allTimeWholePaidTransit = expenses.filter(e => e.type === 'wholesale' && e.isArrived === false && e.isPaid !== false).reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const allTimeWholesaleCashPaid = allTimeWholePaidArrived + allTimeWholePaidTransit;
            // 未付款(寄賣) 記錄，用於顯示但不扣現金
            const allTimeWholesaleUnpaid = expenses.filter(e => e.type === 'wholesale' && e.isPaid === false).reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            
            const allTimeOtherExp = expenses.filter(e => ['supply', 'fixed', 'traffic', 'salary'].includes(e.type)).reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const allTimeFinancingIn = expenses.filter(e => e.type === 'financing' && e.flowType === 'in').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const allTimeFinancingOut = expenses.filter(e => e.type === 'financing' && e.flowType !== 'in').reduce((sum, e) => sum + (Number(e.amount)||0), 0);

            // 代購金流
            const allTimePreorderCost = preorders.filter(p => ['arrived', 'completed'].includes(p.status)).reduce((sum, p) => sum + (Number(p.wholesaleCost)||0), 0);
            const allTimePreorderRev = preorders.filter(p => p.status === 'completed').reduce((sum, p) => sum + (Number(p.revenue)||0), 0);
            const preorderUnpaidRev = preorders.filter(p => p.status !== 'completed').reduce((sum, p) => sum + (Number(p.revenue)||0), 0);
            const preorderUnpaidCost = preorders.filter(p => ['pending', 'ordered'].includes(p.status)).reduce((sum, p) => sum + (Number(p.wholesaleCost)||0), 0);

            // 帳面資金：進貨只扣除「已付款 (allTimeWholesaleCashPaid)」的部分
            const pocketCash = currentStartupCap + allTimeRev - allTimeMarketExp - allTimeWholesaleCashPaid - allTimeOtherExp + allTimeFinancingIn - allTimeFinancingOut - allTimePreorderCost + allTimePreorderRev;

            // ---- 回本進度計算 ----
            const netFinancing = allTimeFinancingIn - allTimeFinancingOut;
            const targetCashBreakEven = currentStartupCap + netFinancing; // 目標現金：本金+還清所有借款
            const cashGap = targetCashBreakEven - pocketCash; // 現金缺口

            // ---- 計算本月損益 ----
            const currentDeliveries = deliveries.filter(d => safeStr(d.date).startsWith(reportMonth) && d.status === 'shipped');
            const currentMarket = marketSales.filter(m => safeStr(m.date).startsWith(reportMonth));
            const currentExpenses = expenses.filter(e => safeStr(e.date).startsWith(reportMonth));
            const currentCompletedPreorders = preorders.filter(p => safeStr(p.date).startsWith(reportMonth) && p.status === 'completed');

            const monthlyPreorderRev = currentCompletedPreorders.reduce((sum, p) => sum + (Number(p.revenue)||0), 0);
            const monthlyPreorderCost = currentCompletedPreorders.reduce((sum, p) => sum + (Number(p.wholesaleCost)||0), 0);
            const monthlyPreorderProfit = monthlyPreorderRev - monthlyPreorderCost;

            const storeRevenue = currentDeliveries.reduce((sum, d) => sum + (Number(d.revenue) || 0), 0);
            const marketRevenue = currentMarket.reduce((sum, m) => sum + (Number(m.revenue) || 0), 0);
            const monthlyTotalRev = storeRevenue + marketRevenue;

            const marketRent = currentMarket.reduce((sum, m) => sum + (Number(m.rent)||0), 0);
            const marketElec = currentMarket.reduce((sum, m) => sum + (Number(m.electricity)||0), 0);
            const marketClean = currentMarket.reduce((sum, m) => sum + (Number(m.cleaning)||0), 0);
            const marketToll = currentMarket.reduce((sum, m) => sum + (Number(m.toll)||0), 0);
            const marketParking = currentMarket.reduce((sum, m) => sum + (Number(m.parking)||0), 0);
            const marketMiscAndRent = marketRent + marketElec + marketClean + marketToll + marketParking; 

            const storeShippingNetExp = currentDeliveries.reduce((sum, d) => sum + (Number(d.shippingExpense)||0) - (Number(d.shippingIncome)||0), 0);
            const monthlyMarketExp = marketMiscAndRent + (storeShippingNetExp > 0 ? storeShippingNetExp : 0);
            const monthlyShippingProfit = storeShippingNetExp < 0 ? Math.abs(storeShippingNetExp) : 0; 
            const frontlineNetIncome = monthlyTotalRev - monthlyMarketExp + monthlyShippingProfit;

            // 庫存成本：包含「未付款」的進貨，因為實體衣服已經到了並可以賣了
            const wholesaleToMonth = expenses.filter(e => e.type === 'wholesale' && safeStr(e.date).substring(0, 7) <= reportMonth && e.isArrived !== false);
            const accumulatedWholesaleCost = wholesaleToMonth.reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const accumulatedWholesaleQty = wholesaleToMonth.reduce((sum, e) => sum + (Number(e.qty)||0), 0);
            const avgUnitCost = accumulatedWholesaleQty > 0 ? (accumulatedWholesaleCost / accumulatedWholesaleQty) : 0;

            const storeSoldToMonth = deliveries.filter(d => d.status === 'shipped' && safeStr(d.date).substring(0, 7) <= reportMonth);
            const accumulatedStoreSoldQty = storeSoldToMonth.reduce((sum, d) => sum + (Number(d.soldQty) || 1), 0);
            const marketSoldToMonth = marketSales.filter(m => safeStr(m.date).substring(0, 7) <= reportMonth);
            const accumulatedMarketDailySoldQty = marketSoldToMonth.reduce((sum, m) => sum + (Number(m.soldQty) || 0), 0);

            let pastAdjustments = 0;
            Object.keys(marketSoldStats || {}).forEach(key => { if (key < reportMonth) pastAdjustments += (Number(marketSoldStats[key])||0); });
            const currentMonthAdj = Number((marketSoldStats || {})[reportMonth]) || 0;

            const accumulatedTotalSold = accumulatedStoreSoldQty + accumulatedMarketDailySoldQty + pastAdjustments + currentMonthAdj;
            const currentInventoryQty = accumulatedWholesaleQty - accumulatedTotalSold;
            const theoreticalInventory = accumulatedWholesaleQty - accumulatedStoreSoldQty - accumulatedMarketDailySoldQty - pastAdjustments;
            
            const inventoryValue = Math.round(currentInventoryQty * avgUnitCost);
            // 歷史真實總淨利：(手邊現金 + 庫存資產 + 代購應收款) - (原始本金與借貸負債 + 寄賣未付款 + 代購應付款)
            const trueNetWorth = pocketCash + inventoryValue + preorderUnpaidRev - allTimeWholesaleUnpaid - preorderUnpaidCost;
            const allTimeNetProfit = trueNetWorth - targetCashBreakEven;

            const saveInventoryCheck = () => {
                const actual = Number(actualInv) || 0;
                const diff = theoreticalInventory - actual; 
                setMarketSoldStats({ ...(marketSoldStats || {}), [reportMonth]: diff });
                setIsCheckingInventory(false); setActualInv('');
            };

            const currentMonthStoreSold = currentDeliveries.reduce((sum, d) => sum + (Number(d.soldQty) || 1), 0);
            const currentMonthMarketDailySold = currentMarket.reduce((sum, m) => sum + (Number(m.soldQty) || 0), 0);
            const currentMonthTotalSoldQty = currentMonthStoreSold + currentMonthMarketDailySold + currentMonthAdj;
            const monthlyCOGS = Math.round(currentMonthTotalSoldQty * avgUnitCost);
            const grossProfit = frontlineNetIncome - monthlyCOGS + monthlyPreorderProfit; 

            const monthlySupplyExp = currentExpenses.filter(e => e.type === 'supply').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const monthlyFixedExp = currentExpenses.filter(e => e.type === 'fixed').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const monthlyTrafficExp = currentExpenses.filter(e => e.type === 'traffic').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const monthlySalary = currentExpenses.filter(e => e.type === 'salary').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const monthlyOtherTotal = monthlySupplyExp + monthlyFixedExp + monthlyTrafficExp;
            const monthlyNetProfit = grossProfit - monthlyOtherTotal - monthlySalary;

            const storeGifts = currentDeliveries.reduce((sum, d) => sum + (Number(d.giftCount) || 0), 0);
            const marketGifts = currentMarket.reduce((sum, m) => sum + (Number(m.giftCount) || 0), 0);

            return (
                <div className="animate-fade-in pb-20">
                    <div className="flex justify-between items-center bg-white rounded-2xl p-3 shadow-sm border border-[#f2e7df] mb-4">
                        <button onClick={() => changeMonth(-1)} className="p-2 text-[#a89689]"><Icon name="chevron_left" /></button>
                        <div className="font-bold text-[#7a6453] text-lg">{reportMonth.replace('-', '年')}月</div>
                        <button onClick={() => changeMonth(1)} className="p-2 text-[#a89689]"><Icon name="chevron_right" /></button>
                    </div>
                    
                    {/* 事業總體檢與回本進度 (新功能) */}
                    <Card className="bg-gradient-to-br from-[#e8eaf6] to-[#c5cae9] border-[#9fa8da] mb-4 shadow-md relative overflow-hidden">
                        <div className="absolute -right-4 -top-4 opacity-10 transform rotate-12"><Icon name="flag" className="text-[120px]" /></div>
                        <div className="relative z-10">
                            <div className="flex items-center text-[#283593] font-bold text-lg mb-3 pb-2 border-b border-[#9fa8da] border-opacity-50"><Icon name="health_and_safety" className="mr-2" /> 🏆 事業總體檢 & 回本進度</div>
                            
                            <div className="grid grid-cols-2 gap-3 mb-3">
                                <div className="bg-white bg-opacity-70 p-2.5 rounded-xl shadow-sm border border-white">
                                    <div className="text-[10px] text-[#5c6bc0] font-bold mb-0.5 flex items-center"><Icon name="flag_circle" className="text-[14px] mr-1"/> 現金回本目標</div>
                                    <div className="font-black text-xl text-[#3949ab]">${targetCashBreakEven.toLocaleString()}</div>
                                    <div className="text-[9px] text-[#7986cb] mt-0.5">本金 + 需償還借款總額</div>

            const [note, setNote] = useState('');
            const [activeFilter, setActiveFilter] = useState('all');

            const resetForm = () => { setEditingId(null); setDate(new Date().toISOString().split('T')[0]); setCustomerName(''); setItemsCount(''); setWholesaleCost(''); setRevenue(''); setNote(''); };

            const handleAddPreorder = () => {
                if (!customerName || !wholesaleCost || !revenue) return;
                const recordData = { date, customerName, itemsCount: Number(itemsCount) || 1, wholesaleCost: Number(wholesaleCost) || 0, revenue: Number(revenue) || 0, note, status: editingId ? (preorders.find(p => p.id === editingId)?.status || 'pending') : 'pending' };
                if (editingId) setPreorders(prev => prev.map(p => p.id === editingId ? { ...p, ...recordData } : p).sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                else setPreorders(prev => [{ id: Date.now().toString(), ...recordData }, ...prev].sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                resetForm();
            };

            const handleEditClick = (r) => { setEditingId(r.id); setDate(r.date); setCustomerName(r.customerName); setItemsCount(r.itemsCount); setWholesaleCost(r.wholesaleCost); setRevenue(r.revenue); setNote(r.note || ''); scrollToTop(); };
            const changeStatus = (id, s) => setPreorders(prev => prev.map(p => p.id === id ? { ...p, status: s } : p));

            const filteredList = preorders.filter(p => activeFilter === 'all' || p.status === activeFilter);
            const totalItems = filteredList.reduce((sum, p) => sum + (Number(p.itemsCount)||0), 0);
            const totalWholesale = filteredList.reduce((sum, p) => sum + (Number(p.wholesaleCost)||0), 0);
            const totalRevenue = filteredList.reduce((sum, p) => sum + (Number(p.revenue)||0), 0);

            const filters = [{ id: 'all', label: '全部' }, { id: 'pending', label: '待叫貨' }, { id: 'ordered', label: '已叫貨' }, { id: 'arrived', label: '已到貨' }, { id: 'completed', label: '已出貨' }];
            const getStatusConfig = (s) => {
                switch(s) {
                    case 'pending': return { text: '待叫貨', color: 'bg-gray-100 text-gray-600', nextBtn: '標記為已叫貨', nextStatus: 'ordered', nextColor: 'bg-[#ffb74d] text-white' };
                    case 'ordered': return { text: '已叫貨', color: 'bg-[#fff3e0] text-[#f57c00]', nextBtn: '標記為已到貨', nextStatus: 'arrived', nextColor: 'bg-[#64b5f6] text-white' };
                    case 'arrived': return { text: '已到貨', color: 'bg-[#e3f2fd] text-[#1976d2]', nextBtn: '已結算/出貨', nextStatus: 'completed', nextColor: 'bg-[#4caf50] text-white' };
                    case 'completed': return { text: '已出貨/結單', color: 'bg-[#e8f5e9] text-[#388e3c]' };
                    default: return { text: '不明', color: 'bg-gray-100 text-gray-600' };
                }
            };

            return (
                <div className="animate-fade-in pb-20">
                    <Card className={editingId ? 'border-2 border-[#5c6bc0]' : 'border border-[#e8eaf6]'}>
                        <div className="flex items-center mb-4 text-[#5c6bc0] font-bold text-lg"><Icon name={editingId ? 'edit' : 'add_circle'} className="mr-2" /> {editingId ? '編輯代購 / 預購紀錄' : '建立代購 / 預購訂單'}</div>
                        <Input type="date" value={date} onChange={e => setDate(e.target.value)} />
                        <div className="grid grid-cols-2 gap-3"><Input placeholder="客人姓名或暱稱" value={customerName} onChange={e => setCustomerName(e.target.value)} /><Input type="number" placeholder="商品件數" value={itemsCount} onChange={e => setItemsCount(e.target.value)} /></div>
                        <div className="grid grid-cols-2 gap-3"><Input type="number" placeholder="單筆總批價(成本)" value={wholesaleCost} onChange={e => setWholesaleCost(e.target.value)} /><Input type="number" placeholder="單筆總售價(實收)" value={revenue} onChange={e => setRevenue(e.target.value)} /></div>
                        <Input placeholder="備註(款式、顏色、尺寸)" value={note} onChange={e => setNote(e.target.value)} />
                        <div className="flex gap-3">{editingId && <Button onClick={resetForm} className="flex-1 bg-[#e8eaf6] !text-[#5c6bc0]">取消</Button>}<Button onClick={handleAddPreorder} className={editingId ? 'flex-[2] bg-[#5c6bc0] text-white' : 'w-full bg-[#5c6bc0] text-white'}>{editingId ? '儲存修改' : '建立單筆代購'}</Button></div>
                    </Card>

                    <div className="flex overflow-x-auto gap-2 mb-4 custom-scrollbar px-1">
                        {filters.map(f => <button key={f.id} onClick={() => setActiveFilter(f.id)} className={`px-4 py-2 rounded-full whitespace-nowrap text-sm font-bold transition-colors shadow-sm ${activeFilter === f.id ? 'bg-[#3949ab] text-white' : 'bg-white text-[#7986cb] border border-[#c5cae9]'}`}>{f.label}</button>)}
                    </div>

                    <Card className="bg-[#f8f9fa] border-none mb-4 p-3 shadow-inner">
                        <div className="flex justify-between items-center text-sm font-bold">
                            <div className="text-[#5c6bc0]">合計 <span className="text-lg">{totalItems}</span> 件</div>
                            <div className="flex gap-4 text-right">
                                <div className="flex flex-col"><span className="text-[10px] text-gray-500">預估總批價</span><span className="text-[#e57373]">${totalWholesale.toLocaleString()}</span></div>
                                <div className="flex flex-col"><span className="text-[10px] text-gray-500">應收總售價</span><span className="text-[#4caf50]">${totalRevenue.toLocaleString()}</span></div>
                            </div>
                        </div>
                    </Card>

                    {filteredList.length === 0 ? <div className="text-center text-[#c5cae9] text-sm py-8 mx-1 bg-white rounded-2xl border border-dashed border-[#c5cae9]">此分類目前沒有訂單！</div> : (
                        <div className="space-y-3 mx-1">
                        {filteredList.map(p => {
                            const conf = getStatusConfig(p.status);
                            const profit = (Number(p.revenue)||0) - (Number(p.wholesaleCost)||0);
                            const isCostPaid = ['arrived', 'completed'].includes(p.status);
                            const isRevReceived = p.status === 'completed';

                            return (
                                <div key={p.id} className="bg-white rounded-xl p-4 shadow-sm border border-[#e8eaf6] relative">
                                    <div className="absolute top-4 right-4 flex gap-1">
                                        <button onClick={() => handleEditClick(p)} className="p-1.5 text-[#5c6bc0] bg-[#e8eaf6] rounded-lg shadow-sm"><Icon name="edit" className="text-[18px]" /></button>
                                        <button onClick={() => setConfirmDialog({isOpen: true, id: p.id, collection: 'preorders', message: "確定要刪除這筆代購紀錄嗎？"})} className="p-1.5 text-[#e57373] bg-[#fdf2f2] rounded-lg shadow-sm"><Icon name="delete" className="text-[18px]" /></button>
                                    </div>
                                    <div className="flex items-center gap-2 mb-2"><div className="font-bold text-[#3949ab] text-lg">{p.customerName}</div><div className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${conf.color}`}>{conf.text}</div></div>
                                    <div className="text-xs text-gray-400 mb-2">{p.date} 建立 {p.itemsCount > 1 ? `| 共 ${p.itemsCount} 件` : ''}</div>
                                    {p.note && <div className="text-sm text-gray-600 mb-3 bg-gray-50 p-2 rounded-lg border border-gray-100">{p.note}</div>}
                                    
                                    <div className="grid grid-cols-2 gap-2 text-sm pt-2 border-t border-gray-100 mt-2">
                                        <div>批價成本: <span className="text-gray-500 font-bold">${p.wholesaleCost}</span>{isCostPaid ? <span className="text-[9px] bg-red-50 text-red-500 px-1 ml-1 rounded font-bold">已扣款</span> : <span className="text-[9px] bg-gray-100 text-gray-500 px-1 ml-1 rounded">未扣款</span>}</div>
                                        <div>實收售價: <span className="text-[#3949ab] font-bold">${p.revenue}</span>{isRevReceived ? <span className="text-[9px] bg-green-50 text-green-600 px-1 ml-1 rounded font-bold">已入帳</span> : <span className="text-[9px] bg-orange-50 text-orange-500 px-1 ml-1 rounded font-bold">待收</span>}</div>
                                    </div>
                                    <div className="text-right text-xs mt-1 font-bold text-[#4caf50]">單筆利潤: +${profit}</div>
                                    {conf.nextBtn && <button onClick={() => changeStatus(p.id, conf.nextStatus)} className={`w-full mt-3 py-2.5 rounded-xl font-bold flex justify-center items-center text-sm shadow-sm transition-colors ${conf.nextColor}`}>{conf.nextBtn} <Icon name="arrow_forward_ios" className="ml-1 text-[12px]" /></button>}
                                </div>
                            )
                        })}
                        </div>
                    )}
                </div>
            );
        };

        // --- 設定與備份 Modal ---
        const SettingsModal = ({ isOpen, onClose }) => {
            if (!isOpen) return null;
            const handleExport = () => {
                const data = { 
                    xq_deliveries: localStorage.getItem('xq_deliveries'), 
                    xq_marketSales: localStorage.getItem('xq_marketSales'), 
                    xq_expenses: localStorage.getItem('xq_expenses'), 
                    xq_reservations: localStorage.getItem('xq_reservations'), 
                    xq_preorders: localStorage.getItem('xq_preorders'), 
                    xq_tab1_preorders: localStorage.getItem('xq_tab1_preorders'), 
                    xq_settings: localStorage.getItem('xq_settings'), 
                    xq_market_sold: localStorage.getItem('xq_market_sold') 
                };
                const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `森衣好_資料備份_${new Date().toISOString().split('T')[0]}.json`; a.click(); URL.revokeObjectURL(url);
            };
            const handleImport = (e) => {
                const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const d = JSON.parse(event.target.result);
                        if(d.xq_deliveries) localStorage.setItem('xq_deliveries', d.xq_deliveries);
                        if(d.xq_marketSales) localStorage.setItem('xq_marketSales', d.xq_marketSales);
                        if(d.xq_expenses) localStorage.setItem('xq_expenses', d.xq_expenses);
                        if(d.xq_reservations) localStorage.setItem('xq_reservations', d.xq_reservations);
                        if(d.xq_preorders) localStorage.setItem('xq_preorders', d.xq_preorders);
                        if(d.xq_tab1_preorders) localStorage.setItem('xq_tab1_preorders', d.xq_tab1_preorders); 
                        if(d.xq_settings) localStorage.setItem('xq_settings', d.xq_settings);
                        if(d.xq_market_sold) localStorage.setItem('xq_market_sold', d.xq_market_sold);
                        alert('✅ 資料匯入成功！系統將為您重新整理畫面。'); window.location.reload();
                    } catch(err) { alert('❌ 匯入失敗！檔案格式不正確。'); }
                }; reader.readAsText(file);
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[120] animate-fade-in px-4">
                    <div className="bg-[#fdfaf7] rounded-3xl p-6 w-full max-w-sm shadow-2xl relative">
                        <button onClick={onClose} className="absolute top-4 right-4 text-[#a89689] p-1 bg-white rounded-full shadow-sm"><Icon name="close" /></button>
                        <div className="text-center text-[#5c4d43] font-bold mb-6 text-xl"><div className="bg-white p-3 rounded-full mb-2 shadow-sm inline-block border border-[#f2e7df]"><Icon name="save" className="text-[28px] text-[#bc9f8b]" /></div><br/>系統設定與備份</div>
                        <div className="space-y-4">
                            <div className="bg-white p-4 rounded-xl border border-[#c8e6c9] shadow-sm">
                                <div className="font-bold text-[#2e7d32] mb-1"><Icon name="download" className="mr-1 text-[18px] align-text-bottom"/>匯出備份 (下載)</div>
                                <div className="text-xs text-[#4caf50] mb-3">下載 JSON 檔，可透過 LINE 傳給合夥人共享。</div>
                                <button onClick={handleExport} className="w-full py-3 bg-[#4caf50] text-white font-bold rounded-lg shadow-sm">下載備份檔</button>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-[#ffe0b2] shadow-sm">
                                <div className="font-bold text-[#ef6c00] mb-1"><Icon name="upload" className="mr-1 text-[18px] align-text-bottom"/>匯入備份 (還原)</div>
                                <div className="text-xs text-[#ff9800] mb-3">選擇備份檔。<strong className="text-red-500">注意：會覆蓋現有資料！</strong></div>
                                <label className="w-full py-3 bg-[#ff9800] text-white font-bold rounded-lg shadow-sm flex justify-center cursor-pointer">選擇檔案並匯入<input type="file" accept=".json" className="hidden" onChange={handleImport} /></label>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('report');
            const [showSettings, setShowSettings] = useState(false);
            
            const [deliveriesRaw, setDeliveriesRaw] = useLocalStorage('xq_deliveries', []);
            const [marketSalesRaw, setMarketSalesRaw] = useLocalStorage('xq_marketSales', []);
            const [expensesRaw, setExpensesRaw] = useLocalStorage('xq_expenses', []);
            const [reservationsRaw, setReservationsRaw] = useLocalStorage('xq_reservations', []);
            const [preordersRaw, setPreordersRaw] = useLocalStorage('xq_preorders', []);
            const [tab1PreordersRaw, setTab1PreordersRaw] = useLocalStorage('xq_tab1_preorders', []);
            const [settingsRaw, setSettingsRaw] = useLocalStorage('xq_settings', { monthlyGoal: 100000, startupCapital: 36284 });
            const [marketSoldStatsRaw, setMarketSoldStatsRaw] = useLocalStorage('xq_market_sold', {});

            const deliveries = getSafeArr(deliveriesRaw);
            const marketSales = getSafeArr(marketSalesRaw);
            const expenses = getSafeArr(expensesRaw);
            const reservations = getSafeArr(reservationsRaw);
            const preorders = getSafeArr(preordersRaw);
            const tab1Preorders = getSafeArr(tab1PreordersRaw);
            const settings = (typeof settingsRaw === 'object' && settingsRaw !== null && !Array.isArray(settingsRaw)) ? settingsRaw : { monthlyGoal: 100000, startupCapital: 36284 };
            const marketSoldStats = (typeof marketSoldStatsRaw === 'object' && marketSoldStatsRaw !== null && !Array.isArray(marketSoldStatsRaw)) ? marketSoldStatsRaw : {};

            const setDeliveries = (u) => setDeliveriesRaw(p => typeof u === 'function' ? u(getSafeArr(p)) : u);
            const setMarketSales = (u) => setMarketSalesRaw(p => typeof u === 'function' ? u(getSafeArr(p)) : u);
            const setExpenses = (u) => setExpensesRaw(p => typeof u === 'function' ? u(getSafeArr(p)) : u);
            const setReservations = (u) => setReservationsRaw(p => typeof u === 'function' ? u(getSafeArr(p)) : u);
            const setPreorders = (u) => setPreordersRaw(p => typeof u === 'function' ? u(getSafeArr(p)) : u);
            const setTab1Preorders = (u) => setTab1PreordersRaw(p => typeof u === 'function' ? u(getSafeArr(p)) : u);
            const setSettings = (u) => setSettingsRaw(p => typeof u === 'function' ? u(p) : u);
            const setMarketSoldStats = (u) => setMarketSoldStatsRaw(p => typeof u === 'function' ? u(p) : u);
            
            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, id: null, collection: '', message: '' });

            const executeDelete = () => {
                const { id, collection } = confirmDialog;
                if(id && collection) {
                    if (collection === 'deliveries') setDeliveries(prev => prev.filter(d => d.id !== id));
                    if (collection === 'market_sales') setMarketSales(prev => prev.filter(m => m.id !== id));
                    if (collection === 'expenses') setExpenses(prev => prev.filter(e => e.id !== id));
                    if (collection === 'reservations') setReservations(prev => prev.filter(r => r.id !== id));
                    if (collection === 'preorders') setPreorders(prev => prev.filter(p => p.id !== id));
                    if (collection === 'tab1_preorders') setTab1Preorders(prev => prev.filter(p => p.id !== id));
                }
                setConfirmDialog({isOpen: false, id: null, collection: '', message: ''});
            };

            return (
                <ErrorBoundary>
                    <div className="flex flex-col h-screen custom-scrollbar text-[#5c4d43] max-w-lg mx-auto bg-[#fdfaf7] shadow-2xl relative">
                        <header className="bg-[#bc9f8b] text-white pt-6 pb-4 px-5 flex justify-between items-center shadow-md sticky top-0 z-10">
                            <div className="flex items-center text-2xl font-bold tracking-widest drop-shadow-sm">💰 200%森衣好</div>
                            <button onClick={() => setShowSettings(true)} className="p-1.5 bg-white bg-opacity-20 rounded-full hover:bg-opacity-30 transition-colors">
                                <Icon name="settings" className="text-[20px]" />
                            </button>
                        </header>
                        
                        <main id="main-content" className="flex-1 overflow-y-auto p-4 relative custom-scrollbar">
                            {activeTab === 'store' && <StoreTab deliveries={deliveries} setDeliveries={setDeliveries} reservations={reservations} setReservations={setReservations} tab1Preorders={tab1Preorders} setTab1Preorders={setTab1Preorders} setConfirmDialog={setConfirmDialog} />}
                            {activeTab === 'market' && <MarketTab marketSales={marketSales} setMarketSales={setMarketSales} expenses={expenses} setConfirmDialog={setConfirmDialog} />}
                            {activeTab === 'expense' && <ExpenseTab expenses={expenses} setExpenses={setExpenses} setConfirmDialog={setConfirmDialog} />}
                            {activeTab === 'report' && <ReportTab deliveries={deliveries} marketSales={marketSales} expenses={expenses} preorders={preorders} settings={settings} setSettings={setSettings} marketSoldStats={marketSoldStats} setMarketSoldStats={setMarketSoldStats} setDialog={setConfirmDialog} />}
                            {activeTab === 'preorder' && <PreorderTab preorders={preorders} setPreorders={setPreorders} setConfirmDialog={setConfirmDialog} />}
                        </main>

                        <nav className="bg-white border-t border-[#f2e7df] flex justify-around pb-safe pt-2 fixed bottom-0 w-full max-w-lg z-10 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] px-1">
                            {[ 
                               { id: 'store', icon: 'inventory_2', label: '現貨超商' }, 
                               { id: 'market', icon: 'storefront', label: '現貨市場' },
                               { id: 'expense', icon: 'payments', label: '現貨支出' },
                               { id: 'report', icon: 'bar_chart', label: '營運報表' },
                               { id: 'preorder', icon: 'local_shipping', label: '代購', color: 'text-[#5c6bc0]' }
                            ].map(t => {
                                const isActive = activeTab === t.id;
                                return (
                                    <button key={t.id} onClick={() => { setActiveTab(t.id); scrollToTop(); }} className={`flex flex-col items-center justify-center py-1 w-full transition-colors relative ${isActive ? (t.color||'text-[#bc9f8b]') : 'text-[#c4b5aa]'}`}>
                                        <Icon name={t.icon} className="mb-0.5 text-[22px]" />
                                        <span className={`text-[10px] tracking-tighter ${isActive ? 'font-black' : 'font-medium'}`}>{t.label}</span>
                                        {isActive && <div className={`absolute top-0 w-6 h-1 rounded-b-full ${t.id==='preorder'?'bg-[#5c6bc0]':'bg-[#bc9f8b]'}`}></div>}
                                    </button>
                                );
                            })}
                        </nav>
                        <SettingsModal isOpen={showSettings} onClose={() => setShowSettings(false)} />
                        <ConfirmModal isOpen={confirmDialog.isOpen} message={confirmDialog.message || "確定要刪除這筆紀錄嗎？"} onConfirm={executeDelete} onCancel={() => setConfirmDialog({isOpen: false, id: null, collection: '', message: ''})} />
                    </div>
                </ErrorBoundary>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
