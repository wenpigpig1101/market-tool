            const openTransferModal = (record) => {
                setTransferRecord(record); setTDate(new Date().toISOString().split('T')[0]);
                setTRevenue(''); setTSoldQty(record.itemsCount); 
                setTShippingExpense(''); setTShippingIncome(''); setTHasGift(false); setTGiftCount('');
            };

            const handleTransferSubmit = () => {
                if (!transferRecord) return;
                const newDelivery = {
                    id: Date.now().toString(), date: tDate, customerName: transferRecord.customerName,
                    revenue: Number(tRevenue) || 0, soldQty: Number(tSoldQty) || 1,
                    shippingExpense: Number(tShippingExpense) || 0, shippingIncome: Number(tShippingIncome) || 0,
                    hasGift: tHasGift, giftCount: tHasGift ? (Number(tGiftCount) || 0) : 0, status: 'pending' 
                };
                setDeliveries(prev => [newDelivery, ...prev].sort((a,b)=> safeTime(b.date) - safeTime(a.date)));

            return (

        // --- 應用程式主體 ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('store');
            
            const [deliveriesRaw, setDeliveriesRaw] = useLocalStorage('xq_deliveries', []);
            const [marketSalesRaw, setMarketSalesRaw] = useLocalStorage('xq_marketSales', []);
            const [expensesRaw, setExpensesRaw] = useLocalStorage('xq_expenses', []);
            const [reservationsRaw, setReservationsRaw] = useLocalStorage('xq_reservations', []);
            const [settingsRaw, setSettingsRaw] = useLocalStorage('xq_settings', { monthlyGoal: 100000, startupCapital: 36284 });
            const [marketSoldStatsRaw, setMarketSoldStatsRaw] = useLocalStorage('xq_market_sold', {});

            const deliveries = getSafeArr(deliveriesRaw);
            const marketSales = getSafeArr(marketSalesRaw);
            const expenses = getSafeArr(expensesRaw);
            const reservations = getSafeArr(reservationsRaw);
            const settings = (typeof settingsRaw === 'object' && settingsRaw !== null && !Array.isArray(settingsRaw)) ? settingsRaw : { monthlyGoal: 100000, startupCapital: 36284 };
            const marketSoldStats = (typeof marketSoldStatsRaw === 'object' && marketSoldStatsRaw !== null && !Array.isArray(marketSoldStatsRaw)) ? marketSoldStatsRaw : {};

            const setDeliveries = (updater) => setDeliveriesRaw(prev => typeof updater === 'function' ? updater(getSafeArr(prev)) : updater);
            const setMarketSales = (updater) => setMarketSalesRaw(prev => typeof updater === 'function' ? updater(getSafeArr(prev)) : updater);
            const setExpenses = (updater) => setExpensesRaw(prev => typeof updater === 'function' ? updater(getSafeArr(prev)) : updater);
            const setReservations = (updater) => setReservationsRaw(prev => typeof updater === 'function' ? updater(getSafeArr(prev)) : updater);
            const setSettings = (updater) => setSettingsRaw(prev => typeof updater === 'function' ? updater((typeof prev === 'object' && prev !== null && !Array.isArray(prev)) ? prev : { monthlyGoal: 100000, startupCapital: 36284 }) : updater);
            const setMarketSoldStats = (updater) => setMarketSoldStatsRaw(prev => typeof updater === 'function' ? updater((typeof prev === 'object' && prev !== null && !Array.isArray(prev)) ? prev : {}) : updater);
            
            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, id: null, collection: '' });

            const executeDelete = () => {
                const { id, collection } = confirmDialog;
                if(id && collection) {
                    if (collection === 'deliveries') setDeliveries(prev => prev.filter(d => d.id !== id));
                    if (collection === 'market_sales') setMarketSales(prev => prev.filter(m => m.id !== id));
                    if (collection === 'expenses') setExpenses(prev => prev.filter(e => e.id !== id));
                    if (collection === 'reservations') setReservations(prev => prev.filter(r => r.id !== id));
                }
                setConfirmDialog({isOpen: false, id: null, collection: ''});
            };

            return (
                <ErrorBoundary>
                    <div className="flex flex-col h-screen custom-scrollbar text-[#5c4d43] max-w-lg mx-auto bg-[#fdfaf7] shadow-2xl relative">
                        <header className="bg-[#bc9f8b] text-white pt-6 pb-4 px-5 flex justify-between items-center shadow-md sticky top-0 z-10">
                            <div className="flex items-center text-2xl font-bold tracking-widest drop-shadow-sm">💰 200%森衣好</div>
                            <button className="p-1.5 bg-white bg-opacity-20 rounded-full"><Icon name="settings" className="text-[20px]" /></button>
                        </header>
                        
                        <main id="main-content" className="flex-1 overflow-y-auto p-4 relative custom-scrollbar">
                            {activeTab === 'store' && <StoreTab deliveries={deliveries} setDeliveries={setDeliveries} setConfirmDialog={setConfirmDialog} />}
                            {activeTab === 'market' && <MarketTab marketSales={marketSales} setMarketSales={setMarketSales} setConfirmDialog={setConfirmDialog} />}
                            {activeTab === 'expense' && <ExpenseTab expenses={expenses} setExpenses={setExpenses} setConfirmDialog={setConfirmDialog} />}
                            {activeTab === 'report' && <ReportTab deliveries={deliveries} marketSales={marketSales} expenses={expenses} settings={settings} setSettings={setSettings} marketSoldStats={marketSoldStats} setMarketSoldStats={setMarketSoldStats} />}
                            {activeTab === 'reserve' && <ReserveTab reservations={reservations} setReservations={setReservations} setDeliveries={setDeliveries} setConfirmDialog={setConfirmDialog} />}
                        </main>

                        <nav className="bg-white border-t border-[#f2e7df] flex justify-around pb-safe pt-2 fixed bottom-0 w-full max-w-lg z-10 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] px-1">
                            {[ 
                               { id: 'store', icon: 'inventory_2', label: '超商' }, 
                               { id: 'market', icon: 'storefront', label: '市場' },
                               { id: 'expense', icon: 'payments', label: '支出' },
                               { id: 'report', icon: 'bar_chart', label: '報表' }, 
                               { id: 'reserve', icon: 'diamond', label: '留貨', color: 'text-[#64b5f6]' }
                            ].map(t => (
                                <button key={t.id} onClick={() => { setActiveTab(t.id); scrollToTop(); }} className={`flex flex-col items-center p-1.5 w-full transition-colors ${activeTab === t.id ? 'text-[#bc9f8b] font-bold' : 'text-[#c4b5aa]'} relative`}>
                                    <Icon name={t.icon} className={`mb-1 ${t.id === 'reserve' && activeTab === t.id ? t.color : ''}`} />
                                    <span className="text-[10px] font-bold tracking-wide">{t.label}</span>
                                    {activeTab === t.id && <div className="absolute top-0 w-8 h-1 bg-[#bc9f8b] rounded-b-full"></div>}
                                </button>
                            ))}
                        </nav>
                        
                        <ConfirmModal isOpen={confirmDialog.isOpen} message="確定要刪除這筆紀錄嗎？" onConfirm={executeDelete} onCancel={() => setConfirmDialog({isOpen: false, id: null, collection: ''})} />
                    </div>
                </ErrorBoundary>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
