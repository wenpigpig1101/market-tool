<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>200%向錢衝</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google 字體與 Material 圖示 -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    
    <!-- React & Babel -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>

    <style>
        body { background-color: #fdfaf7; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .font-wawa { font-family: 'HanziPen TC', 'Hannotate TC', 'DFWawaTC-W5', '華康娃娃體', 'M PLUS Rounded 1c', sans-serif !important; }
        input::placeholder { font-family: 'HanziPen TC', 'Hannotate TC', 'M PLUS Rounded 1c', sans-serif; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="font-wawa text-[#5c4d43]">
    <div id="root">
        <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #bc9f8b; font-weight: bold; font-size: 1.2rem;">
            <div style="width: 40px; height: 40px; border: 4px solid #f2e7df; border-top-color: #bc9f8b; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
            載入企業會計系統中...💰
            <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
        </div>
    </div>

    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            document.getElementById('root').innerHTML = '<div style="padding: 30px; text-align: center; color: #e57373;"><h3>糟糕，啟動失敗了！</h3><p>可能是手機瀏覽器阻擋了某些功能（例如開啟了無痕模式）。</p><p style="font-size:12px; margin-top:10px;">錯誤訊息: ' + msg + '</p></div>';
            return false;
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 自訂 Hook：本機儲存 (防崩潰版) ---
        const useLocalStorage = (key, initialValue) => {
            const [value, setValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) { return initialValue; }
            });

            useEffect(() => {
                try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (error) { console.warn("寫入儲存空間失敗", error); }
            }, [key, value]);

            return [value, setValue];
        };

        const scrollToTop = () => {
            const main = document.getElementById('main-content');
            if(main) main.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // --- 共用 UI 元件 ---
        const Icon = ({ name, className = "" }) => <span className={`material-symbols-outlined ${className}`}>{name}</span>;
        const Card = ({ children, className = "" }) => <div className={`bg-white rounded-2xl p-4 shadow-sm border border-[#f2e7df] mb-4 ${className}`}>{children}</div>;
        
        const Input = ({ label, value, onChange, type = "text", placeholder, disabled }) => (
            <div className="mb-3">
                <div className={`flex items-center bg-[#fdfdfd] border border-[#f0e6e0] rounded-xl px-3 h-[48px] focus-within:border-[#bc9f8b] transition-colors ${disabled ? 'opacity-60 bg-[#f9f9f9]' : ''}`}>
                    <input type={type} value={value} onChange={onChange} placeholder={placeholder || label} disabled={disabled}
                        className="bg-transparent w-full h-full outline-none text-[#5c4d43] placeholder-[#c4b5aa] text-[15px] font-wawa" />
                </div>
            </div>
        );

        const Button = ({ children, onClick, className = "" }) => (
            <button onClick={onClick} className={`w-full h-[48px] rounded-xl font-bold transition-colors text-[15px] text-center flex justify-center items-center font-wawa tracking-wide shadow-sm ${className}`}>
                {children}
            </button>
        );

        const ConfirmModal = ({ isOpen, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 animate-fade-in px-4">
                    <div className="bg-white rounded-2xl p-6 w-full max-w-xs shadow-xl">
                        <div className="text-center text-[#5c4d43] font-bold mb-6 text-lg">{message}</div>
                        <div className="flex gap-3">
                            <button onClick={onCancel} className="flex-1 py-3 rounded-xl bg-[#f2e7df] text-[#7a6453] font-bold">取消</button>
                            <button onClick={onConfirm} className="flex-1 py-3 rounded-xl bg-[#e57373] text-white font-bold">確定刪除</button>
                        </div>
                    </div>
                </div>
            );
        };

        const formatRevenueStr = (num) => {
            if (num >= 10000) return Number.isInteger(num / 10000) ? `${num / 10000}萬` : `${(num / 10000).toFixed(1)}萬`;
            if (num >= 1000) return Number.isInteger(num / 1000) ? `${num / 1000}千` : `${(num / 1000).toFixed(1)}千`;
            return num.toString();
        };

        // --- 分頁 1：超商 (保留詳細件數) ---
        const StoreTab = ({ deliveries, setDeliveries, setConfirmDialog }) => {
            const [editingId, setEditingId] = useState(null);
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [customerName, setCustomerName] = useState('');
            const [revenue, setRevenue] = useState('');
            const [soldQty, setSoldQty] = useState(''); // 寄件保留件數
            const [shippingExpense, setShippingExpense] = useState('');
            const [shippingIncome, setShippingIncome] = useState('');
            const [hasGift, setHasGift] = useState(false);
            const [giftCount, setGiftCount] = useState('');

            const resetForm = () => {
                setEditingId(null);
                setDate(new Date().toISOString().split('T')[0]);
                setCustomerName(''); setRevenue(''); setSoldQty(''); setShippingExpense(''); setShippingIncome(''); setGiftCount(''); setHasGift(false);
            };

            const handleAddDelivery = () => {
                if (!customerName) return;
                const recordData = {
                    date, customerName, 
                    revenue: Number(revenue) || 0, 
                    soldQty: Number(soldQty) || 1, // 預設 1 件
                    shippingExpense: Number(shippingExpense) || 0, shippingIncome: Number(shippingIncome) || 0,
                    hasGift, giftCount: hasGift ? (Number(giftCount) || 0) : 0, status: 'pending'
                };

                if (editingId) {
                    setDeliveries(prev => prev.map(d => d.id === editingId ? { ...d, ...recordData } : d).sort((a,b)=>new Date(b.date)-new Date(a.date)));
                } else {
                    const newRecord = { id: Date.now().toString(), ...recordData };
                    setDeliveries(prev => [newRecord, ...prev].sort((a,b)=>new Date(b.date)-new Date(a.date)));
                }
                resetForm();
            };

            const handleEditClick = (record) => {
                setEditingId(record.id);
                setDate(record.date); setCustomerName(record.customerName); 
                setRevenue(record.revenue || ''); setSoldQty(record.soldQty || '');
                setShippingExpense(record.shippingExpense || ''); setShippingIncome(record.shippingIncome || '');
                setHasGift(record.hasGift || false); setGiftCount(record.giftCount || '');
                scrollToTop();
            };

            const toggleStatus = (id, currentStatus) => {
                const newStatus = currentStatus === 'pending' ? 'shipped' : 'pending';
                setDeliveries(prev => prev.map(d => d.id === id ? { ...d, status: newStatus } : d));
            };

            const pending = deliveries.filter(d => d.status === 'pending');
            const shipped = deliveries.filter(d => d.status === 'shipped');

            return (
                <div className="animate-fade-in pb-20">
                    <Card className={editingId ? 'border-2 border-[#bc9f8b]' : ''}>
                        <div className="flex items-center mb-4 text-[#7a6453] font-bold text-lg">
                            <Icon name={editingId ? 'edit' : 'inventory_2'} className="mr-2 text-[#bc9f8b]" /> 
                            {editingId ? '編輯寄件資料' : '新增寄件'}
                        </div>
                        <Input type="date" value={date} onChange={e => setDate(e.target.value)} />
                        <Input placeholder="顧客姓名" value={customerName} onChange={e => setCustomerName(e.target.value)} />
                        
                        <div className="grid grid-cols-2 gap-3">
                            <Input type="number" placeholder="商品售價(總額)" value={revenue} onChange={e => setRevenue(e.target.value)} />
                            <Input type="number" placeholder="售出服飾件數" value={soldQty} onChange={e => setSoldQty(e.target.value)} />
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            <Input type="number" placeholder="賣家付運費(成本)" value={shippingExpense} onChange={e => setShippingExpense(e.target.value)} />
                            <Input type="number" placeholder="買家付運費(代收)" value={shippingIncome} onChange={e => setShippingIncome(e.target.value)} />
                        </div>
                        
                        <div className="grid grid-cols-2 gap-3 mb-4">
                            <button 
                                className={`w-full h-[48px] rounded-xl border text-[15px] transition-colors font-wawa font-bold flex items-center justify-center ${hasGift ? 'border-[#bc9f8b] bg-[#fdfaf7] text-[#bc9f8b]' : 'border-[#f0e6e0] bg-[#fdfdfd] text-[#a89689]'}`} 
                                onClick={(e) => { e.preventDefault(); setHasGift(!hasGift); }}>
                                🎁 {hasGift ? '有贈品' : '無贈品'}
                            </button>
                            <div className={`flex items-center bg-[#fdfdfd] border border-[#f0e6e0] rounded-xl px-3 h-[48px] focus-within:border-[#bc9f8b] transition-colors ${!hasGift ? 'opacity-60 bg-[#f9f9f9]' : ''}`}>
                                <input type="number" placeholder="贈品數量" value={giftCount} onChange={e => setGiftCount(e.target.value)} disabled={!hasGift} className="bg-transparent w-full h-full outline-none text-[#5c4d43] placeholder-[#c4b5aa] text-[15px] font-wawa" />
                            </div>
                        </div>
                        
                        <div className="flex gap-3">
                            {editingId && (
                                <Button onClick={resetForm} className="flex-1 bg-[#f2e7df] !text-[#7a6453]">取消</Button>
                            )}
                            <Button onClick={handleAddDelivery} className={editingId ? 'flex-[2] bg-[#bc9f8b] text-white' : 'w-full bg-[#bc9f8b] text-white'}>
                                {editingId ? '儲存修改' : '新增寄件'}
                            </Button>
                        </div>
                    </Card>

                    <div className="mt-6 mb-2 flex items-center text-[#9b4949] font-bold px-2 text-lg"><Icon name="push_pin" className="mr-1 text-[20px]" /> 未寄出 <span className="ml-2 bg-[#d6aba3] text-white text-xs px-2 py-0.5 rounded-full">{pending.length}</span></div>
                    {pending.length === 0 ? <div className="text-center text-[#c4b5aa] text-sm py-4">太棒了，目前沒有未寄出清單！</div> : pending.map(d => (
                        <div key={d.id} className="bg-white rounded-xl p-3 mb-2 shadow-sm border border-[#f2e7df] flex justify-between items-center px-4">
                            <div>
                                <div className="font-bold text-[#5c4d43] text-base">{d.customerName}</div>
                                <div className="text-xs text-[#a89689] mt-0.5">{d.date} | 售:${d.revenue} <span className="ml-1 bg-orange-50 text-[#bc9f8b] px-1 rounded">{d.soldQty || 1}件</span></div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => toggleStatus(d.id, d.status)} className="p-2 bg-[#f0f9f0] text-[#4caf50] rounded-lg shadow-sm"><Icon name="check_box" /></button>
                                <button onClick={() => handleEditClick(d)} className="p-2 bg-[#fdfaf7] text-[#bc9f8b] rounded-lg shadow-sm"><Icon name="edit" className="text-[20px]" /></button>
                                <button onClick={() => setConfirmDialog({isOpen: true, id: d.id, collection: 'deliveries'})} className="p-2 bg-[#fdf2f2] text-[#e57373] rounded-lg shadow-sm"><Icon name="delete" className="text-[20px]" /></button>
                            </div>
                        </div>
                    ))}

                    <div className="mt-6 mb-2 flex items-center text-[#4caf50] font-bold px-2 text-lg"><Icon name="check_box" className="mr-1 text-[20px]" /> 已寄出 <span className="ml-2 bg-[#a5d6a7] text-white text-xs px-2 py-0.5 rounded-full">{shipped.length}</span></div>
                    {shipped.length === 0 ? <div className="text-center text-[#c4b5aa] text-sm py-4">尚無紀錄</div> : shipped.slice(0,10).map(d => (
                        <div key={d.id} className="bg-[#fafafa] rounded-xl p-3 mb-2 border border-[#f0f0f0] flex justify-between items-center px-4 opacity-70">
                            <div><div className="font-bold text-[#7a6453] line-through text-base">{d.customerName}</div><div className="text-xs text-[#a89689] mt-0.5">{d.date}</div></div>
                            <div className="flex gap-2">
                                <button onClick={() => toggleStatus(d.id, d.status)} className="p-2 text-[#a89689]"><Icon name="undo" /></button>
                                <button onClick={() => handleEditClick(d)} className="p-2 text-[#bc9f8b]"><Icon name="edit" className="text-[18px]" /></button>
                                <button onClick={() => setConfirmDialog({isOpen: true, id: d.id, collection: 'deliveries'})} className="p-2 text-[#e57373]"><Icon name="delete" className="text-[18px]" /></button>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        // --- 分頁 2：市場 (極簡版，移除售出件數) ---
        const MarketTab = ({ marketSales, setMarketSales, setConfirmDialog }) => {
            const currentDate = new Date().toISOString().split('T')[0];
            const [editingId, setEditingId] = useState(null);
            
            const [date, setDate] = useState(currentDate);
            const [location, setLocation] = useState('');
            const [revenue, setRevenue] = useState('');
            const [rent, setRent] = useState('');
            const [note, setNote] = useState('');
            const [electricity, setElectricity] = useState('');
            const [cleaning, setCleaning] = useState('');
            const [gas, setGas] = useState('');
            const [toll, setToll] = useState('');
            const [hasGift, setHasGift] = useState(false);
            const [giftCount, setGiftCount] = useState('');
            const [acc, setAcc] = useState({ necklace: '', hat: '', bag: '', other: '' });

            const [viewMonthStr, setViewMonthStr] = useState(currentDate.substring(0, 7));
            const [selectedDay, setSelectedDay] = useState(currentDate);

            const dailyRevenues = useMemo(() => {
                const revs = {};
                marketSales.forEach(m => {
                    if (m.date.startsWith(viewMonthStr)) revs[m.date] = (revs[m.date] || 0) + (Number(m.revenue) || 0);
                });
                return revs;
            }, [marketSales, viewMonthStr]);

            const resetForm = () => {
                setEditingId(null); setDate(currentDate); setLocation(''); setRevenue(''); setRent(''); setNote(''); 
                setElectricity(''); setCleaning(''); setGas(''); setToll(''); setHasGift(false); setGiftCount(''); 
                setAcc({ necklace: '', hat: '', bag: '', other: '' });
            };

            const handleAddMarket = () => {
                if (!location) return;
                const recordData = {
                    date, location, 
                    revenue: Number(revenue) || 0, // 移除 soldQty
                    rent: Number(rent) || 0, note,
                    electricity: Number(electricity) || 0, cleaning: Number(cleaning) || 0,
                    gas: Number(gas) || 0, toll: Number(toll) || 0,
                    hasGift, giftCount: hasGift ? (Number(giftCount) || 0) : 0,
                    accessories: { necklace: Number(acc.necklace) || 0, hat: Number(acc.hat) || 0, bag: Number(acc.bag) || 0, other: Number(acc.other) || 0 }
                };
                
                if (editingId) {
                    setMarketSales(prev => prev.map(m => m.id === editingId ? { ...m, ...recordData } : m).sort((a,b)=>new Date(b.date)-new Date(a.date)));
                } else {
                    const newRecord = { id: Date.now().toString(), ...recordData };
                    setMarketSales(prev => [newRecord, ...prev].sort((a,b)=>new Date(b.date)-new Date(a.date)));
                }
                resetForm();
            };

            const handleEditClick = (record) => {
                setEditingId(record.id);
                setDate(record.date); setLocation(record.location); setRevenue(record.revenue || '');
                setRent(record.rent || ''); setNote(record.note || ''); setElectricity(record.electricity || '');
                setCleaning(record.cleaning || ''); setGas(record.gas || ''); setToll(record.toll || '');
                setHasGift(record.hasGift || false); setGiftCount(record.giftCount || '');
                setAcc({
                    necklace: record.accessories?.necklace || '', hat: record.accessories?.hat || '',
                    bag: record.accessories?.bag || '', other: record.accessories?.other || ''
                });
                scrollToTop();
            };

            const changeMonth = (offset) => {
                const [year, month] = viewMonthStr.split('-');
                const newDate = new Date(parseInt(year, 10), parseInt(month, 10) - 1 + offset, 1);
                setViewMonthStr(`${newDate.getFullYear()}-${String(newDate.getMonth() + 1).padStart(2, '0')}`);
            };

            const renderCalendarDays = () => {
                const [year, month] = viewMonthStr.split('-');
                const y = parseInt(year, 10), m = parseInt(month, 10) - 1;
                const daysInMonth = new Date(y, m + 1, 0).getDate();
                const startDayOfWeek = new Date(y, m, 1).getDay();
                const days = [];
                for (let i = 0; i < startDayOfWeek; i++) days.push(<div key={`empty-${i}`} className="h-14"></div>);
                for (let i = 1; i <= daysInMonth; i++) {
                    const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                    const isSelected = dateStr === selectedDay;
                    const rev = dailyRevenues[dateStr] || 0;
                    const hasRev = rev > 0;
                    days.push(
                        <div key={dateStr} onClick={() => {setSelectedDay(dateStr); setDate(dateStr);}} className={`h-14 flex flex-col items-center justify-center rounded-xl cursor-pointer transition-all ${isSelected ? 'bg-[#bc9f8b] text-white shadow-md' : hasRev ? 'border border-[#bc9f8b] bg-[#fdfaf7] text-[#5c4d43]' : 'text-[#7a6453] hover:bg-[#f2e7df]'}`}>
                            <span className={`text-base font-bold ${isSelected ? 'text-white' : ''}`}>{i}</span>
                            {hasRev && <span className={`text-[10px] leading-tight ${isSelected ? 'text-[#f0e6e0]' : 'text-[#4caf50]'}`}>{formatRevenueStr(rev)}</span>}
                        </div>
                    );
                }
                return days;
            };

            const filteredSales = marketSales.filter(m => m.date === selectedDay);

            return (
                <div className="animate-fade-in pb-20">
                    <Card className={editingId ? 'border-2 border-[#bc9f8b]' : ''}>
                        <div className="flex items-center mb-4 text-[#7a6453] font-bold text-lg">
                            <Icon name={editingId ? 'edit' : 'storefront'} className="mr-2 text-[#bc9f8b]" /> 
                            {editingId ? '編輯市場營業' : '新增市場營業'}
                        </div>
                        <Input type="date" value={date} onChange={e => { setDate(e.target.value); setSelectedDay(e.target.value); setViewMonthStr(e.target.value.substring(0,7)); }} />
                        <div className="grid grid-cols-2 gap-3">
                            <Input placeholder="地點" value={location} onChange={e => setLocation(e.target.value)} />
                            <Input type="number" placeholder="當日總業績" value={revenue} onChange={e => setRevenue(e.target.value)} />
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <Input type="number" placeholder="攤位租金" value={rent} onChange={e => setRent(e.target.value)} />
                            <Input placeholder="備註 (選填)" value={note} onChange={e => setNote(e.target.value)} />
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <Input type="number" placeholder="電費 (選填)" value={electricity} onChange={e => setElectricity(e.target.value)} />
                            <Input type="number" placeholder="清潔費 (選填)" value={cleaning} onChange={e => setCleaning(e.target.value)} />
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <Input type="number" placeholder="油錢 (選填)" value={gas} onChange={e => setGas(e.target.value)} />
                            <Input type="number" placeholder="過路費 (選填)" value={toll} onChange={e => setToll(e.target.value)} />
                        </div>
                        
                        <div className="grid grid-cols-2 gap-3 mb-4">
                            <button 
                                className={`w-full h-[48px] rounded-xl border text-[15px] transition-colors font-wawa font-bold flex items-center justify-center ${hasGift ? 'border-[#bc9f8b] bg-[#fdfaf7] text-[#bc9f8b]' : 'border-[#f0e6e0] bg-[#fdfdfd] text-[#a89689]'}`} 
                                onClick={(e) => { e.preventDefault(); setHasGift(!hasGift); }}>
                                🎁 {hasGift ? '有贈品' : '無贈品'}
                            </button>
                            <div className={`flex items-center bg-[#fdfdfd] border border-[#f0e6e0] rounded-xl px-3 h-[48px] focus-within:border-[#bc9f8b] transition-colors ${!hasGift ? 'opacity-60 bg-[#f9f9f9]' : ''}`}>
                                <input type="number" placeholder="贈品數量" value={giftCount} onChange={e => setGiftCount(e.target.value)} disabled={!hasGift} className="bg-transparent w-full h-full outline-none text-[#5c4d43] placeholder-[#c4b5aa] text-[15px] font-wawa" />
                            </div>
                        </div>

                        <div className="border-t border-[#f2e7df] pt-4 mb-4">
                            <div className="flex items-center text-sm font-bold text-[#5c4d43] mb-3"><Icon name="diamond" className="mr-1 text-[#64b5f6] text-[18px]" /> 配飾販售數量 (不計入業績)</div>
                            <div className="grid grid-cols-4 gap-2 text-center text-xs text-[#a89689]">
                                {['項鍊', '帽子', '包包', '其他'].map((label, idx) => {
                                    const keys = ['necklace', 'hat', 'bag', 'other'];
                                    return (
                                        <div key={label}>
                                            <label className="block mb-1">{label}</label>
                                            <input type="number" value={acc[keys[idx]]} onChange={e=>setAcc({...acc, [keys[idx]]: e.target.value})} className="w-full h-[40px] bg-[#fdfdfd] border border-[#f0e6e0] rounded-lg px-2 text-center outline-none focus:border-[#bc9f8b] font-wawa" />
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                        
                        <div className="flex gap-3">
                            {editingId && (
                                <Button onClick={resetForm} className="flex-1 bg-[#f2e7df] !text-[#7a6453]">取消</Button>
                            )}
                            <Button onClick={handleAddMarket} className={editingId ? 'flex-[2] bg-[#bc9f8b] text-white' : 'w-full bg-[#bc9f8b] text-white'}>
                                {editingId ? '儲存修改' : '儲存紀錄'}
                            </Button>
                        </div>
                    </Card>

                    <Card className="px-2 pt-2 pb-4">
                        <div className="flex justify-between items-center px-2 mb-4 mt-2">
                            <button onClick={() => changeMonth(-1)} className="p-1.5 text-[#a89689] bg-[#fdfaf7] rounded-full hover:bg-[#f2e7df]"><Icon name="chevron_left" /></button>
                            <div className="font-bold text-[#7a6453] text-lg tracking-wider">{viewMonthStr.split('-')[0]}年 {parseInt(viewMonthStr.split('-')[1], 10)}月</div>
                            <button onClick={() => changeMonth(1)} className="p-1.5 text-[#a89689] bg-[#fdfaf7] rounded-full hover:bg-[#f2e7df]"><Icon name="chevron_right" /></button>
                        </div>
                        <div className="grid grid-cols-7 text-center text-xs font-bold text-[#a89689] mb-3">
                            <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                        </div>
                        <div className="grid grid-cols-7 gap-y-2 gap-x-1">{renderCalendarDays()}</div>
                    </Card>

                    <div className="mt-6 mb-2 flex items-center text-[#9b4949] font-bold px-2 text-lg">
                        <Icon name="location_on" className="mr-1 text-[20px]" /> {parseInt(selectedDay.split('-')[1], 10)}/{parseInt(selectedDay.split('-')[2], 10)} 營業紀錄 
                        <span className="ml-2 bg-[#f2e7df] text-[#7a6453] text-xs px-2.5 py-1 rounded-full font-bold">{filteredSales.length} 筆</span>
                    </div>
                    {filteredSales.length === 0 ? (
                        <div className="bg-white rounded-2xl border border-dashed border-[#e0d6ce] text-center text-[#c4b5aa] text-sm py-8 mx-2 mt-4">這天沒有擺攤，是休息日喔 ☕</div>
                    ) : filteredSales.map(m => {
                        const dailyMisc = (m.electricity || 0) + (m.cleaning || 0) + (m.gas || 0) + (m.toll || 0);
                        const operatingProfit = m.revenue - m.rent - dailyMisc; 
                        return (
                            <div key={m.id} className="bg-white rounded-xl p-4 mb-3 shadow-sm border border-[#f2e7df] relative mx-1">
                                <div className="absolute top-4 right-4 flex gap-1">
                                    <button onClick={() => handleEditClick(m)} className="p-1.5 bg-[#fdfaf7] text-[#bc9f8b] rounded-lg shadow-sm"><Icon name="edit" className="text-[18px]" /></button>
                                    <button onClick={() => setConfirmDialog({isOpen: true, id: m.id, collection: 'market_sales'})} className="p-1.5 bg-[#fdf2f2] text-[#e57373] rounded-lg shadow-sm"><Icon name="delete" className="text-[18px]" /></button>
                                </div>
                                <div className="font-bold text-[#5c4d43] mb-1 text-base flex items-center"><span className="bg-[#bc9f8b] w-2 h-2 rounded-full mr-2"></span>{m.location}</div>
                                {m.note && <div className="text-xs text-[#a89689] mb-2 pl-4">備註: {m.note}</div>}
                                <div className="text-sm text-[#7a6453] grid grid-cols-2 gap-y-1.5 mt-3 pt-3 border-t border-[#fdfaf7] pl-4">
                                    <div>營業額: <span className="font-bold text-[#5c4d43]">${m.revenue}</span></div>
                                    <div>攤租雜支: <span className="font-medium">-${m.rent + dailyMisc}</span></div>
                                    <div className="font-bold text-[#bc9f8b] col-span-2">未扣商品成本盈餘: ${operatingProfit}</div>
                                </div>
                            </div>
                        )
                    })}
                </div>
            );
        };

        // --- 分頁 3：全新支出紀錄 (自動計算平均單價) ---
        const ExpenseTab = ({ expenses, setExpenses, setConfirmDialog }) => {
            const [editingId, setEditingId] = useState(null);
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [type, setType] = useState('wholesale'); 
            const [name, setName] = useState('');
            const [amount, setAmount] = useState('');
            const [qty, setQty] = useState(''); // 新增：進貨件數

            const resetForm = () => {
                setEditingId(null); setDate(new Date().toISOString().split('T')[0]);
                setType('wholesale'); setName(''); setAmount(''); setQty('');
            };

            const handleAddExpense = () => {
                if (!name || !amount) return;
                const recordData = { 
                    date, type, name, 
                    amount: Number(amount),
                    qty: type === 'wholesale' ? (Number(qty) || 0) : 0
                };

                if (editingId) {
                    setExpenses(prev => prev.map(e => e.id === editingId ? { ...e, ...recordData } : e).sort((a,b)=>new Date(b.date)-new Date(a.date)));
                } else {
                    const newRecord = { id: Date.now().toString(), ...recordData };
                    setExpenses(prev => [newRecord, ...prev].sort((a,b)=>new Date(b.date)-new Date(a.date)));
                }
                resetForm();
            };

            const handleEditClick = (record) => {
                setEditingId(record.id);
                setDate(record.date); setType(record.type); setName(record.name); setAmount(record.amount); setQty(record.qty || '');
                scrollToTop();
            };

            const wholesaleTotal = expenses.filter(e => e.type === 'wholesale').reduce((sum, e) => sum + e.amount, 0);
            const supplyTotal = expenses.filter(e => e.type === 'supply').reduce((sum, e) => sum + e.amount, 0);
            const fixedTotal = expenses.filter(e => e.type === 'fixed').reduce((sum, e) => sum + e.amount, 0);
            const salaryTotal = expenses.filter(e => e.type === 'salary').reduce((sum, e) => sum + e.amount, 0);

            const typeConfig = {
                wholesale: { label: '批貨進貨', color: 'bg-[#e57373]', text: 'text-[#e57373]', bgLight: 'bg-[#ffebee]', placeholder: '批貨品名 / 廠商' },
                supply: { label: '生財/包材', color: 'bg-[#64b5f6]', text: 'text-[#64b5f6]', bgLight: 'bg-[#e0f7fa]', placeholder: '如: 品牌袋、衣架、文具' },
                fixed: { label: '倉租/水電', color: 'bg-[#81c784]', text: 'text-[#81c784]', bgLight: 'bg-[#e8f5e9]', placeholder: '如: 倉庫租金、水電網費' },
                salary: { label: '老闆支薪', color: 'bg-[#ffd54f]', text: 'text-[#fbc02d]', bgLight: 'bg-[#fffde7]', placeholder: '如: 8月老闆薪水' }
            };

            return (
                <div className="animate-fade-in pb-20">
                    <Card className={editingId ? `border-2 border-${typeConfig[type].color.split('-')[1]}` : ''}>
                        <div className="flex items-center mb-4 text-[#7a6453] font-bold text-lg">
                            <Icon name={editingId ? 'edit' : 'account_balance_wallet'} className="mr-2 text-[#7a6453]" /> 
                            {editingId ? '編輯支出紀錄' : '公司營運支出'}
                        </div>
                        
                        <div className="grid grid-cols-2 gap-2 mb-4">
                            {Object.keys(typeConfig).map(tKey => (
                                <button 
                                    key={tKey}
                                    onClick={() => { setType(tKey); setQty(''); }} 
                                    className={`py-2.5 rounded-xl text-sm font-bold transition-all border ${type === tKey ? `${typeConfig[tKey].color} text-white border-transparent shadow-md` : 'bg-white border-[#f0e6e0] text-[#a89689]'}`}>
                                    {typeConfig[tKey].label}
                                </button>
                            ))}
                        </div>

                        <Input type="date" value={date} onChange={e => setDate(e.target.value)} />
                        <Input placeholder={typeConfig[type].placeholder} value={name} onChange={e => setName(e.target.value)} />
                        
                        {type === 'wholesale' ? (
                            <div className="grid grid-cols-2 gap-3 mb-2">
                                <Input type="number" placeholder="支出總金額" value={amount} onChange={e => setAmount(e.target.value)} />
                                <Input type="number" placeholder="進貨總件數" value={qty} onChange={e => setQty(e.target.value)} />
                            </div>
                        ) : (
                            <Input type="number" placeholder="支出總金額" value={amount} onChange={e => setAmount(e.target.value)} />
                        )}

                        {type === 'wholesale' && amount && qty && (
                            <div className="text-right text-xs text-[#e57373] font-bold mb-3 px-1">
                                單筆平均進價：${(amount / qty).toFixed(1)} /件
                            </div>
                        )}
                        
                        <div className="flex gap-3">
                            {editingId && (
                                <Button onClick={resetForm} className="flex-1 bg-[#f2e7df] !text-[#7a6453]">取消</Button>
                            )}
                            <Button onClick={handleAddExpense} className={`${typeConfig[type].color} hover:opacity-90 text-white ${editingId ? 'flex-[2]' : 'w-full'}`}>
                                {editingId ? '儲存修改' : '儲存支出'}
                            </Button>
                        </div>
                    </Card>

                    <div className="grid grid-cols-2 gap-3 mb-6">
                        <div className="bg-white rounded-xl p-3 shadow-sm border border-[#f2e7df] text-center">
                            <div className="text-[11px] text-[#a89689] font-bold mb-1">累積批貨成本</div>
                            <div className="text-lg font-black text-[#e57373]">${wholesaleTotal.toLocaleString()}</div>
                        </div>
                        <div className="bg-white rounded-xl p-3 shadow-sm border border-[#f2e7df] text-center">
                            <div className="text-[11px] text-[#a89689] font-bold mb-1">累積生財/包材</div>
                            <div className="text-lg font-black text-[#64b5f6]">${supplyTotal.toLocaleString()}</div>
                        </div>
                        <div className="bg-white rounded-xl p-3 shadow-sm border border-[#f2e7df] text-center">
                            <div className="text-[11px] text-[#a89689] font-bold mb-1">累積倉租/水電</div>
                            <div className="text-lg font-black text-[#81c784]">${fixedTotal.toLocaleString()}</div>
                        </div>
                        <div className="bg-white rounded-xl p-3 shadow-sm border border-[#f2e7df] text-center">
                            <div className="text-[11px] text-[#a89689] font-bold mb-1">累積老闆支薪</div>
                            <div className="text-lg font-black text-[#fbc02d]">${salaryTotal.toLocaleString()}</div>
                        </div>
                    </div>

                    <div className="mb-2 flex items-center text-[#7a6453] font-bold px-2 text-lg">
                        <Icon name="history" className="mr-1 text-[20px]" /> 近期支出明細
                    </div>
                    {expenses.length === 0 ? <div className="text-center text-[#c4b5aa] text-sm py-8 bg-white rounded-2xl border border-dashed border-[#e0d6ce] mt-4 mx-2">目前尚無支出紀錄</div> : (
                        <div className="mt-4 space-y-3 mx-1">
                        {expenses.map(e => (
                            <div key={e.id} className="bg-white rounded-xl p-4 shadow-sm border border-[#f2e7df] flex justify-between items-center">
                                <div className="flex flex-col">
                                    <div className="flex items-center gap-2 mb-1">
                                        <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${typeConfig[e.type].bgLight} ${typeConfig[e.type].text}`}>
                                            {typeConfig[e.type].label.split('/')[0]}
                                        </span>
                                        <span className="font-bold text-[#5c4d43] text-base">{e.name}</span>
                                    </div>
                                    <div className="text-xs text-[#a89689]">
                                        {e.date} {e.type === 'wholesale' && e.qty > 0 && <span className="ml-1 text-[#e57373]">({e.qty}件)</span>}
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className={`font-black text-lg mr-2 ${typeConfig[e.type].text}`}>-${e.amount}</div>
                                    <button onClick={() => handleEditClick(e)} className="p-1.5 bg-[#fdfaf7] text-[#bc9f8b] rounded-lg shadow-sm"><Icon name="edit" className="text-[18px]" /></button>
                                    <button onClick={() => setConfirmDialog({isOpen: true, id: e.id, collection: 'expenses'})} className="p-1.5 bg-[#fdf2f2] text-[#e57373] rounded-lg shadow-sm"><Icon name="delete" className="text-[18px]" /></button>
                                </div>
                            </div>
                        ))}
                        </div>
                    )}
                </div>
            );
        }

        // --- 分頁 4：報表 (專業財報與盤點邏輯) ---
        const ReportTab = ({ deliveries, marketSales, expenses, settings, setSettings }) => {
            const [reportMonth, setReportMonth] = useState(() => {
                const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            });

            // 市場銷量結算紀錄: { '2026-08': 150 }
            const [marketSoldStats, setMarketSoldStats] = useLocalStorage('xq_market_sold', {});
            const [isCheckingInventory, setIsCheckingInventory] = useState(false);
            const [actualInv, setActualInv] = useState('');

            const changeMonth = (offset) => {
                const [year, month] = reportMonth.split('-');
                const d = new Date(parseInt(year, 10), parseInt(month, 10) - 1 + offset, 1);
                setReportMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
                setIsCheckingInventory(false);
                setActualInv('');
            };

            const handleGoalChange = () => {
                const newGoal = window.prompt("請輸入您的月淨利目標：", settings.monthlyGoal);
                if (newGoal && !isNaN(newGoal)) setSettings({ ...settings, monthlyGoal: Number(newGoal) });
            };

            // ---- 1. 計算【全期平均進貨單價】與全期庫存 ----
            const allWholesaleExpenses = expenses.filter(e => e.type === 'wholesale');
            const globalTotalWholesaleCost = allWholesaleExpenses.reduce((sum, e) => sum + e.amount, 0);
            const globalTotalWholesaleQty = allWholesaleExpenses.reduce((sum, e) => sum + (e.qty || 0), 0);
            const avgUnitCost = globalTotalWholesaleQty > 0 ? (globalTotalWholesaleCost / globalTotalWholesaleQty) : 0;

            const globalTotalStoreSoldQty = deliveries.filter(d=>d.status === 'shipped').reduce((sum, d) => sum + (d.soldQty || 1), 0);
            
            // 計算其他月份已結算的市場銷量總和
            let otherMonthsMarketSold = 0;
            Object.keys(marketSoldStats).forEach(key => {
                if (key !== reportMonth) otherMonthsMarketSold += marketSoldStats[key];
            });

            // 本月市場銷量
            const currentMonthMarketSold = marketSoldStats[reportMonth] || 0;
            const globalTotalMarketSoldQty = otherMonthsMarketSold + currentMonthMarketSold;

            // 目前全期剩餘庫存
            const currentInventoryQty = globalTotalWholesaleQty - globalTotalStoreSoldQty - globalTotalMarketSoldQty;

            // 盤點用：推算如果本月市場賣0件時，帳面庫存是多少
            const theoreticalInventory = globalTotalWholesaleQty - globalTotalStoreSoldQty - otherMonthsMarketSold;

            const saveInventoryCheck = () => {
                const actual = Number(actualInv) || 0;
                const calculatedSold = theoreticalInventory - actual;
                // 不允許負數銷量
                const finalSold = calculatedSold > 0 ? calculatedSold : 0;
                setMarketSoldStats({ ...marketSoldStats, [reportMonth]: finalSold });
                setIsCheckingInventory(false);
                setActualInv('');
            };

            // ---- 2. 計算歷史累積現金流 (上月結轉) ----
            const pastDeliveries = deliveries.filter(d => d.date.substring(0, 7) < reportMonth && d.status === 'shipped');
            const pastMarket = marketSales.filter(m => m.date.substring(0, 7) < reportMonth);
            const pastExpenses = expenses.filter(e => e.date.substring(0, 7) < reportMonth);

            let pastCashflow = 0; 
            pastDeliveries.forEach(d => { pastCashflow += (d.revenue || 0) + (d.shippingIncome || 0) - (d.shippingExpense || 0); });
            pastMarket.forEach(m => { pastCashflow += (m.revenue || 0) - (m.rent || 0) - ((m.electricity||0) + (m.cleaning||0) + (m.gas||0) + (m.toll||0)); });
            pastExpenses.forEach(e => { pastCashflow -= (e.amount || 0); });

            // ---- 3. 計算當月 P&L 資料 ----
            const currentDeliveries = deliveries.filter(d => d.date.startsWith(reportMonth) && d.status === 'shipped');
            const currentMarket = marketSales.filter(m => m.date.startsWith(reportMonth));
            const currentExpenses = expenses.filter(e => e.date.startsWith(reportMonth));

            // 當月售出總件數 = 超商寄出 + 市場結算推算
            const currentMonthStoreSold = currentDeliveries.reduce((sum, d) => sum + (d.soldQty || 1), 0);
            const currentMonthSoldQty = currentMonthStoreSold + currentMonthMarketSold;
            
            // 當月銷貨成本 (COGS) = 售出總件數 x 平均單價
            const currentMonthCOGS = Math.round(currentMonthSoldQty * avgUnitCost);

            // 營業收入
            const storeRevenue = currentDeliveries.reduce((sum, d) => sum + (d.revenue || 0), 0);
            const marketRevenue = currentMarket.reduce((sum, m) => sum + (m.revenue || 0), 0);
            const totalRevenue = storeRevenue + marketRevenue;

            // 本月毛利
            const grossProfit = totalRevenue - currentMonthCOGS;

            // 營業費用
            const storeShippingIn = currentDeliveries.reduce((sum, d) => sum + (d.shippingIncome || 0), 0);
            const storeShippingOut = currentDeliveries.reduce((sum, d) => sum + (d.shippingExpense || 0), 0);
            const storeShippingProfit = storeShippingIn - storeShippingOut; 

            const marketRent = currentMarket.reduce((sum, m) => sum + (m.rent || 0), 0);
            const marketMisc = currentMarket.reduce((sum, m) => sum + (m.electricity || 0) + (m.cleaning || 0) + (m.gas || 0) + (m.toll || 0), 0);
            const supplyTotal = currentExpenses.filter(e => e.type === 'supply').reduce((sum, e) => sum + e.amount, 0);
            const fixedTotal = currentExpenses.filter(e => e.type === 'fixed').reduce((sum, e) => sum + e.amount, 0);
            
            const totalOperationsCost = marketRent + marketMisc + supplyTotal + fixedTotal - storeShippingProfit; 
            
            // 營業淨利
            const operatingProfit = grossProfit - totalOperationsCost; 

            // 老闆薪資與最終淨利
            const salaryTotal = currentExpenses.filter(e => e.type === 'salary').reduce((sum, e) => sum + e.amount, 0);
            const currentMonthNetProfit = operatingProfit - salaryTotal; 
            
            // ---- 4. 計算當月現金流 ----
            const wholesaleCashSpentThisMonth = currentExpenses.filter(e => e.type === 'wholesale').reduce((sum, e) => sum + e.amount, 0);
            const currentMonthCashflow = totalRevenue + storeShippingProfit - marketRent - marketMisc - supplyTotal - fixedTotal - salaryTotal - wholesaleCashSpentThisMonth;
            
            // 總累積現金
            const totalAccumulatedCash = pastCashflow + currentMonthCashflow; 

            const progressPercent = Math.min(100, Math.round((currentMonthNetProfit / settings.monthlyGoal) * 100)) || 0;
            
            return (
                <div className="animate-fade-in pb-20">
                    <div className="flex justify-between items-center bg-white rounded-2xl p-3 shadow-sm border border-[#f2e7df] mb-4">
                        <button onClick={() => changeMonth(-1)} className="p-2 text-[#a89689]"><Icon name="chevron_left" /></button>
                        <div className="font-bold text-[#7a6453] text-lg">{reportMonth.split('-')[0]}年 {parseInt(reportMonth.split('-')[1], 10)}月</div>
                        <button onClick={() => changeMonth(1)} className="p-2 text-[#a89689]"><Icon name="chevron_right" /></button>
                    </div>

                    {/* 📦 庫存與成本概況 */}
                    <Card className="bg-[#e8f5e9] bg-opacity-40 border-none mb-4">
                        <div className="flex items-center text-[#4caf50] font-bold text-lg mb-3"><Icon name="inventory_2" className="mr-2" /> 服飾庫存與成本</div>
                        <div className="flex items-center justify-between mb-3">
                            <span className="text-[#5c4d43] font-bold">全期平均進貨單價</span>
                            <span className="text-2xl font-black text-[#4caf50]">${avgUnitCost.toFixed(1)} <span className="text-xs text-[#a89689]">/件</span></span>
                        </div>
                        <div className="grid grid-cols-3 gap-2 border-t border-[#c8e6c9] pt-3 pb-2">
                            <div className="text-center">
                                <div className="text-[10px] text-[#7a6453] font-bold">歷史總進貨</div>
                                <div className="font-black text-[#5c4d43]">{globalTotalWholesaleQty}</div>
                            </div>
                            <div className="text-center border-x border-[#c8e6c9]">
                                <div className="text-[10px] text-[#7a6453] font-bold">歷史總售出</div>
                                <div className="font-black text-[#5c4d43]">{globalTotalStoreSoldQty + globalTotalMarketSoldQty}</div>
                            </div>
                            <div className="text-center">
                                <div className="text-[10px] text-[#7a6453] font-bold">目前剩餘庫存</div>
                                <div className="font-black text-[#4caf50]">{currentInventoryQty}</div>
                            </div>
                        </div>

                        {/* 盤點區塊 */}
                        <div className="mt-3 p-3 bg-white rounded-xl shadow-sm border border-[#c8e6c9]">
                            <div className="flex justify-between items-center mb-1">
                                <span className="text-sm font-bold text-[#5c4d43]">本月市場售出結算</span>
                                <span className="text-sm font-black text-[#e57373]">{currentMonthMarketSold} 件</span>
                            </div>
                            {isCheckingInventory ? (
                                <div className="pt-3 mt-2 border-t border-[#f2e7df] animate-fade-in">
                                    <div className="text-xs text-[#a89689] mb-3 leading-relaxed">
                                        輸入月底庫存後，系統會自動扣除網購寄出的件數，幫您精準算出這個月在市場賣了幾件。
                                    </div>
                                    <div className="text-xs text-[#a89689] mb-1 font-bold">如果市場沒賣出，目前帳面庫存: {theoreticalInventory} 件</div>
                                    <div className="flex items-center gap-2 mb-3">
                                        <input type="number" placeholder="請輸入您盤點實際剩下幾件" value={actualInv} onChange={e=>setActualInv(e.target.value)} className="flex-[2] bg-[#fdfdfd] border border-[#f0e6e0] rounded-lg px-3 h-[40px] text-sm outline-none focus:border-[#4caf50] font-wawa"/>
                                        <div className="flex-1 text-xs font-bold text-[#4caf50] text-right">
                                            推算賣出<br/><span className="text-lg">{(theoreticalInventory - (Number(actualInv)||0)) > 0 ? (theoreticalInventory - (Number(actualInv)||0)) : 0}</span> 件
                                        </div>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={()=>setIsCheckingInventory(false)} className="flex-1 h-[40px] bg-[#f2e7df] text-[#7a6453] rounded-lg text-sm font-bold font-wawa">取消</button>
                                        <button onClick={saveInventoryCheck} className="flex-[2] h-[40px] bg-[#4caf50] text-white rounded-lg text-sm font-bold font-wawa shadow-sm">儲存盤點結果</button>
                                    </div>
                                </div>
                            ) : (
                                <button onClick={()=>{setActualInv(''); setIsCheckingInventory(true);}} className="w-full h-[36px] bg-[#f0f9f0] text-[#4caf50] rounded-lg text-sm font-bold mt-2 border border-[#c8e6c9] font-wawa transition-colors active:bg-[#e8f5e9]">
                                    ✏️ 輸入月底盤點，結算市場銷量
                                </button>
                            )}
                        </div>
                    </Card>

                    {/* 📊 本月損益表 (P&L - 真實賺賠) */}
                    <Card>
                        <div className="flex justify-between items-center mb-4 pb-2 border-b border-[#f2e7df]">
                            <div className="flex items-center font-bold text-[#7a6453] text-lg"><Icon name="request_quote" className="mr-2 text-[#e57373]" /> 本月損益表 <span className="text-xs text-[#a89689] font-normal ml-2">(真實利潤)</span></div>
                            <button onClick={handleGoalChange} className="text-xs bg-[#fdfaf7] border border-[#e0d6ce] px-2 py-1 rounded-lg text-[#a89689] font-wawa shadow-sm">淨利目標</button>
                        </div>
                        
                        <div className="space-y-4 text-sm font-bold text-[#5c4d43]">
                            {/* 1. 營收 */}
                            <div>
                                <div className="flex justify-between text-base mb-1"><span>總營業額 (超商+市場)</span><span className="text-[#bc9f8b]">${totalRevenue.toLocaleString()}</span></div>
                            </div>
                            {/* 2. 銷貨成本 */}
                            <div>
                                <div className="flex justify-between items-center text-[#e57373]"><span className="flex items-center"><Icon name="remove" className="text-[14px] mr-1"/> 銷貨成本 <span className="text-[10px] text-[#a89689] font-normal ml-1">(本月售出 {currentMonthSoldQty} 件)</span></span><span>-${currentMonthCOGS.toLocaleString()}</span></div>
                            </div>
                            
                            <div className="border-t border-dashed border-[#e0d6ce] pt-2"></div>
                            
                            {/* = 毛利 */}
                            <div className="bg-[#fdfaf7] p-2 rounded-lg flex justify-between text-base">
                                <span className="text-[#7a6453]">本月營業毛利</span><span className="text-[#bc9f8b]">${grossProfit.toLocaleString()}</span>
                            </div>

                            {/* 3. 營運支出 */}
                            <div className="pl-4 border-l-2 border-[#f2e7df] space-y-2 mt-2">
                                <div className="flex justify-between text-xs text-[#a89689]"><span>市場攤租與雜支</span><span>-${(marketRent + marketMisc).toLocaleString()}</span></div>
                                <div className="flex justify-between text-xs text-[#a89689]"><span>生財包材 / 倉租水電</span><span>-${(supplyTotal + fixedTotal).toLocaleString()}</span></div>
                                <div className="flex justify-between text-xs text-[#a89689]"><span>超商運費盈虧</span><span className={storeShippingProfit >= 0 ? 'text-[#4caf50]' : 'text-[#e57373]'}>{storeShippingProfit >= 0 ? '+' : ''}{storeShippingProfit.toLocaleString()}</span></div>
                            </div>
                            <div>
                                <div className="flex justify-between items-center text-[#e57373]"><span className="flex items-center"><Icon name="remove" className="text-[14px] mr-1"/> 本月營業費用 <span className="text-[10px] text-[#a89689] font-normal ml-1">(不含批貨)</span></span><span>-${totalOperationsCost.toLocaleString()}</span></div>
                            </div>

                            {/* = 營業淨利 */}
                            <div className="bg-[#fdfaf7] p-2 rounded-lg flex justify-between text-base">
                                <span className="text-[#7a6453]">營業淨利</span><span className="text-[#bc9f8b]">${operatingProfit.toLocaleString()}</span>
                            </div>

                            {/* 4. 支薪 */}
                            <div>
                                <div className="flex justify-between items-center text-[#fbc02d]"><span className="flex items-center"><Icon name="remove" className="text-[14px] mr-1"/> 老闆支薪</span><span>-${salaryTotal.toLocaleString()}</span></div>
                            </div>

                            <div className="border-t-2 border-[#bc9f8b] pt-3 mt-2"></div>

                            {/* = 最終淨利 */}
                            <div className="flex justify-between items-end">
                                <div className="flex flex-col">
                                    <span className="text-xs text-[#a89689] mb-1">目標達成: {progressPercent}%</span>
                                    <span className="text-lg text-[#bc9f8b]">本月公司淨利</span>
                                </div>
                                <span className={`text-3xl font-black ${currentMonthNetProfit < 0 ? 'text-red-500' : 'text-[#bc9f8b]'}`}>
                                    ${currentMonthNetProfit.toLocaleString()}
                                </span>
                            </div>
                            <div className="w-full bg-[#f2e7df] rounded-full h-2 mt-2 overflow-hidden">
                                <div className="bg-[#bc9f8b] h-2 rounded-full transition-all duration-500" style={{ width: `${progressPercent}%` }}></div>
                            </div>
                        </div>
                    </Card>

                    {/* 🏦 公司現金流 (銀行裡的錢) */}
                    <Card className="bg-[#bc9f8b] bg-opacity-10 border-none mb-4">
                        <div className="text-center mb-3 pt-2">
                            <div className="text-sm text-[#7a6453] font-bold mb-1"><Icon name="account_balance_wallet" className="align-middle text-[18px] mr-1"/>目前公司總現金 (口袋實際結餘)</div>
                            <div className={`text-4xl font-black ${totalAccumulatedCash < 0 ? 'text-red-500' : 'text-[#bc9f8b]'}`}>
                                {totalAccumulatedCash < 0 ? '-' : ''}${Math.abs(totalAccumulatedCash).toLocaleString()}
                            </div>
                        </div>
                        <div className="flex justify-between text-sm border-t border-[#e0d6ce] pt-3 pb-1">
                            <div className="text-center flex-1 border-r border-[#e0d6ce]">
                                <div className="text-xs text-[#a89689] mb-1">上月結轉現金</div>
                                <div className={`font-bold ${pastCashflow < 0 ? 'text-red-400' : 'text-[#7a6453]'}`}>${pastCashflow.toLocaleString()}</div>
                            </div>
                            <div className="text-center flex-1">
                                <div className="text-xs text-[#a89689] mb-1">本月產生現金流</div>
                                <div className={`font-bold ${currentMonthCashflow < 0 ? 'text-red-500' : 'text-[#bc9f8b]'}`}>
                                    {currentMonthCashflow >= 0 ? '+' : ''}${currentMonthCashflow.toLocaleString()}
                                </div>
                            </div>
                        </div>
                    </Card>

                    {/* 👑 專屬老闆成就區塊 */}
                    <Card className="bg-gradient-to-r from-[#fdfbfb] to-[#fffde7] border-[#fff59d] mb-4 flex items-center justify-between">
                        <div className="flex items-center">
                            <div className="w-10 h-10 bg-[#fbc02d] rounded-full flex items-center justify-center text-white mr-3 shadow-sm"><Icon name="emoji_events" /></div>
                            <div>
                                <div className="text-xs text-[#a89689] font-bold mb-0.5">老闆本月已領薪資</div>
                                <div className="text-lg font-black text-[#fbc02d]">${salaryTotal.toLocaleString()}</div>
                            </div>
                        </div>
                        <Icon name="arrow_forward_ios" className="text-gray-300 text-sm" />
                    </Card>
                </div>
            );
        };

        // --- 分頁 5：留貨 (一鍵轉單) ---
        const ReserveTab = ({ reservations, setReservations, setDeliveries, setConfirmDialog }) => {
            const [editingId, setEditingId] = useState(null);
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [customerName, setCustomerName] = useState('');
            const [itemsCount, setItemsCount] = useState('');
            const [note, setNote] = useState('');

            // 轉單狀態
            const [transferRecord, setTransferRecord] = useState(null);
            const [tDate, setTDate] = useState('');
            const [tRevenue, setTRevenue] = useState('');
            const [tSoldQty, setTSoldQty] = useState(''); // 轉單也需要售出件數
            const [tShippingExpense, setTShippingExpense] = useState('');
            const [tShippingIncome, setTShippingIncome] = useState('');
            const [tHasGift, setTHasGift] = useState(false);
            const [tGiftCount, setTGiftCount] = useState('');

            const resetForm = () => {
                setEditingId(null); setDate(new Date().toISOString().split('T')[0]);
                setCustomerName(''); setItemsCount(''); setNote('');
            };

            const handleAddReserve = () => {
                if (!customerName) return;
                const recordData = { date, customerName, itemsCount: Number(itemsCount) || 1, note };
                
                if (editingId) {
                    setReservations(prev => prev.map(r => r.id === editingId ? { ...r, ...recordData } : r).sort((a,b)=>new Date(b.date)-new Date(a.date)));
                } else {
                    const newRecord = { id: Date.now().toString(), ...recordData };
                    setReservations(prev => [newRecord, ...prev].sort((a,b)=>new Date(b.date)-new Date(a.date)));
                }
                resetForm();
            };

            const handleEditClick = (record) => {
                setEditingId(record.id);
                setDate(record.date); setCustomerName(record.customerName);
                setItemsCount(record.itemsCount); setNote(record.note || '');
                scrollToTop();
            };

            const openTransferModal = (record) => {
                setTransferRecord(record); setTDate(new Date().toISOString().split('T')[0]);
                setTRevenue(''); setTSoldQty(record.itemsCount); // 自動帶入留貨件數
                setTShippingExpense(''); setTShippingIncome(''); setTHasGift(false); setTGiftCount('');
            };

            const handleTransferSubmit = () => {
                if (!transferRecord) return;
                const newDelivery = {
                    id: Date.now().toString(), date: tDate, customerName: transferRecord.customerName,
                    revenue: Number(tRevenue) || 0, soldQty: Number(tSoldQty) || 1,
                    shippingExpense: Number(tShippingExpense) || 0, shippingIncome: Number(tShippingIncome) || 0,
                    hasGift: tHasGift, giftCount: tHasGift ? (Number(tGiftCount) || 0) : 0, status: 'pending' 
                };
                setDeliveries(prev => [newDelivery, ...prev].sort((a,b)=>new Date(b.date)-new Date(a.date)));
                setReservations(prev => prev.filter(r => r.id !== transferRecord.id));
                setTransferRecord(null);
            };

            return (
                <div className="animate-fade-in pb-20">
                    <Card className={editingId ? 'border-2 border-[#64b5f6]' : ''}>
                        <div className="flex items-center mb-4 text-[#64b5f6] font-bold text-lg">
                            <Icon name={editingId ? 'edit' : 'diamond'} className="mr-2" /> 
                            {editingId ? '編輯留貨清單' : '新增留貨清單'}
                        </div>
                        <Input type="date" value={date} onChange={e => setDate(e.target.value)} />
                        <Input placeholder="訂購人姓名" value={customerName} onChange={e => setCustomerName(e.target.value)} />
                        <div className="grid grid-cols-2 gap-3 mb-4">
                            <Input type="number" placeholder="件數" value={itemsCount} onChange={e => setItemsCount(e.target.value)} />
                            <Input placeholder="備註 (選填)" value={note} onChange={e => setNote(e.target.value)} />
                        </div>
                        
                        <div className="flex gap-3">
                            {editingId && (
                                <Button onClick={resetForm} className="flex-1 bg-[#e3f2fd] !text-[#64b5f6]">取消</Button>
                            )}
                            <Button onClick={handleAddReserve} className={editingId ? 'flex-[2] bg-[#64b5f6] text-white' : 'w-full bg-[#64b5f6] text-white'}>
                                {editingId ? '儲存修改' : '加入清單'}
                            </Button>
                        </div>
                    </Card>

                    {reservations.length === 0 ? <div className="text-center text-[#c4b5aa] text-sm py-8 mt-4">目前沒有留貨清單！</div> : (
                        <div className="mt-4">
                        {reservations.map(r => (
                            <div key={r.id} className="bg-white rounded-xl p-4 mb-3 shadow-sm border border-[#e3f2fd] relative">
                                <div className="absolute top-4 right-4 flex gap-1">
                                    <button onClick={() => handleEditClick(r)} className="p-1.5 text-[#64b5f6] bg-[#f5f9ff] rounded-lg shadow-sm"><Icon name="edit" className="text-[18px]" /></button>
                                    <button onClick={() => setConfirmDialog({isOpen: true, id: r.id, collection: 'reservations'})} className="p-1.5 text-[#e57373] bg-[#fdf2f2] rounded-lg shadow-sm"><Icon name="delete" className="text-[18px]" /></button>
                                </div>
                                <div>
                                    <div className="font-bold text-[#5c4d43] text-lg">{r.customerName} <span className="text-sm font-normal text-[#64b5f6] ml-2">{r.itemsCount}件</span></div>
                                    <div className="text-xs text-[#a89689] mt-1">留貨日期: {r.date}</div>
                                    {r.note && <div className="text-sm text-[#7a6453] mt-2 bg-[#f5f9ff] p-2 rounded-lg">{r.note}</div>}
                                </div>
                                <button onClick={() => openTransferModal(r)} className="w-full mt-4 py-3 bg-[#e8f5e9] text-[#4caf50] rounded-xl font-bold flex justify-center items-center text-sm shadow-sm transition-colors active:bg-[#c8e6c9]">
                                    <Icon name="local_shipping" className="mr-1 text-[18px]" /> 客人已確認，結單轉寄件
                                </button>
                            </div>
                        ))}
                        </div>
                    )}

                    {transferRecord && (
                        <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 animate-fade-in px-4">
                            <div className="bg-white rounded-2xl p-5 w-full max-w-sm shadow-xl max-h-[90vh] overflow-y-auto custom-scrollbar">
                                <div className="text-center text-[#5c4d43] font-bold mb-4 text-lg border-b border-[#f2e7df] pb-3">
                                    <Icon name="local_shipping" className="align-middle mr-1 text-[#4caf50]"/> 轉單出貨：{transferRecord.customerName}
                                </div>
                                <Input type="date" value={tDate} onChange={e => setTDate(e.target.value)} />
                                <div className="grid grid-cols-2 gap-3 mb-3">
                                    <div className="flex items-center bg-[#fdfdfd] border border-[#f0e6e0] rounded-xl px-3 h-[48px] focus-within:border-[#bc9f8b] transition-colors">
                                        <input type="number" value={tRevenue} onChange={e => setTRevenue(e.target.value)} placeholder="商品總額" className="bg-transparent w-full h-full outline-none text-[#5c4d43] placeholder-[#c4b5aa] text-[15px] font-wawa" />
                                    </div>
                                    <div className="flex items-center bg-[#fdfdfd] border border-[#f0e6e0] rounded-xl px-3 h-[48px] focus-within:border-[#bc9f8b] transition-colors">
                                        <input type="number" value={tSoldQty} onChange={e => setTSoldQty(e.target.value)} placeholder="售出服飾件數" className="bg-transparent w-full h-full outline-none text-[#5c4d43] placeholder-[#c4b5aa] text-[15px] font-wawa" />
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <Input type="number" placeholder="賣家付運費" value={tShippingExpense} onChange={e => setTShippingExpense(e.target.value)} />
                                    <Input type="number" placeholder="買家付運費" value={tShippingIncome} onChange={e => setTShippingIncome(e.target.value)} />
                                </div>
                                <div className="grid grid-cols-2 gap-3 mb-2">
                                    <button className={`w-full h-[48px] rounded-xl border text-[15px] transition-colors font-wawa font-bold flex items-center justify-center ${tHasGift ? 'border-[#bc9f8b] bg-[#fdfaf7] text-[#bc9f8b]' : 'border-[#f0e6e0] bg-[#fdfdfd] text-[#a89689]'}`} onClick={(e) => { e.preventDefault(); setTHasGift(!tHasGift); }}>🎁 {tHasGift ? '有贈品' : '無贈品'}</button>
                                    <div className={`flex items-center bg-[#fdfdfd] border border-[#f0e6e0] rounded-xl px-3 h-[48px] focus-within:border-[#bc9f8b] transition-colors ${!tHasGift ? 'opacity-60 bg-[#f9f9f9]' : ''}`}>
                                        <input type="number" placeholder="贈品數量" value={tGiftCount} onChange={e => setTGiftCount(e.target.value)} disabled={!tHasGift} className="bg-transparent w-full h-full outline-none text-[#5c4d43] placeholder-[#c4b5aa] text-[15px] font-wawa" />
                                    </div>
                                </div>
                                <div className="flex gap-3 mt-5">
                                    <button onClick={() => setTransferRecord(null)} className="flex-1 py-3.5 rounded-xl bg-[#f2e7df] text-[#7a6453] font-bold font-wawa">取消</button>
                                    <button onClick={handleTransferSubmit} className="flex-[2] py-3.5 rounded-xl bg-[#4caf50] text-white font-bold font-wawa shadow-sm">確定轉入超商</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- 應用程式主體 ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('store');
            
            const [deliveries, setDeliveries] = useLocalStorage('xq_deliveries', []);
            const [marketSales, setMarketSales] = useLocalStorage('xq_marketSales', []);
            const [expenses, setExpenses] = useLocalStorage('xq_expenses', []);
            const [reservations, setReservations] = useLocalStorage('xq_reservations', []);
            const [settings, setSettings] = useLocalStorage('xq_settings', { monthlyGoal: 100000 });
            
            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, id: null, collection: '' });

            const executeDelete = () => {
                const { id, collection } = confirmDialog;
                if(id && collection) {
                    if (collection === 'deliveries') setDeliveries(prev => prev.filter(d => d.id !== id));
                    if (collection === 'market_sales') setMarketSales(prev => prev.filter(m => m.id !== id));
                    if (collection === 'expenses') setExpenses(prev => prev.filter(e => e.id !== id));
                    if (collection === 'reservations') setReservations(prev => prev.filter(r => r.id !== id));
                }
                setConfirmDialog({isOpen: false, id: null, collection: ''});
            };

            return (
                <div className="flex flex-col h-screen custom-scrollbar text-[#5c4d43] max-w-lg mx-auto bg-[#fdfaf7] shadow-2xl relative">
                    <header className="bg-[#bc9f8b] text-white pt-6 pb-4 px-5 flex justify-between items-center shadow-md sticky top-0 z-10">
                        <div className="flex items-center text-2xl font-bold tracking-widest drop-shadow-sm">💰 200%向錢衝</div>
                        <button className="p-1.5 bg-white bg-opacity-20 rounded-full"><Icon name="settings" className="text-[20px]" /></button>
                    </header>
                    
                    <main id="main-content" className="flex-1 overflow-y-auto p-4 relative custom-scrollbar">
                        {activeTab === 'store' && <StoreTab deliveries={deliveries} setDeliveries={setDeliveries} setConfirmDialog={setConfirmDialog} />}
                        {activeTab === 'market' && <MarketTab marketSales={marketSales} setMarketSales={setMarketSales} setConfirmDialog={setConfirmDialog} />}
                        {activeTab === 'expense' && <ExpenseTab expenses={expenses} setExpenses={setExpenses} setConfirmDialog={setConfirmDialog} />}
                        {activeTab === 'report' && <ReportTab deliveries={deliveries} marketSales={marketSales} expenses={expenses} settings={settings} setSettings={setSettings} />}
                        {activeTab === 'reserve' && <ReserveTab reservations={reservations} setReservations={setReservations} setDeliveries={setDeliveries} setConfirmDialog={setConfirmDialog} />}
                    </main>

                    <nav className="bg-white border-t border-[#f2e7df] flex justify-around pb-safe pt-2 fixed bottom-0 w-full max-w-lg z-10 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] px-1">
                        {[ 
                           { id: 'store', icon: 'inventory_2', label: '超商' }, 
                           { id: 'market', icon: 'storefront', label: '市場' },
                           { id: 'expense', icon: 'payments', label: '支出' },
                           { id: 'report', icon: 'bar_chart', label: '報表' }, 
                           { id: 'reserve', icon: 'diamond', label: '留貨', color: 'text-[#64b5f6]' }
                        ].map(t => (
                            <button key={t.id} onClick={() => { setActiveTab(t.id); scrollToTop(); }} className={`flex flex-col items-center p-1.5 w-full transition-colors ${activeTab === t.id ? 'text-[#bc9f8b] font-bold' : 'text-[#c4b5aa]'} relative`}>
                                <Icon name={t.icon} className={`mb-1 ${t.id === 'reserve' && activeTab === t.id ? t.color : ''}`} />
                                <span className="text-[10px] font-bold tracking-wide">{t.label}</span>
                                {activeTab === t.id && <div className="absolute top-0 w-8 h-1 bg-[#bc9f8b] rounded-b-full"></div>}
                            </button>
                        ))}
                    </nav>
                    
                    <ConfirmModal isOpen={confirmDialog.isOpen} message="確定要刪除這筆紀錄嗎？" onConfirm={executeDelete} onCancel={() => setConfirmDialog({isOpen: false, id: null, collection: ''})} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
