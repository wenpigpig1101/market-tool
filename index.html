<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>200%森衣好 - 營運戰情室</title>
    
    <!-- 引入 React, ReactDOM, Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Google Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #fdfaf7;
            overscroll-behavior-y: none;
        }

        .custom-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: bottom;
        }

        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-[#5c4d43] antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- 工具函數 ---
        const safeTime = (dateStr) => {
            if (!dateStr) return 0;
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? 0 : d.getTime();
        };

        const getSafeArr = (arr) => Array.isArray(arr) ? arr : [];
        const safeStr = (str) => typeof str === 'string' ? str : '';

        // --- 自訂 Hook: LocalStorage 同步 ---
        function useDataSync(key, initialValue) {
            const [data, setData] = useState(() => {
                try {
                    const item = localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.error("Storage error:", error);
                    return initialValue;
                }
            });

            useEffect(() => {
                try {
                    localStorage.setItem(key, JSON.stringify(data));
                } catch (error) {
                    console.error("Storage save error:", error);
                }
            }, [key, data]);

            return [data, setData];
        }

        // --- 共用 UI 元件 ---
        const Icon = ({ name, className = "" }) => (
            <span className={`material-symbols-rounded ${className}`}>{name}</span>
        );

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-2xl p-5 shadow-sm border border-[#f2e7df] ${className}`}>
                {children}
            </div>
        );

        const Input = ({ type = "text", placeholder, value, onChange, disabled, className = "" }) => (
            <div className={`flex items-center bg-[#fdfdfd] border border-[#f0e6e0] rounded-xl px-3 h-[48px] focus-within:border-[#bc9f8b] transition-colors ${disabled ? 'opacity-50 bg-gray-50' : ''} ${className}`}>
                <input
                    type={type} placeholder={placeholder} value={value} onChange={onChange} disabled={disabled}
                    className="bg-transparent w-full h-full outline-none text-[15px] font-bold text-[#5c4d43] placeholder-[#c4b5aa]"
                />
            </div>
        );

        // --- 智能輸入框 (記憶選單) ---
        const AutocompleteInput = ({ value, onChange, options, placeholder }) => {
            const [showDropdown, setShowDropdown] = useState(false);
            const filtered = options.filter(opt => opt.includes(value) && opt !== value);

            return (
                <div className="relative w-full">
                    <Input type="text" placeholder={placeholder} value={value} 
                        onChange={(e) => { onChange(e); setShowDropdown(true); }} 
                        onFocus={() => setShowDropdown(true)}
                        onBlur={() => setTimeout(() => setShowDropdown(false), 200)}
                    />
                    {showDropdown && value && filtered.length > 0 && (
                        <div className="absolute z-50 w-full mt-1 bg-white border border-[#f0e6e0] rounded-xl shadow-lg max-h-40 overflow-y-auto custom-scrollbar">
                            {filtered.map((opt, i) => (
                                <div key={i} onClick={() => { onChange({ target: { value: opt }}); setShowDropdown(false); }} className="px-4 py-3 text-sm font-bold text-[#5c4d43] border-b border-gray-50 hover:bg-[#fdfaf7] cursor-pointer">
                                    {opt}
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // --- 彈出視窗元件 ---
        const Modal = ({ isOpen, onClose, title, children, actions }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl">
                        <div className="text-lg font-bold text-[#5c4d43] mb-4">{title}</div>
                        <div className="mb-6">{children}</div>
                        <div className="flex gap-3 justify-end">{actions}</div>
                    </div>
                </div>
            );
        };

        // --- 計算機 Modal ---
        const CalculatorModal = ({ isOpen, onClose }) => {
            const [cost, setCost] = useState('');
            const [sell, setSell] = useState('');

            const numCost = Number(cost) || 0;
            const numSell = Number(sell) || 0;
            const margin = numSell > 0 ? ((numSell - numCost) / numSell * 100).toFixed(1) : 0;
            const boss = Math.round(numSell * 0.35);
            const comp = Math.round(numSell * 0.65) - numCost;

            return (
                <Modal isOpen={isOpen} onClose={onClose} title="🧮 快速定價與利潤分析" actions={
                    <button onClick={onClose} className="px-4 py-2 rounded-xl bg-[#bc9f8b] text-white font-bold w-full">完成</button>
                }>
                    <div className="grid grid-cols-2 gap-3 mb-4">
                        <Input type="number" placeholder="進貨成本" value={cost} onChange={e => setCost(e.target.value)} />
                        <Input type="number" placeholder="預定售價" value={sell} onChange={e => setSell(e.target.value)} />
                    </div>
                    {numSell > 0 && (
                        <div className="bg-[#fdfaf7] p-4 rounded-xl border border-[#f2e7df] space-y-2">
                            <div className="flex justify-between items-center text-sm">
                                <span className="text-[#a89689] font-bold">毛利率</span>
                                <span className={`font-black text-lg ${margin >= 60 ? 'text-[#4caf50]' : 'text-[#f57c00]'}`}>{margin}%</span>
                            </div>
                            <div className="flex justify-between items-center text-sm border-t border-[#f0e6e0] pt-2">
                                <span className="text-[#a89689] font-bold">老闆私房錢 (35%)</span>
                                <span className="font-black text-[#5c4d43] text-lg">${boss.toLocaleString()}</span>
                            </div>
                            <div className="flex justify-between items-center text-sm border-t border-[#f0e6e0] pt-2">
                                <span className="text-[#a89689] font-bold">公司補貨現金</span>
                                <span className={`font-black text-lg ${comp >= 0 ? 'text-[#4caf50]' : 'text-[#e57373]'}`}>
                                    {comp >= 0 ? `賺 $${comp.toLocaleString()}` : `倒貼 $${Math.abs(comp).toLocaleString()}`}
                                </span>
                            </div>
                        </div>
                    )}
                </Modal>
            );
        };


        // ==========================================
        // 分頁 1: 超商與網拍結單
        // ==========================================
        const StoreTab = ({ deliveries, setDeliveries, setConfirmDialog, allCustomerNames }) => {
            const currentDate = new Date().toISOString().split('T')[0];
            const [editingId, setEditingId] = useState(null);
            
            const [date, setDate] = useState(currentDate);
            const [customerName, setCustomerName] = useState('');
            const [revenue, setRevenue] = useState('');
            const [shippingFee, setShippingFee] = useState('');
            const [platformFee, setPlatformFee] = useState('');
            const [hasGift, setHasGift] = useState(false);
            const [giftCount, setGiftCount] = useState('');
            const [note, setNote] = useState('');
            const [searchTerm, setSearchTerm] = useState('');

            const resetForm = () => {
                setEditingId(null); setDate(currentDate); setCustomerName(''); setRevenue(''); 
                setShippingFee(''); setPlatformFee(''); setHasGift(false); setGiftCount(''); setNote(''); setSearchTerm('');
            };

            const handleAdd = () => {
                if (!customerName || !revenue) return;
                const record = {
                    date, customerName, revenue: Number(revenue) || 0,
                    shippingFee: Number(shippingFee) || 0, platformFee: Number(platformFee) || 0,
                    hasGift, giftCount: hasGift ? (Number(giftCount) || 0) : 0, note
                };
                if (editingId) {
                    setDeliveries(prev => prev.map(d => d.id === editingId ? { ...d, ...record } : d).sort((a,b) => safeTime(b.date) - safeTime(a.date)));
                } else {
                    setDeliveries(prev => [{ id: Date.now().toString(), ...record }, ...prev].sort((a,b) => safeTime(b.date) - safeTime(a.date)));
                }
                resetForm();
            };

            const filteredList = deliveries.filter(d => searchTerm === '' || (d.customerName && d.customerName.includes(searchTerm)));

            return (
                <div className="animate-fade-in pb-20">
                    <Card className={editingId ? 'border-2 border-[#bc9f8b]' : ''}>
                        <div className="flex items-center mb-4 text-[#7a6453] font-bold text-lg">
                            <Icon name={editingId ? 'edit' : 'local_shipping'} className="mr-2 text-[#bc9f8b]" /> 
                            {editingId ? '編輯超商紀錄' : '新增超商/網拍紀錄'}
                        </div>
                        
                        <div className="grid grid-cols-2 gap-3 mb-3">
                            <Input type="date" value={date} onChange={e => setDate(e.target.value)} />
                            <AutocompleteInput placeholder="客戶姓名" value={customerName} onChange={e => setCustomerName(e.target.value)} options={allCustomerNames} />
                        </div>
                        <div className="grid grid-cols-3 gap-3 mb-3">
                            <Input type="number" placeholder="實收總額" value={revenue} onChange={e => setRevenue(e.target.value)} className="col-span-3" />
                            <Input type="number" placeholder="扣: 運費" value={shippingFee} onChange={e => setShippingFee(e.target.value)} />
                            <Input type="number" placeholder="扣: 手續費" value={platformFee} onChange={e => setPlatformFee(e.target.value)} />
                            
                            <button onClick={() => setHasGift(!hasGift)} className={`h-[48px] rounded-xl font-bold flex items-center justify-center text-sm border transition-colors ${hasGift ? 'bg-[#fdfaf7] text-[#bc9f8b] border-[#bc9f8b]' : 'bg-gray-50 text-gray-400 border-gray-200'}`}>
                                <Icon name="featured_seasonal_and_gifts" className="mr-1 text-[18px]" /> {hasGift ? '有贈品' : '無贈品'}
                            </button>
                        </div>
                        {hasGift && <div className="mb-3"><Input type="number" placeholder="贈品件數" value={giftCount} onChange={e => setGiftCount(e.target.value)} /></div>}
                        <Input placeholder="備註 (選填)" value={note} onChange={e => setNote(e.target.value)} className="mb-4" />
                        
                        <div className="flex gap-3">
                            {editingId && <button onClick={resetForm} className="flex-1 py-3 bg-gray-100 text-gray-500 rounded-xl font-bold">取消</button>}
                            <button onClick={handleAdd} className="flex-[2] py-3 bg-[#bc9f8b] text-white rounded-xl font-bold text-lg shadow-md hover:bg-[#a88c79] transition-colors flex justify-center items-center">
                                <Icon name="check_circle" className="mr-2" /> {editingId ? '儲存修改' : '確認結單'}
                            </button>
                        </div>
                    </Card>

                    <div className="mt-6 mb-4 px-2">
                        <Input placeholder="🔍 搜尋客戶姓名..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                    </div>

                    <div className="space-y-3">
                        {filteredList.map(d => (
                            <div key={d.id} className="bg-white rounded-xl p-4 shadow-sm border border-[#f2e7df] relative mx-1">
                                <div className="absolute top-4 right-4 flex gap-1">
                                    <button onClick={() => { setEditingId(d.id); setDate(d.date); setCustomerName(d.customerName); setRevenue(d.revenue||''); setShippingFee(d.shippingFee||''); setPlatformFee(d.platformFee||''); setHasGift(d.hasGift||false); setGiftCount(d.giftCount||''); setNote(d.note||''); window.scrollTo(0,0); }} className="p-1.5 bg-[#fdfaf7] text-[#bc9f8b] rounded-lg shadow-sm"><Icon name="edit" className="text-[18px]" /></button>
                                    <button onClick={() => setConfirmDialog({ isOpen: true, message: "確定刪除此紀錄？", onConfirm: () => setDeliveries(p => p.filter(x => x.id !== d.id)) })} className="p-1.5 bg-[#fdf2f2] text-[#e57373] rounded-lg shadow-sm"><Icon name="delete" className="text-[18px]" /></button>
                                </div>
                                <div className="font-bold text-[#5c4d43] mb-1 text-base flex items-center"><span className="bg-[#bc9f8b] w-2 h-2 rounded-full mr-2"></span>{d.customerName} <span className="ml-2 text-xs font-normal text-[#a89689] bg-[#fdfaf7] px-1 rounded">{d.date}</span></div>
                                <div className="text-sm text-[#a89689] mb-2 flex items-center gap-3">
                                    <span>營收: ${Number(d.revenue).toLocaleString()}</span>
                                    {(Number(d.shippingFee)>0 || Number(d.platformFee)>0) && <span className="text-[#e57373]">扣費: -${(Number(d.shippingFee)+Number(d.platformFee)).toLocaleString()}</span>}
                                </div>
                                {d.hasGift && <div className="text-xs text-[#bc9f8b] font-bold mb-1"><Icon name="featured_seasonal_and_gifts" className="text-[14px] align-middle mr-1"/>贈品: {d.giftCount} 件</div>}
                                {d.note && <div className="text-xs text-gray-400 bg-gray-50 p-2 rounded-lg">{d.note}</div>}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // ==========================================
        // 分頁 2: 現貨市場
        // ==========================================
        const MarketTab = ({ marketSales, setMarketSales, setConfirmDialog }) => {
            const currentDate = new Date().toISOString().split('T')[0];
            const [editingId, setEditingId] = useState(null);
            
            const [txType, setTxType] = useState('normal'); // 'normal', 'clearance', 'refund'
            const [date, setDate] = useState(currentDate);
            const [location, setLocation] = useState('');
            const [revenue, setRevenue] = useState('');
            const [rent, setRent] = useState('');
            const [electricity, setElectricity] = useState('');
            const [cleaning, setCleaning] = useState('');
            const [toll, setToll] = useState('');
            const [parking, setParking] = useState('');
            const [note, setNote] = useState('');

            // 極速結帳
            const [showQuickCheckout, setShowQuickCheckout] = useState(false);
            const [boxCash, setBoxCash] = useState('');
            const [floatCash, setFloatCash] = useState('');

            const allLocations = useMemo(() => {
                const locs = new Set();
                marketSales.forEach(m => { if (m.location) locs.add(m.location); });
                return Array.from(locs);
            }, [marketSales]);

            const resetForm = () => {
                setEditingId(null); setDate(currentDate); setLocation(''); setRevenue(''); setRent(''); setNote('');
                setElectricity(''); setCleaning(''); setToll(''); setParking(''); setTxType('normal'); 
                setShowQuickCheckout(false); setBoxCash(''); setFloatCash('');
            };

            const rentNum = Number(rent) || 0;
            const miscNum = (Number(electricity)||0) + (Number(cleaning)||0) + (Number(toll)||0) + (Number(parking)||0);
            const breakeven = Math.ceil((rentNum + miscNum) / 0.65);

            const handleAdd = () => {
                if (!location) return;
                let finalRev = Number(revenue) || 0;
                if (txType === 'refund') finalRev = -Math.abs(finalRev);
                else finalRev = Math.abs(finalRev);

                const record = {
                    date, location, revenue: finalRev, rent: rentNum, note,
                    electricity: Number(electricity)||0, cleaning: Number(cleaning)||0, toll: Number(toll)||0, parking: Number(parking)||0,
                    isClearance: txType === 'clearance'
                };
                
                if (editingId) setMarketSales(prev => prev.map(m => m.id === editingId ? { ...m, ...record } : m).sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                else setMarketSales(prev => [{ id: Date.now().toString(), ...record }, ...prev].sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                resetForm();
            };

            return (
                <div className="animate-fade-in pb-20">
                    <Card className={editingId ? 'border-2 border-[#bc9f8b]' : ''}>
                        <div className="flex items-center mb-4 text-[#7a6453] font-bold text-lg">
                            <Icon name={editingId ? 'edit' : 'storefront'} className="mr-2 text-[#bc9f8b]" /> 
                            {editingId ? '編輯市場營業' : '新增市場營業'}
                        </div>
                        
                        <div className="flex gap-2 mb-4">
                            <button onClick={() => setTxType('normal')} className={`flex-1 py-2 text-xs rounded-xl font-bold border transition-colors ${txType==='normal' ? 'bg-[#f0f9f0] border-[#4caf50] text-[#4caf50]' : 'bg-white border-[#f2e7df] text-[#a89689]'}`}>一般營業</button>
                            <button onClick={() => setTxType('clearance')} className={`flex-1 py-2 text-xs rounded-xl font-bold border transition-colors ${txType==='clearance' ? 'bg-[#fff2f2] border-[#e57373] text-[#e57373]' : 'bg-white border-[#f2e7df] text-[#a89689]'}`}>🍂換季清倉</button>
                            <button onClick={() => setTxType('refund')} className={`flex-1 py-2 text-xs rounded-xl font-bold border transition-colors ${txType==='refund' ? 'bg-[#f3e5f5] border-[#ab47bc] text-[#ab47bc]' : 'bg-white border-[#f2e7df] text-[#a89689]'}`}>🔄退貨沖銷</button>
                        </div>

                        <div className="grid grid-cols-2 gap-3 mb-3">
                            <Input type="date" value={date} onChange={e => setDate(e.target.value)} />
                            <AutocompleteInput placeholder="市場地點" value={location} onChange={e => setLocation(e.target.value)} options={allLocations} />
                        </div>
                        
                        <div className="mb-3">
                            <Input type="number" placeholder={txType === 'refund' ? '退貨租金不計' : '位租'} value={rent} onChange={e => setRent(e.target.value)} disabled={txType === 'refund'} />
                        </div>

                        {txType === 'normal' && (rentNum + miscNum > 0) && (
                            <div className="text-[12px] text-[#4caf50] font-bold mt-[-4px] mb-3 px-1 flex items-center bg-[#f0f9f0] py-1.5 rounded-lg">
                                <Icon name="tips_and_updates" className="text-[16px] mr-1"/> 今日回本線：賣滿 ${breakeven.toLocaleString()} 即可打平租雜支！
                            </div>
                        )}
                        
                        {/* ⚡ 極速結帳區 */}
                        <div className="flex gap-2 mb-3">
                            <div className="flex-1 flex items-center bg-[#fdfdfd] border border-[#f0e6e0] rounded-xl px-3 h-[48px] focus-within:border-[#bc9f8b]">
                                <input type="number" value={revenue} onChange={e => setRevenue(e.target.value)} 
                                    placeholder={txType === 'refund' ? "輸入退款總額 (自動轉負)" : "當日總營業額"} 
                                    className={`bg-transparent w-full outline-none text-[15px] font-bold ${txType === 'refund' ? 'text-[#ab47bc]' : 'text-[#5c4d43]'}`} />
                            </div>
                            {txType !== 'refund' && (
                                <button onClick={() => setShowQuickCheckout(!showQuickCheckout)} className={`shrink-0 px-3 rounded-xl font-bold text-[14px] border flex items-center ${showQuickCheckout ? 'bg-[#ffcc80] text-[#e65100] border-[#ffb74d]' : 'bg-[#fff8e1] text-[#f57f17] border-[#ffe082]'}`}>
                                    <Icon name="bolt" className="mr-1" /> 結帳
                                </button>
                            )}
                        </div>

                        {showQuickCheckout && txType !== 'refund' && (
                            <div className="bg-[#fff8e1] p-3 rounded-xl mb-3 border border-[#ffe082] animate-fade-in">
                                <div className="text-xs font-bold text-[#f57f17] mb-2">極速結帳：自動扣除備用金</div>
                                <div className="grid grid-cols-2 gap-2 mb-2">
                                    <Input type="number" placeholder="錢盒總現金" value={boxCash} onChange={e => setBoxCash(e.target.value)} className="h-[40px] text-sm" />
                                    <Input type="number" placeholder="扣除: 找零備用金" value={floatCash} onChange={e => setFloatCash(e.target.value)} className="h-[40px] text-sm" />
                                </div>
                                <button onClick={() => {
                                    const rev = Math.max(0, (Number(boxCash)||0) - (Number(floatCash)||0));
                                    setRevenue(rev.toString());
                                    setShowQuickCheckout(false);
                                }} className="w-full py-2 bg-[#ffcc80] text-[#e65100] rounded-lg font-bold text-sm shadow-sm">帶入真實營業額</button>
                            </div>
                        )}

                        <div className="grid grid-cols-2 gap-3 mb-3">
                            <Input type="number" placeholder="電費 (選填)" value={electricity} onChange={e => setElectricity(e.target.value)} disabled={txType === 'refund'} />
                            <Input type="number" placeholder="清潔費 (選填)" value={cleaning} onChange={e => setCleaning(e.target.value)} disabled={txType === 'refund'} />
                            <Input type="number" placeholder="過路費 (選填)" value={toll} onChange={e => setToll(e.target.value)} disabled={txType === 'refund'} />
                            <Input type="number" placeholder="停車費 (選填)" value={parking} onChange={e => setParking(e.target.value)} disabled={txType === 'refund'} />
                        </div>
                        <Input placeholder="備註 (選填)" value={note} onChange={e => setNote(e.target.value)} className="mb-4" />
                        
                        <div className="flex gap-3">
                            {editingId && <button onClick={resetForm} className="flex-1 py-3 bg-gray-100 text-gray-500 rounded-xl font-bold">取消</button>}
                            <button onClick={handleAdd} className={`flex-[2] py-3 text-white rounded-xl font-bold text-lg shadow-md flex justify-center items-center transition-colors ${txType === 'refund' ? 'bg-[#ab47bc]' : (txType === 'clearance' ? 'bg-[#e57373]' : 'bg-[#bc9f8b]')}`}>
                                <Icon name="check_circle" className="mr-2" /> {editingId ? '儲存修改' : '確認入帳'}
                            </button>
                        </div>
                    </Card>

                    <div className="mt-6 mb-4 px-2 text-[#9b4949] font-bold text-lg"><Icon name="history" className="mr-1 align-bottom"/> 近期市場紀錄</div>
                    <div className="space-y-3">
                        {marketSales.slice(0, 30).map(m => (
                            <div key={m.id} className="bg-white rounded-xl p-4 shadow-sm border border-[#f2e7df] relative mx-1">
                                <div className="absolute top-4 right-4 flex gap-1">
                                    <button onClick={() => { setEditingId(m.id); setDate(m.date); setLocation(m.location); setRevenue(Math.abs(m.revenue).toString()); setRent(m.rent||''); setElectricity(m.electricity||''); setCleaning(m.cleaning||''); setToll(m.toll||''); setParking(m.parking||''); setNote(m.note||''); setTxType(m.revenue < 0 ? 'refund' : (m.isClearance ? 'clearance' : 'normal')); window.scrollTo(0,0); }} className="p-1.5 bg-[#fdfaf7] text-[#bc9f8b] rounded-lg"><Icon name="edit" className="text-[18px]" /></button>
                                    <button onClick={() => setConfirmDialog({ isOpen: true, message: "確定刪除此紀錄？", onConfirm: () => setMarketSales(p => p.filter(x => x.id !== m.id)) })} className="p-1.5 bg-[#fdf2f2] text-[#e57373] rounded-lg"><Icon name="delete" className="text-[18px]" /></button>
                                </div>
                                <div className="font-bold text-[#5c4d43] mb-1 flex items-center">
                                    {m.location} 
                                    <span className="ml-2 text-xs font-normal text-[#a89689] bg-[#fdfaf7] px-1 rounded">{m.date}</span>
                                    {m.revenue < 0 && <span className="ml-2 text-[10px] text-white bg-[#ab47bc] px-1.5 rounded-full">退貨</span>}
                                    {m.isClearance && <span className="ml-2 text-[10px] text-white bg-[#e57373] px-1.5 rounded-full">清倉</span>}
                                </div>
                                <div className="text-sm text-[#a89689] flex gap-3">
                                    <span className={m.revenue < 0 ? 'text-[#ab47bc] font-bold' : ''}>營收: ${Number(m.revenue).toLocaleString()}</span>
                                    {Number(m.rent) > 0 && <span className="text-[#e57373]">租: ${Number(m.rent).toLocaleString()}</span>}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // ==========================================
        // 分頁 3: 現貨支出 (進貨/雜支)
        // ==========================================
        const ExpenseTab = ({ expenses, setExpenses, setConfirmDialog }) => {
            const currentDate = new Date().toISOString().split('T')[0];
            const [editingId, setEditingId] = useState(null);
            
            const [date, setDate] = useState(currentDate);
            const [category, setCategory] = useState('進貨款');
            const [amount, setAmount] = useState('');
            const [note, setNote] = useState('');
            const [isUnpaid, setIsUnpaid] = useState(false);

            const resetForm = () => {
                setEditingId(null); setDate(currentDate); setCategory('進貨款'); setAmount(''); setNote(''); setIsUnpaid(false);
            };

            const handleAdd = () => {
                if (!amount) return;
                const record = { date, category, amount: Number(amount) || 0, note, isUnpaid };
                if (editingId) setExpenses(prev => prev.map(e => e.id === editingId ? { ...e, ...record } : e).sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                else setExpenses(prev => [{ id: Date.now().toString(), ...record }, ...prev].sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                resetForm();
            };

            const unpaidList = expenses.filter(e => e.isUnpaid);

            return (
                <div className="animate-fade-in pb-20">
                    {/* 🚨 待付帳款雷達 */}
                    {unpaidList.length > 0 && (
                        <Card className="mb-4 border-[#e57373] bg-[#fff2f2]">
                            <div className="text-[#d32f2f] font-bold mb-3 flex items-center"><Icon name="warning" className="mr-1"/> 🚨 待付款雷達 (未結清)</div>
                            {unpaidList.map(e => (
                                <div key={e.id} className="flex justify-between items-center bg-white p-2 rounded-lg mb-2 shadow-sm border border-[#ffcdd2]">
                                    <div>
                                        <div className="font-bold text-[#5c4d43] text-sm">{e.category} - ${e.amount.toLocaleString()}</div>
                                        <div className="text-xs text-gray-500">{e.note || '無備註'} ({e.date})</div>
                                    </div>
                                    <button onClick={() => setExpenses(prev => prev.map(x => x.id === e.id ? {...x, isUnpaid: false} : x))} className="px-3 py-1 bg-[#4caf50] text-white text-xs font-bold rounded-lg shadow-sm">已結清</button>
                                </div>
                            ))}
                        </Card>
                    )}

                    <Card className={editingId ? 'border-2 border-[#bc9f8b]' : ''}>
                        <div className="flex items-center mb-4 text-[#7a6453] font-bold text-lg"><Icon name={editingId ? 'edit' : 'payments'} className="mr-2 text-[#bc9f8b]" /> {editingId ? '編輯支出' : '新增現貨支出'}</div>
                        
                        <div className="grid grid-cols-2 gap-3 mb-3">
                            <Input type="date" value={date} onChange={e => setDate(e.target.value)} />
                            <select value={category} onChange={e => setCategory(e.target.value)} className="bg-[#fdfdfd] border border-[#f0e6e0] rounded-xl px-3 outline-none font-bold text-[#5c4d43]">
                                <option>進貨款</option><option>運費</option><option>包材什費</option><option>其他</option>
                            </select>
                        </div>
                        <Input type="number" placeholder="支出金額" value={amount} onChange={e => setAmount(e.target.value)} className="mb-3" />
                        <Input placeholder="備註 (廠商名稱/明細)" value={note} onChange={e => setNote(e.target.value)} className="mb-3" />
                        
                        <label className="flex items-center gap-2 mb-4 p-2 bg-[#fdfaf7] rounded-lg border border-[#f2e7df] w-max">
                            <input type="checkbox" checked={isUnpaid} onChange={e => setIsUnpaid(e.target.checked)} className="w-5 h-5 accent-[#e57373]" />
                            <span className="text-sm font-bold text-[#5c4d43]">暫未付款 / 寄賣 (列入雷達)</span>
                        </label>

                        <div className="flex gap-3">
                            {editingId && <button onClick={resetForm} className="flex-1 py-3 bg-gray-100 text-gray-500 rounded-xl font-bold">取消</button>}
                            <button onClick={handleAdd} className="flex-[2] py-3 bg-[#bc9f8b] text-white rounded-xl font-bold text-lg shadow-md flex justify-center items-center">
                                <Icon name="check_circle" className="mr-2" /> {editingId ? '儲存修改' : '新增支出'}
                            </button>
                        </div>
                    </Card>

                    <div className="mt-6 mb-4 px-2 text-[#9b4949] font-bold text-lg"><Icon name="history" className="mr-1 align-bottom"/> 近期支出紀錄</div>
                    <div className="space-y-3">
                        {expenses.slice(0,30).map(e => (
                            <div key={e.id} className="bg-white rounded-xl p-4 shadow-sm border border-[#f2e7df] relative mx-1">
                                <div className="absolute top-4 right-4 flex gap-1">
                                    <button onClick={() => { setEditingId(e.id); setDate(e.date); setCategory(e.category); setAmount(e.amount); setNote(e.note||''); setIsUnpaid(e.isUnpaid||false); window.scrollTo(0,0); }} className="p-1.5 bg-[#fdfaf7] text-[#bc9f8b] rounded-lg"><Icon name="edit" className="text-[18px]" /></button>
                                    <button onClick={() => setConfirmDialog({ isOpen: true, message: "確定刪除此紀錄？", onConfirm: () => setExpenses(p => p.filter(x => x.id !== e.id)) })} className="p-1.5 bg-[#fdf2f2] text-[#e57373] rounded-lg"><Icon name="delete" className="text-[18px]" /></button>
                                </div>
                                <div className="font-bold text-[#5c4d43] mb-1"><span className="bg-[#bc9f8b] w-2 h-2 inline-block rounded-full mr-2"></span>{e.category} <span className="ml-2 text-xs font-normal text-[#a89689] bg-[#fdfaf7] px-1 rounded">{e.date}</span></div>
                                <div className="text-sm text-[#e57373] font-bold mb-1">金額: ${Number(e.amount).toLocaleString()} {e.isUnpaid && <span className="bg-[#e57373] text-white text-[10px] px-1.5 py-0.5 rounded-full ml-2">未付</span>}</div>
                                {e.note && <div className="text-xs text-gray-500">{e.note}</div>}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // ==========================================
        // 分頁 4: 營運報表 (含 VIP 備忘錄與地段雷達)
        // ==========================================
        const ReportTab = ({ deliveries, marketSales, expenses, customerPrefs, setPromptModal }) => {
            const [reportMonth, setReportMonth] = useState(() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; });
            
            const currentDeliveries = deliveries.filter(d => d.date.startsWith(reportMonth));
            const currentMarket = marketSales.filter(m => m.date.startsWith(reportMonth));
            const currentExpenses = expenses.filter(e => e.date.startsWith(reportMonth) && !e.isUnpaid);

            // 拆分業績 (正常 vs 清倉)
            const storeRevenue = currentDeliveries.reduce((sum, d) => sum + (Number(d.revenue) || 0), 0);
            const marketNormalRev = currentMarket.filter(m => !m.isClearance).reduce((sum, m) => sum + (Number(m.revenue) || 0), 0);
            const marketClearanceRev = currentMarket.filter(m => m.isClearance).reduce((sum, m) => sum + (Number(m.revenue) || 0), 0);
            
            const normalTotalRev = storeRevenue + marketNormalRev; // 可抽成業績
            const monthlyTotalRev = normalTotalRev + marketClearanceRev; // 總業績
            
            // 支出
            const marketRent = currentMarket.reduce((sum, m) => sum + (Number(m.rent)||0), 0);
            const marketMisc = currentMarket.reduce((sum, m) => sum + (Number(m.electricity)||0) + (Number(m.cleaning)||0) + (Number(m.toll)||0) + (Number(m.parking)||0), 0);
            const monthlyFixedExp = currentExpenses.filter(e => ['進貨款', '包材什費', '其他'].includes(e.category)).reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            
            // 分潤
            const bossSalary = Math.round(normalTotalRev * 0.35); 
            const companyGross = monthlyTotalRev - bossSalary; // 剩下的全歸公司 (含100%清倉)
            const companyNet = companyGross - marketRent - marketMisc - monthlyFixedExp; 

            // VIP 計算
            const vipStats = {};
            deliveries.forEach(d => {
                if (!d.customerName) return;
                if (!vipStats[d.customerName]) vipStats[d.customerName] = { name: d.customerName, totalRev: 0, count: 0 };
                vipStats[d.customerName].totalRev += (Number(d.revenue)||0);
                vipStats[d.customerName].count += 1;
            });
            const topVips = Object.values(vipStats).sort((a,b) => b.totalRev - a.totalRev).slice(0, 5);

            // 市場地段計算 (依平均單次營業額)
            const locStats = {};
            currentMarket.forEach(m => {
                if (!m.location) return;
                if (!locStats[m.location]) locStats[m.location] = { loc: m.location, rev: 0, rent: 0, count: 0 };
                locStats[m.location].rev += (Number(m.revenue)||0);
                locStats[m.location].rent += (Number(m.rent)||0);
                locStats[m.location].count += 1;
            });
            const sortedLocs = Object.values(locStats).map(L => ({
                ...L, avgRev: Math.round(L.rev / L.count), rentRatio: L.rev > 0 ? (L.rent / L.rev * 100) : 0
            })).sort((a,b) => b.avgRev - a.avgRev);

            return (
                <div className="animate-fade-in pb-20">
                    <div className="flex justify-between items-center mb-4 bg-white p-2 rounded-2xl border border-[#f2e7df] shadow-sm">
                        <button onClick={() => setReportMonth(prev => { const d = new Date(prev+'-01'); d.setMonth(d.getMonth()-1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; })} className="p-2 text-[#bc9f8b] font-bold">&lt;</button>
                        <div className="font-bold text-lg text-[#5c4d43] tracking-wider">{reportMonth.replace('-', '年')}月</div>
                        <button onClick={() => setReportMonth(prev => { const d = new Date(prev+'-01'); d.setMonth(d.getMonth()+1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; })} className="p-2 text-[#bc9f8b] font-bold">&gt;</button>
                    </div>

                    <Card className="bg-gradient-to-r from-[#fff3e0] to-[#ffe0b2] border-[#ffcc80] mb-4">
                        <div className="flex items-center text-[#e65100] font-bold text-lg mb-3 pb-2 border-b border-[#ffb74d]"><Icon name="star" className="mr-2" /> 🎯 淨利分配 (35/65法)</div>
                        <div className="text-[10px] text-[#f57c00] font-bold mb-3 text-center bg-white bg-opacity-50 py-1 rounded-full border border-[#ffcc80]">
                            ※依正常業績 35/65 分配 {marketClearanceRev > 0 && <span className="text-[#e57373]">| 換季清倉全歸公司</span>}
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <div className="bg-white rounded-xl p-3 border-2 border-[#ffb74d] text-center shadow-sm">
                                <div className="text-xs font-bold text-[#f57c00] mb-1">老闆私房薪水 (35%)</div>
                                <div className="text-2xl font-black text-[#e65100]">${bossSalary.toLocaleString()}</div>
                            </div>
                            <div className="bg-[#f0f9f0] rounded-xl p-3 border-2 border-[#81c784] text-center shadow-sm">
                                <div className="text-xs font-bold text-[#388e3c] mb-1">公司營運結餘 (65%)</div>
                                <div className={`text-2xl font-black ${companyNet >= 0 ? 'text-[#2e7d32]' : 'text-[#d32f2f]'}`}>${companyNet.toLocaleString()}</div>
                                {companyNet < 0 && <div className="text-[10px] text-[#d32f2f] mt-1">支出大於保留金</div>}
                            </div>
                        </div>
                    </Card>

                    {/* 💖 VIP 乾媽排行榜 */}
                    <Card className="bg-[#fff8e1] border-[#ffe082] mb-4 shadow-sm">
                        <div className="flex items-center text-[#e65100] font-bold text-lg mb-3 pb-2 border-b border-[#ffe082]"><Icon name="favorite" className="mr-2 text-[#f50057]" /> 💖 VIP 乾媽排行榜</div>
                        <div className="text-[10px] text-[#f57f17] mb-3 text-center">點擊客人名字可新增專屬備忘錄！</div>
                        
                        {topVips.length === 0 ? <div className="text-center text-[#c4b5aa] text-xs py-4">目前尚無客戶結單數據</div> : (
                            <div className="space-y-2">
                                {topVips.map((vip, idx) => (
                                    <div key={vip.name} onClick={() => setPromptModal({
                                        isOpen: true, title: `設定「${vip.name}」的專屬備註`, value: customerPrefs[vip.name] || '',
                                        onConfirm: (val) => { /* Update handled in App */ }
                                    }, vip.name)} className="flex justify-between items-center bg-white p-3 rounded-xl border border-[#ffecb3] shadow-sm cursor-pointer hover:bg-[#fffde7]">
                                        <div className="flex items-center gap-3">
                                            <span className={`w-6 h-6 rounded-full flex justify-center items-center text-xs font-black text-white ${idx === 0 ? 'bg-[#ff9800]' : idx === 1 ? 'bg-[#bdbdbd]' : idx === 2 ? 'bg-[#8d6e63]' : 'bg-[#ffcc80]'}`}>{idx + 1}</span>
                                            <div>
                                                <div className="font-bold text-[#5c4d43]">{vip.name} <Icon name="edit_note" className="text-[14px] text-[#bc9f8b]" /></div>
                                                {customerPrefs[vip.name] && <div className="text-[10px] text-[#f57f17] bg-[#fff8e1] px-1.5 py-0.5 rounded mt-1 border border-[#ffe082] inline-block">{customerPrefs[vip.name]}</div>}
                                                <div className="text-[10px] text-[#a89689] mt-0.5">購買 {vip.count} 次</div>
                                            </div>
                                        </div>
                                        <div className="font-black text-[#e65100]">${vip.totalRev.toLocaleString()}</div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </Card>

                    {/* 👑 市場地段含金量排行榜 */}
                    <Card className="mb-4">
                        <div className="flex items-center text-[#5c4d43] font-bold text-lg mb-3 pb-2 border-b border-[#f0e6e0]"><Icon name="store" className="mr-2 text-[#bc9f8b]" /> 👑 地段含金量排行榜</div>
                        <div className="text-[10px] text-[#a89689] mb-3 text-center">依平均單次營業額排序</div>
                        {sortedLocs.length === 0 ? <div className="text-center text-[#c4b5aa] text-xs py-4">本月無市場數據</div> : (
                            <div className="space-y-3">
                                {sortedLocs.map((loc, idx) => (
                                    <div key={loc.loc} className="bg-[#fdfaf7] rounded-xl p-3 border border-[#f2e7df]">
                                        <div className="flex justify-between items-center mb-2">
                                            <div className="font-bold text-[#5c4d43] flex items-center"><span className="bg-[#bc9f8b] text-white w-5 h-5 rounded flex items-center justify-center text-xs mr-2">{idx+1}</span>{loc.loc}</div>
                                            <div className="font-black text-[#bc9f8b] text-lg">${loc.avgRev.toLocaleString()} <span className="text-[10px] font-normal text-[#a89689]">/均次</span></div>
                                        </div>
                                        <div className="flex justify-between text-xs items-center">
                                            <span className="text-[#a89689]">出攤 {loc.count} 次</span>
                                            <span className={`px-2 py-0.5 rounded-full font-bold ${loc.rentRatio < 15 ? 'bg-[#e8f5e9] text-[#2e7d32]' : (loc.rentRatio > 25 ? 'bg-[#ffebee] text-[#c62828]' : 'bg-gray-100 text-gray-600')}`}>
                                                租金佔比: {loc.rentRatio.toFixed(1)}% {loc.rentRatio < 15 ? '🔥神級' : (loc.rentRatio > 25 ? '🚨打工' : '')}
                                            </span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </Card>
                </div>
            );
        };


        // ==========================================
        // 主應用程式 App
        // ==========================================
        const App = () => {
            const [activeTab, setActiveTab] = useState('market');
            
            // 資料狀態
            const [deliveries, setDeliveries] = useDataSync('xq_deliveries', []);
            const [marketSales, setMarketSales] = useDataSync('xq_market_sales', []);
            const [expenses, setExpenses] = useDataSync('xq_expenses', []);
            const [customerPrefs, setCustomerPrefs] = useDataSync('xq_customer_prefs', {});

            // 全域對話框狀態
            const [confirmModal, setConfirmModal] = useState({ isOpen: false, message: '', onConfirm: null });
            const [promptModal, setPromptModal] = useState({ isOpen: false, title: '', value: '', onConfirm: null, targetKey: '' });
            const [calcModalOpen, setCalcModalOpen] = useState(false);

            // 準備給 AutoComplete 的所有客戶名單
            const allCustomerNames = useMemo(() => {
                const names = new Set();
                deliveries.forEach(d => { if (d.customerName) names.add(d.customerName); });
                return Array.from(names);
            }, [deliveries]);

            return (
                <div className="flex flex-col h-screen max-w-lg mx-auto bg-[#fdfaf7] shadow-2xl relative overflow-hidden">
                    {/* Header */}
                    <header className="bg-[#bc9f8b] text-white p-4 shadow-md flex justify-between items-center shrink-0 z-20">
                        <div className="flex items-center gap-2 font-black text-xl tracking-wider">
                            <span className="text-2xl drop-shadow-md">💰</span> 200%森衣好
                        </div>
                        <div className="flex gap-3">
                            <button onClick={() => setCalcModalOpen(true)} className="bg-[#a88c79] p-2 rounded-xl shadow-inner active:scale-95 transition-transform"><Icon name="calculate" /></button>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 overflow-y-auto p-4 custom-scrollbar">
                        {activeTab === 'store' && <StoreTab deliveries={deliveries} setDeliveries={setDeliveries} setConfirmDialog={setConfirmModal} allCustomerNames={allCustomerNames} />}
                        {activeTab === 'market' && <MarketTab marketSales={marketSales} setMarketSales={setMarketSales} setConfirmDialog={setConfirmModal} />}
                        {activeTab === 'expense' && <ExpenseTab expenses={expenses} setExpenses={setExpenses} setConfirmDialog={setConfirmModal} />}
                        {activeTab === 'report' && <ReportTab deliveries={deliveries} marketSales={marketSales} expenses={expenses} customerPrefs={customerPrefs} setPromptModal={setPromptModal} />}
                    </main>

                    {/* Bottom Nav */}
                    <nav className="bg-white border-t border-[#f2e7df] flex justify-around py-2 pb-safe fixed bottom-0 w-full max-w-lg z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] px-2 rounded-t-3xl">
                        {[
                            { id: 'store', icon: 'local_shipping', label: '超商網拍' },
                            { id: 'market', icon: 'storefront', label: '現貨市場' },
                            { id: 'expense', icon: 'payments', label: '現貨支出' },
                            { id: 'report', icon: 'bar_chart', label: '營運報表' }
                        ].map(tab => (
                            <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex flex-col items-center p-2 rounded-2xl w-[22%] transition-all duration-300 ${activeTab === tab.id ? 'text-[#bc9f8b] bg-[#fdfaf7] shadow-inner scale-105' : 'text-[#c4b5aa] hover:bg-gray-50'}`}>
                                <Icon name={tab.icon} className={`text-[24px] mb-1 transition-transform ${activeTab === tab.id ? 'font-bold -translate-y-1' : ''}`} />
                                <span className="text-[10px] font-black tracking-wide">{tab.label}</span>
                            </button>
                        ))}
                    </nav>

                    {/* 統一的 Confirm Modal (刪除用) */}
                    <Modal isOpen={confirmModal.isOpen} title="⚠️ 確認動作" actions={
                        <>
                            <button onClick={() => setConfirmModal({isOpen: false})} className="px-4 py-2 bg-gray-100 text-gray-600 font-bold rounded-xl">取消</button>
                            <button onClick={() => { if(confirmModal.onConfirm) confirmModal.onConfirm(); setConfirmModal({isOpen: false}); }} className="px-4 py-2 bg-[#e57373] text-white font-bold rounded-xl">確定刪除</button>
                        </>
                    }>
                        <p>{confirmModal.message}</p>
                    </Modal>

                    {/* 統一的 Prompt Modal (VIP 備忘錄用) */}
                    <Modal isOpen={promptModal.isOpen} title={promptModal.title} actions={
                        <>
                            <button onClick={() => setPromptModal({isOpen: false})} className="px-4 py-2 bg-gray-100 text-gray-600 font-bold rounded-xl">取消</button>
                            <button onClick={() => { 
                                setCustomerPrefs(prev => ({...prev, [promptModal.targetKey]: promptModal.value.trim()})); 
                                setPromptModal({isOpen: false}); 
                            }} className="px-4 py-2 bg-[#bc9f8b] text-white font-bold rounded-xl">儲存</button>
                        </>
                    }>
                        <input type="text" value={promptModal.value} onChange={e => setPromptModal({...promptModal, value: e.target.value})} placeholder="例如: 穿XL、不愛蕾絲" className="w-full bg-[#fdfdfd] border border-[#f0e6e0] rounded-xl px-4 py-3 outline-none focus:border-[#bc9f8b]" />
                    </Modal>

                    {/* 計算機 Modal */}
                    <CalculatorModal isOpen={calcModalOpen} onClose={() => setCalcModalOpen(false)} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
