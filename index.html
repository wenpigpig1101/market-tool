<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>200%森衣好</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google 字體與 Material 圖示 -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    
    <!-- React & Babel -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>

    <style>
        body { background-color: #fdfaf7; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .font-wawa { font-family: 'HanziPen TC', 'Hannotate TC', 'DFWawaTC-W5', '華康娃娃體', 'M PLUS Rounded 1c', sans-serif !important; }
        input::placeholder { font-family: 'HanziPen TC', 'Hannotate TC', 'M PLUS Rounded 1c', sans-serif; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .animate-expand { animation: expandDown 0.2s ease-out forwards; transform-origin: top; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes expandDown { from { opacity: 0; transform: scaleY(0.9); } to { opacity: 1; transform: scaleY(1); } }
    </style>
</head>
<body class="font-wawa text-[#5c4d43]">
    <div id="root">
        <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #bc9f8b; font-weight: bold; font-size: 1.2rem;">
            <div style="width: 40px; height: 40px; border: 4px solid #f2e7df; border-top-color: #bc9f8b; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
            載入企業會計系統中...💰
            <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
        </div>
    </div>

    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            var errorHtml = '<div style="padding: 30px; text-align: center; color: #e57373;">' +
                            '<h3 style="font-size:24px; margin-bottom:10px;">🛡️ 系統啟動保護</h3>' +
                            '<p style="font-size:14px; margin-bottom:10px;">我們偵測到您的網頁正在讀取異常的舊快取。</p>' +
                            '<p style="font-size:14px; margin-bottom:20px; color:#7a6453;">請您<strong>「清除瀏覽紀錄」</strong>或使用<strong>「無痕模式」</strong>重新開啟網頁。</p>' +
                            '<pre style="font-size:10px; text-align:left; background:#fff; padding:10px; border-radius:8px; overflow-x:auto;">' + msg + '</pre>' +
                            '</div>';
            document.getElementById('root').innerHTML = errorHtml;
            return false;
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, Component } = React;
        const safeStr = (str) => String(str || '');

        const safeTime = (d) => {
            if (!d) return 0;
            const t = new Date(d).getTime();
            return isNaN(t) ? 0 : t;
        };

        const getSafeArr = (arr) => {
            if (!Array.isArray(arr)) return [];
            return arr.filter(i => i !== null && typeof i === 'object' && !Array.isArray(i));
        };

        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorStr: '' };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, errorStr: error.toString() };
            }
            componentDidCatch(error, errorInfo) {
                console.error("渲染錯誤：", error, errorInfo);
            }
            repairAndReload() {
                const cleanArray = (key) => {
                    try {
                        const raw = JSON.parse(localStorage.getItem(key));
                        if (Array.isArray(raw)) {
                            const today = new Date().toISOString().split('T')[0];
                            const clean = raw
                                .filter(i => i && typeof i === 'object' && !Array.isArray(i))
                                .map(i => {
                                    const t = new Date(i.date).getTime();
                                    if (!i.date || isNaN(t)) {
                                        return { ...i, date: today };
                                    }
                                    return i;
                                });
                            localStorage.setItem(key, JSON.stringify(clean));
                        } else {
                            localStorage.setItem(key, '[]');
                        }
                    } catch(e) {
                        localStorage.setItem(key, '[]');
                    }
                };
                
                cleanArray('xq_deliveries');
                cleanArray('xq_marketSales');
                cleanArray('xq_expenses');
                cleanArray('xq_reservations');

                try {
                    const stats = JSON.parse(localStorage.getItem('xq_market_sold'));
                    if (!stats || typeof stats !== 'object' || Array.isArray(stats)) {
                        localStorage.setItem('xq_market_sold', '{}');
                    }
                } catch(e) {}

                window.location.reload();
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="flex flex-col h-screen p-8 text-center text-[#e57373] bg-[#fdfaf7] justify-center">
                            <div className="text-5xl mb-4">🛡️</div>
                            <h2 className="text-xl font-bold mb-2">資料結構修復中</h2>
                            <p className="text-sm text-[#a89689] mb-4 leading-relaxed">偵測到部分舊資料格式衝突。<br/>請點擊下方按鈕，系統將為您自動修復。</p>
                            <textarea className="w-full h-16 p-2 text-[9px] bg-white border border-[#f2e7df] rounded-xl mb-6 custom-scrollbar opacity-60" readOnly value={this.state.errorStr}></textarea>
                            <button onClick={() => this.repairAndReload()} className="w-full py-4 bg-[#bc9f8b] text-white font-bold rounded-xl shadow-md">
                                一鍵修復並重新整理
                            </button>
                        </div>
                    );
                }
                return this.props.children; 
            }
        }

        const useLocalStorage = (key, initialValue) => {
            const [value, setValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    if (item) {
                        const parsed = JSON.parse(item);
                        return parsed !== null ? parsed : initialValue;
                    }
                    return initialValue;
                } catch (error) { 
                    return initialValue; 
                }
            });

            useEffect(() => {
                try { 
                    window.localStorage.setItem(key, JSON.stringify(value)); 
                } catch (error) { 
                    console.warn("寫入失敗", error); 
                }
            }, [key, value]);

            return [value, setValue];
        };

        const scrollToTop = () => {
            const main = document.getElementById('main-content');
            if(main) main.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const Icon = ({ name, className = "" }) => <span className={`material-symbols-outlined ${className}`}>{name}</span>;
        const Card = ({ children, className = "" }) => <div className={`bg-white rounded-2xl p-4 shadow-sm border border-[#f2e7df] mb-4 ${className}`}>{children}</div>;
        
        const Input = ({ label, value, onChange, type = "text", placeholder, disabled }) => (
            <div className="mb-3 w-full">
                <div className={`flex items-center bg-[#fdfdfd] border border-[#f0e6e0] rounded-xl px-3 h-[48px] focus-within:border-[#bc9f8b] transition-colors ${disabled ? 'opacity-60 bg-[#f9f9f9]' : ''}`}>
                    <input type={type} value={value} onChange={onChange} placeholder={placeholder || label} disabled={disabled}
                        className="bg-transparent w-full h-full outline-none text-[#5c4d43] placeholder-[#c4b5aa] text-[15px] font-wawa" />
                </div>
            </div>
        );

        const Button = ({ children, onClick, className = "" }) => (
            <button onClick={onClick} className={`w-full h-[48px] rounded-xl font-bold transition-colors text-[15px] text-center flex justify-center items-center font-wawa tracking-wide shadow-sm ${className}`}>
                {children}
            </button>
        );

        const ConfirmModal = ({ isOpen, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 animate-fade-in px-4">
                    <div className="bg-white rounded-2xl p-6 w-full max-w-xs shadow-xl">
                        <div className="text-center text-[#5c4d43] font-bold mb-6 text-lg">{message}</div>
                        <div className="flex gap-3">
                            <button onClick={onCancel} className="flex-1 py-3 rounded-xl bg-[#f2e7df] text-[#7a6453] font-bold">取消</button>
                            <button onClick={onConfirm} className="flex-1 py-3 rounded-xl bg-[#e57373] text-white font-bold">確定刪除</button>
                        </div>
                    </div>
                </div>
            );
        };

        const formatRevenueStr = (num) => {
            const validNum = Number(num) || 0;
            if (validNum >= 10000) return Number.isInteger(validNum / 10000) ? `${validNum / 10000}萬` : `${(validNum / 10000).toFixed(1)}萬`;
            if (validNum >= 1000) return Number.isInteger(validNum / 1000) ? `${validNum / 1000}千` : `${(validNum / 1000).toFixed(1)}千`;
            return validNum.toString();
        };

        // --- 分頁 1：超商 ---
        const StoreTab = ({ deliveries, setDeliveries, setConfirmDialog }) => {
            const [editingId, setEditingId] = useState(null);
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [customerName, setCustomerName] = useState('');
            const [revenue, setRevenue] = useState('');
            const [soldQty, setSoldQty] = useState(''); 
            const [shippingExpense, setShippingExpense] = useState('');
            const [shippingIncome, setShippingIncome] = useState('');
            const [hasGift, setHasGift] = useState(false);
            const [giftCount, setGiftCount] = useState('');

            const resetForm = () => {
                setEditingId(null);
                setDate(new Date().toISOString().split('T')[0]);
                setCustomerName(''); setRevenue(''); setSoldQty(''); setShippingExpense(''); setShippingIncome(''); setGiftCount(''); setHasGift(false);
            };

            const handleAddDelivery = () => {
                if (!customerName) return;
                const recordData = {
                    date, customerName, 
                    revenue: Number(revenue) || 0, 
                    soldQty: Number(soldQty) || 1, 
                    shippingExpense: Number(shippingExpense) || 0, shippingIncome: Number(shippingIncome) || 0,
                    hasGift, giftCount: hasGift ? (Number(giftCount) || 0) : 0, status: 'pending'
                };

                if (editingId) {
                    setDeliveries(prev => prev.map(d => d.id === editingId ? { ...d, ...recordData } : d).sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                } else {
                    const newRecord = { id: Date.now().toString(), ...recordData };
                    setDeliveries(prev => [newRecord, ...prev].sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                }
                resetForm();
            };

            const handleEditClick = (record) => {
                setEditingId(record.id);
                setDate(record.date); setCustomerName(record.customerName); 
                setRevenue(record.revenue || ''); setSoldQty(record.soldQty || '');
                setShippingExpense(record.shippingExpense || ''); setShippingIncome(record.shippingIncome || '');
                setHasGift(record.hasGift || false); setGiftCount(record.giftCount || '');
                scrollToTop();
            };

            const toggleStatus = (id, currentStatus) => {
                const newStatus = currentStatus === 'pending' ? 'shipped' : 'pending';
                setDeliveries(prev => prev.map(d => d.id === id ? { ...d, status: newStatus } : d));
            };

            const pending = deliveries.filter(d => d.status === 'pending');
            const shipped = deliveries.filter(d => d.status === 'shipped');

            return (
                <div className="animate-fade-in pb-20">
                    <Card className={editingId ? 'border-2 border-[#bc9f8b]' : ''}>
                        <div className="flex items-center mb-4 text-[#7a6453] font-bold text-lg">
                            <Icon name={editingId ? 'edit' : 'inventory_2'} className="mr-2 text-[#bc9f8b]" /> 
                            {editingId ? '編輯寄件資料' : '新增寄件'}
                        </div>
                        <Input type="date" value={date} onChange={e => setDate(e.target.value)} />
                        <Input placeholder="顧客姓名" value={customerName} onChange={e => setCustomerName(e.target.value)} />
                        
                        <div className="grid grid-cols-2 gap-3">
                            <Input type="number" placeholder="商品售價(總額)" value={revenue} onChange={e => setRevenue(e.target.value)} />
                            <Input type="number" placeholder="售出服飾件數" value={soldQty} onChange={e => setSoldQty(e.target.value)} />
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            <Input type="number" placeholder="賣家付運費(成本)" value={shippingExpense} onChange={e => setShippingExpense(e.target.value)} />
                            <Input type="number" placeholder="買家付運費(代收)" value={shippingIncome} onChange={e => setShippingIncome(e.target.value)} />
                        </div>
                        
                        <div className="grid grid-cols-2 gap-3 mb-4">
                            <button 
                                className={`w-full h-[48px] rounded-xl border text-[15px] transition-colors font-wawa font-bold flex items-center justify-center ${hasGift ? 'border-[#bc9f8b] bg-[#fdfaf7] text-[#bc9f8b]' : 'border-[#f0e6e0] bg-[#fdfdfd] text-[#a89689]'}`} 
                                onClick={(e) => { e.preventDefault(); setHasGift(!hasGift); }}>
                                🎁 {hasGift ? '有贈品' : '無贈品'}
                            </button>
                            <div className={`flex items-center bg-[#fdfdfd] border border-[#f0e6e0] rounded-xl px-3 h-[48px] focus-within:border-[#bc9f8b] transition-colors ${!hasGift ? 'opacity-60 bg-[#f9f9f9]' : ''}`}>
                                <input type="number" placeholder="贈品數量" value={giftCount} onChange={e => setGiftCount(e.target.value)} disabled={!hasGift} className="bg-transparent w-full h-full outline-none text-[#5c4d43] placeholder-[#c4b5aa] text-[15px] font-wawa" />
                            </div>
                        </div>
                        
                        <div className="flex gap-3">
                            {editingId && (
                                <Button onClick={resetForm} className="flex-1 bg-[#f2e7df] !text-[#7a6453]">取消</Button>
                            )}
                            <Button onClick={handleAddDelivery} className={editingId ? 'flex-[2] bg-[#bc9f8b] text-white' : 'w-full bg-[#bc9f8b] text-white'}>
                                {editingId ? '儲存修改' : '新增寄件'}
                            </Button>
                        </div>
                    </Card>

                    <div className="mt-6 mb-2 flex items-center text-[#9b4949] font-bold px-2 text-lg"><Icon name="push_pin" className="mr-1 text-[20px]" /> 未寄出 <span className="ml-2 bg-[#d6aba3] text-white text-xs px-2 py-0.5 rounded-full">{pending.length}</span></div>
                    {pending.length === 0 ? <div className="text-center text-[#c4b5aa] text-sm py-4">太棒了，目前沒有未寄出清單！</div> : pending.map(d => (
                        <div key={d.id} className="bg-white rounded-xl p-3 mb-2 shadow-sm border border-[#f2e7df] flex justify-between items-center px-4">
                            <div>
                                <div className="font-bold text-[#5c4d43] text-base">{d.customerName}</div>
                                <div className="text-xs text-[#a89689] mt-0.5">{d.date} | 售:${d.revenue} <span className="ml-1 bg-orange-50 text-[#bc9f8b] px-1 rounded">{d.soldQty || 1}件</span></div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => toggleStatus(d.id, d.status)} className="p-2 bg-[#f0f9f0] text-[#4caf50] rounded-lg shadow-sm"><Icon name="check_box" /></button>
                                <button onClick={() => handleEditClick(d)} className="p-2 bg-[#fdfaf7] text-[#bc9f8b] rounded-lg shadow-sm"><Icon name="edit" className="text-[20px]" /></button>
                                <button onClick={() => setConfirmDialog({isOpen: true, id: d.id, collection: 'deliveries'})} className="p-2 bg-[#fdf2f2] text-[#e57373] rounded-lg shadow-sm"><Icon name="delete" className="text-[20px]" /></button>
                            </div>
                        </div>
                    ))}

                    <div className="mt-6 mb-2 flex items-center text-[#4caf50] font-bold px-2 text-lg"><Icon name="check_box" className="mr-1 text-[20px]" /> 已寄出 <span className="ml-2 bg-[#a5d6a7] text-white text-xs px-2 py-0.5 rounded-full">{shipped.length}</span></div>
                    {shipped.length === 0 ? <div className="text-center text-[#c4b5aa] text-sm py-4">尚無紀錄</div> : shipped.slice(0,10).map(d => (
                        <div key={d.id} className="bg-[#fafafa] rounded-xl p-3 mb-2 border border-[#f0f0f0] flex justify-between items-center px-4 opacity-70">
                            <div><div className="font-bold text-[#7a6453] line-through text-base">{d.customerName}</div><div className="text-xs text-[#a89689] mt-0.5">{d.date} <span className="ml-1 bg-[#f0f0f0] text-[#a89689] px-1 rounded">{d.soldQty || 1}件</span></div></div>
                            <div className="flex gap-2">
                                <button onClick={() => toggleStatus(d.id, d.status)} className="p-2 text-[#a89689]"><Icon name="undo" /></button>
                                <button onClick={() => handleEditClick(d)} className="p-2 text-[#bc9f8b]"><Icon name="edit" className="text-[18px]" /></button>
                                <button onClick={() => setConfirmDialog({isOpen: true, id: d.id, collection: 'deliveries'})} className="p-2 text-[#e57373]"><Icon name="delete" className="text-[18px]" /></button>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        // --- 分頁 2：市場 ---
        const MarketTab = ({ marketSales, setMarketSales, setConfirmDialog }) => {
            const currentDate = new Date().toISOString().split('T')[0];
            const [editingId, setEditingId] = useState(null);
            
            const [date, setDate] = useState(currentDate);
            const [location, setLocation] = useState('');
            const [revenue, setRevenue] = useState('');
            const [soldQty, setSoldQty] = useState(''); 
            const [rent, setRent] = useState('');
            const [note, setNote] = useState('');
            const [electricity, setElectricity] = useState('');
            const [cleaning, setCleaning] = useState('');
            const [gas, setGas] = useState(''); // 這個欄位在 UI 隱藏，但保留 state 以防萬一
            const [toll, setToll] = useState('');
            const [parking, setParking] = useState('');
            const [hasGift, setHasGift] = useState(false);
            const [giftCount, setGiftCount] = useState('');
            const [acc, setAcc] = useState({ necklace: '', hat: '', bag: '', other: '' });

            const [viewMonthStr, setViewMonthStr] = useState(currentDate.substring(0, 7));
            const [selectedDay, setSelectedDay] = useState(currentDate);
            
            const [searchTerm, setSearchTerm] = useState('');

            const dailyStats = useMemo(() => {
                const stats = {};
                marketSales.forEach(m => {
                    const mDate = safeStr(m.date);
                    if (mDate.startsWith(viewMonthStr)) {
                        if (!stats[mDate]) stats[mDate] = { revenue: 0, locations: [] };
                        stats[mDate].revenue += (Number(m.revenue) || 0);
                        if (m.location && !stats[mDate].locations.includes(m.location)) {
                            stats[mDate].locations.push(m.location);
                        }
                    }
                });
                return stats;
            }, [marketSales, viewMonthStr]);

            const resetForm = () => {
                setEditingId(null); setDate(currentDate); setLocation(''); setRevenue(''); setSoldQty(''); setRent(''); setNote(''); 
                setElectricity(''); setCleaning(''); setToll(''); setParking(''); setHasGift(false); setGiftCount(''); 
                setAcc({ necklace: '', hat: '', bag: '', other: '' });
                setSearchTerm('');
            };

            const handleRevenueChange = (e) => {
                const val = e.target.value;
                setRevenue(val);
                if (val !== '') {
                    setSoldQty(Math.round(Number(val) / 200).toString());
                } else {
                    setSoldQty('');
                }
            };

            const handleAddMarket = () => {
                if (!location) return;
                const recordData = {
                    date, location, revenue: Number(revenue) || 0, soldQty: Number(soldQty) || 0,
                    rent: Number(rent) || 0, note,
                    electricity: Number(electricity) || 0, cleaning: Number(cleaning) || 0,
                    toll: Number(toll) || 0, parking: Number(parking) || 0,
                    gas: 0, // 確保未來新增的紀錄 gas 都是 0
                    hasGift, giftCount: hasGift ? (Number(giftCount) || 0) : 0,
                    accessories: { necklace: Number(acc.necklace) || 0, hat: Number(acc.hat) || 0, bag: Number(acc.bag) || 0, other: Number(acc.other) || 0 }
                };
                
                if (editingId) {
                    setMarketSales(prev => prev.map(m => m.id === editingId ? { ...m, ...recordData } : m).sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                } else {
                    const newRecord = { id: Date.now().toString(), ...recordData };
                    setMarketSales(prev => [newRecord, ...prev].sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                }
                resetForm();
            };

            const handleEditClick = (record) => {
                setEditingId(record.id);
                setDate(record.date); setLocation(record.location); setRevenue(record.revenue || ''); setSoldQty(record.soldQty || '');
                setRent(record.rent || ''); setNote(record.note || ''); setElectricity(record.electricity || '');
                setCleaning(record.cleaning || ''); setToll(record.toll || ''); setParking(record.parking || '');
                setHasGift(record.hasGift || false); setGiftCount(record.giftCount || '');
                const rac = record.accessories || {};
                setAcc({
                    necklace: rac.necklace || '', hat: rac.hat || '',
                    bag: rac.bag || '', other: rac.other || ''
                });
                setSearchTerm('');
                scrollToTop();
            };

            const changeMonth = (offset) => {
                const parts = safeStr(viewMonthStr).split('-');
                if (parts.length >= 2 && !isNaN(parseInt(parts[0], 10))) {
                    const newDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1 + offset, 1);
                    setViewMonthStr(`${newDate.getFullYear()}-${String(newDate.getMonth() + 1).padStart(2, '0')}`);
                }
            };

            const renderCalendarDays = () => {
                const parts = safeStr(viewMonthStr).split('-');
                if (parts.length < 2 || isNaN(parseInt(parts[0], 10))) return [];
                const y = parseInt(parts[0], 10), m = parseInt(parts[1], 10) - 1;
                const daysInMonth = new Date(y, m + 1, 0).getDate();
                const startDayOfWeek = new Date(y, m, 1).getDay();
                const days = [];
                for (let i = 0; i < startDayOfWeek; i++) days.push(<div key={`empty-${i}`} className="h-[4.5rem]"></div>);
                for (let i = 1; i <= daysInMonth; i++) {
                    const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                    const isSelected = dateStr === selectedDay;
                    const stat = dailyStats[dateStr];
                    const hasData = !!stat;
                    const rev = hasData ? stat.revenue : 0;
                    const locStr = hasData ? stat.locations.join(', ') : '';

                    days.push(
                        <div key={dateStr} onClick={() => {setSelectedDay(dateStr); setDate(dateStr);}} 
                             className={`h-[4.5rem] py-1 flex flex-col items-center justify-start rounded-xl cursor-pointer transition-all overflow-hidden ${isSelected ? 'bg-[#bc9f8b] text-white shadow-md' : hasData ? 'border border-[#bc9f8b] bg-[#fdfaf7] text-[#5c4d43]' : 'text-[#7a6453] hover:bg-[#f2e7df]'}`}>
                            <span className={`text-sm font-bold ${isSelected ? 'text-white' : ''} leading-tight mb-0.5`}>{i}</span>
                            {hasData && (
                                <div className="flex flex-col items-center w-full px-0.5">
                                    {locStr && <span className={`text-[9px] w-full truncate text-center mb-0.5 ${isSelected ? 'text-[#f0e6e0]' : 'text-[#a89689]'}`}>{locStr}</span>}
                                    <span className={`text-[11px] font-black leading-none ${isSelected ? 'text-white' : 'text-[#4caf50]'}`}>{formatRevenueStr(rev)}</span>
                                </div>
                            )}
                        </div>
                    );
                }
                return days;
            };

            const searchedSales = searchTerm
                ? marketSales.filter(m => safeStr(m.location).includes(searchTerm)).sort((a, b) => safeTime(b.date) - safeTime(a.date))
                : [];

            const renderSearchResults = () => {
                if (!searchTerm) return null;
                if (searchedSales.length === 0) return <div className="text-center text-[#c4b5aa] py-8 mx-2 mt-4 bg-white rounded-2xl border border-dashed border-[#e0d6ce]">找不到「{searchTerm}」的歷史紀錄 🥺</div>;

                const times = searchedSales.length;
                const totalRev = searchedSales.reduce((sum, m) => sum + (Number(m.revenue) || 0), 0);
                const totalProfit = searchedSales.reduce((sum, m) => {
                    const dailyMisc = (Number(m.electricity) || 0) + (Number(m.cleaning) || 0) + (Number(m.toll) || 0) + (Number(m.parking) || 0);
                    return sum + (Number(m.revenue) || 0) - (Number(m.rent) || 0) - dailyMisc;
                }, 0);

                return (
                    <div className="animate-fade-in mt-6">
                        <Card className="bg-gradient-to-r from-[#fffde7] to-[#fff8e1] border-[#fff59d] mb-4">
                            <div className="flex items-center text-[#f57f17] font-bold text-lg mb-3 pb-2 border-b border-[#fff59d]">
                                <Icon name="analytics" className="mr-2" /> 「{searchTerm}」績效評估報告
                            </div>
                            <div className="grid grid-cols-2 gap-y-3 gap-x-2 text-sm text-[#7a6453]">
                                <div className="flex flex-col"><span className="text-[10px] text-[#a89689] font-bold">出攤次數</span><span className="font-black text-lg text-[#5c4d43]">{times} 次</span></div>
                                <div className="flex flex-col"><span className="text-[10px] text-[#a89689] font-bold">累積總業績</span><span className="font-black text-lg text-[#5c4d43]">${totalRev.toLocaleString()}</span></div>
                                <div className="flex flex-col"><span className="text-[10px] text-[#a89689] font-bold">平均單次業績</span><span className="font-black text-xl text-[#4caf50]">${Math.round(totalRev / times).toLocaleString()}</span></div>
                                <div className="flex flex-col"><span className="text-[10px] text-[#a89689] font-bold">單次淨利(扣攤租雜支)</span><span className="font-black text-xl text-[#e57373]">${Math.round(totalProfit / times).toLocaleString()}</span></div>
                            </div>
                        </Card>
                        
                        <div className="text-[#9b4949] font-bold px-2 text-lg mb-2"><Icon name="history" className="align-middle text-[20px] mr-1" /> 歷史足跡明細</div>
                        {searchedSales.map(m => {
                            const dailyMisc = (Number(m.electricity) || 0) + (Number(m.cleaning) || 0) + (Number(m.toll) || 0) + (Number(m.parking) || 0);
                            const operatingProfit = (Number(m.revenue)||0) - (Number(m.rent)||0) - dailyMisc; 
                            return (
                                <div key={m.id} className="bg-white rounded-xl p-4 mb-3 shadow-sm border border-[#f2e7df] relative mx-1">
                                    <div className="absolute top-4 right-4 flex gap-1">
                                        <button onClick={() => handleEditClick(m)} className="p-1.5 bg-[#fdfaf7] text-[#bc9f8b] rounded-lg shadow-sm"><Icon name="edit" className="text-[18px]" /></button>
                                        <button onClick={() => setConfirmDialog({isOpen: true, id: m.id, collection: 'market_sales'})} className="p-1.5 bg-[#fdf2f2] text-[#e57373] rounded-lg shadow-sm"><Icon name="delete" className="text-[18px]" /></button>
                                    </div>
                                    <div className="font-bold text-[#5c4d43] mb-1 text-base flex items-center"><span className="bg-[#bc9f8b] w-2 h-2 rounded-full mr-2"></span>{m.location} <span className="ml-2 text-xs font-normal text-[#a89689] bg-[#fdfaf7] px-1 rounded">{m.date}</span></div>
                                    {m.note && <div className="text-xs text-[#a89689] mb-2 pl-4">備註: {m.note}</div>}
                                    <div className="text-sm text-[#7a6453] grid grid-cols-2 gap-y-1.5 mt-3 pt-3 border-t border-[#fdfaf7] pl-4">
                                        <div>營業額: <span className="font-bold text-[#5c4d43]">${m.revenue}</span> <span className="ml-1 bg-orange-50 text-[#bc9f8b] text-[10px] px-1 rounded">{m.soldQty||0}件</span></div>
                                        <div>攤租雜支: <span className="font-medium">-${(Number(m.rent)||0) + dailyMisc}</span></div>
                                        <div className="font-bold text-[#bc9f8b] col-span-2">單日淨收入 (未扣進貨): ${operatingProfit}</div>
                                    </div>
                                </div>
                            )
                        })}
                    </div>
                );
            };

            const filteredSales = marketSales.filter(m => m.date === selectedDay);
            const viewParts = safeStr(viewMonthStr).split('-');

            return (
                <div className="animate-fade-in pb-20">
                    <Card className={editingId ? 'border-2 border-[#bc9f8b]' : ''}>
                        <div className="flex items-center mb-4 text-[#7a6453] font-bold text-lg">
                            <Icon name={editingId ? 'edit' : 'storefront'} className="mr-2 text-[#bc9f8b]" /> 
                            {editingId ? '編輯市場營業' : '新增市場營業'}
                        </div>
                        <Input type="date" value={date} onChange={e => { setDate(e.target.value); setSelectedDay(e.target.value); setViewMonthStr(safeStr(e.target.value).substring(0,7)); }} />
                        <div className="grid grid-cols-2 gap-3">
                            <Input placeholder="地點" value={location} onChange={e => setLocation(e.target.value)} />
                            <div className="mb-3 w-full">
                                <div className="flex items-center bg-[#fdfdfd] border border-[#f0e6e0] rounded-xl px-3 h-[48px] focus-within:border-[#bc9f8b] transition-colors">
                                    <input type="number" placeholder="當日業績" value={revenue} onChange={handleRevenueChange} className="bg-transparent w-full h-full outline-none text-[#5c4d43] placeholder-[#c4b5aa] text-[15px] font-wawa" />
                                </div>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <div className="mb-3 w-full">
                                <div className="flex items-center bg-[#fdfdfd] border border-[#f0e6e0] rounded-xl px-3 h-[48px] focus-within:border-[#bc9f8b] transition-colors">
                                    <input type="number" placeholder="售出件數 (自動推算)" value={soldQty} onChange={e => setSoldQty(e.target.value)} className="bg-transparent w-full h-full outline-none text-[#5c4d43] placeholder-[#c4b5aa] text-[15px] font-wawa" />
                                </div>
                            </div>
                            <Input placeholder="備註 (選填)" value={note} onChange={e => setNote(e.target.value)} />
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <Input type="number" placeholder="位租" value={rent} onChange={e => setRent(e.target.value)} />
                            <Input type="number" placeholder="電費 (選填)" value={electricity} onChange={e => setElectricity(e.target.value)} />
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <Input type="number" placeholder="清潔費 (選填)" value={cleaning} onChange={e => setCleaning(e.target.value)} />
                            <Input type="number" placeholder="過路費 (選填)" value={toll} onChange={e => setToll(e.target.value)} />
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <Input type="number" placeholder="停車費 (選填)" value={parking} onChange={e => setParking(e.target.value)} />
                            <div className="flex items-center justify-center text-[11px] text-[#a89689] bg-[#fdfaf7] rounded-xl border border-[#f2e7df] border-dashed">
                                ※交通油資請至「支出」紀錄
                            </div>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-3 mb-4 mt-1">
                            <button 
                                className={`w-full h-[48px] rounded-xl border text-[15px] transition-colors font-wawa font-bold flex items-center justify-center ${hasGift ? 'border-[#bc9f8b] bg-[#fdfaf7] text-[#bc9f8b]' : 'border-[#f0e6e0] bg-[#fdfdfd] text-[#a89689]'}`} 
                                onClick={(e) => { e.preventDefault(); setHasGift(!hasGift); }}>
                                🎁 {hasGift ? '有贈品' : '無贈品'}
                            </button>
                            <div className={`flex items-center bg-[#fdfdfd] border border-[#f0e6e0] rounded-xl px-3 h-[48px] focus-within:border-[#bc9f8b] transition-colors ${!hasGift ? 'opacity-60 bg-[#f9f9f9]' : ''}`}>
                                <input type="number" placeholder="贈品數量" value={giftCount} onChange={e => setGiftCount(e.target.value)} disabled={!hasGift} className="bg-transparent w-full h-full outline-none text-[#5c4d43] placeholder-[#c4b5aa] text-[15px] font-wawa" />
                            </div>
                        </div>

                        <div className="border-t border-[#f2e7df] pt-4 mb-4">
                            <div className="flex items-center text-sm font-bold text-[#5c4d43] mb-3"><Icon name="diamond" className="mr-1 text-[#64b5f6] text-[18px]" /> 配飾販售數量 (不計入業績)</div>
                            <div className="grid grid-cols-4 gap-2 text-center text-xs text-[#a89689]">
                                {['項鍊', '帽子', '包包', '其他'].map((label, idx) => {
                                    const keys = ['necklace', 'hat', 'bag', 'other'];
                                    return (
                                        <div key={label}>
                                            <label className="block mb-1">{label}</label>
                                            <input type="number" value={acc[keys[idx]]} onChange={e=>setAcc({...acc, [keys[idx]]: e.target.value})} className="w-full h-[40px] bg-[#fdfdfd] border border-[#f0e6e0] rounded-lg px-2 text-center outline-none focus:border-[#bc9f8b] font-wawa" />
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                        
                        <div className="flex gap-3">
                            {editingId && (
                                <Button onClick={resetForm} className="flex-1 bg-[#f2e7df] !text-[#7a6453]">取消</Button>
                            )}
                            <Button onClick={handleAddMarket} className={editingId ? 'flex-[2] bg-[#bc9f8b] text-white' : 'w-full bg-[#bc9f8b] text-white'}>
                                {editingId ? '儲存修改' : '儲存紀錄'}
                            </Button>
                        </div>
                    </Card>

                    {/* 地點績效搜尋器 */}
                    <div className="mb-4 px-1">
                        <div className={`flex items-center bg-white border ${searchTerm ? 'border-[#bc9f8b] shadow-sm' : 'border-[#e0d6ce]'} rounded-xl px-3 h-[48px] transition-colors`}>
                            <Icon name="search" className={`mr-2 text-[20px] ${searchTerm ? 'text-[#bc9f8b]' : 'text-[#c4b5aa]'}`} />
                            <input type="text" placeholder="🔍 搜尋地點 (例如: 果菜) 評估歷史績效" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="bg-transparent w-full h-full outline-none text-[#5c4d43] placeholder-[#c4b5aa] text-[15px] font-wawa" />
                            {searchTerm && <button onClick={() => setSearchTerm('')}><Icon name="close" className="text-[#c4b5aa] text-[18px]" /></button>}
                        </div>
                    </div>

                    {!searchTerm ? (
                        <React.Fragment>
                            <Card className="px-2 pt-2 pb-4">
                                <div className="flex justify-between items-center px-2 mb-4 mt-2">
                                    <button onClick={() => changeMonth(-1)} className="p-1.5 text-[#a89689] bg-[#fdfaf7] rounded-full hover:bg-[#f2e7df]"><Icon name="chevron_left" /></button>
                                    <div className="font-bold text-[#7a6453] text-lg tracking-wider">{viewParts[0]||''}年 {parseInt(viewParts[1]||1, 10)}月</div>
                                    <button onClick={() => changeMonth(1)} className="p-1.5 text-[#a89689] bg-[#fdfaf7] rounded-full hover:bg-[#f2e7df]"><Icon name="chevron_right" /></button>
                                </div>
                                <div className="grid grid-cols-7 text-center text-xs font-bold text-[#a89689] mb-3">
                                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                                </div>
                                <div className="grid grid-cols-7 gap-y-2 gap-x-1">{renderCalendarDays()}</div>
                            </Card>

                            <div className="mt-6 mb-2 flex items-center text-[#9b4949] font-bold px-2 text-lg">
                                <Icon name="location_on" className="mr-1 text-[20px]" /> {parseInt(safeStr(selectedDay).split('-')[1]||0, 10)}/{parseInt(safeStr(selectedDay).split('-')[2]||0, 10)} 營業紀錄 
                                <span className="ml-2 bg-[#f2e7df] text-[#7a6453] text-xs px-2.5 py-1 rounded-full font-bold">{filteredSales.length} 筆</span>
                            </div>
                            {filteredSales.length === 0 ? (
                                <div className="bg-white rounded-2xl border border-dashed border-[#e0d6ce] text-center text-[#c4b5aa] text-sm py-8 mx-2 mt-4">這天沒有擺攤，是休息日喔 ☕</div>
                            ) : filteredSales.map(m => {
                                const dailyMisc = (Number(m.electricity) || 0) + (Number(m.cleaning) || 0) + (Number(m.toll) || 0) + (Number(m.parking) || 0);
                                const operatingProfit = (Number(m.revenue)||0) - (Number(m.rent)||0) - dailyMisc; 
                                return (
                                    <div key={m.id} className="bg-white rounded-xl p-4 mb-3 shadow-sm border border-[#f2e7df] relative mx-1">
                                        <div className="absolute top-4 right-4 flex gap-1">
                                            <button onClick={() => handleEditClick(m)} className="p-1.5 bg-[#fdfaf7] text-[#bc9f8b] rounded-lg shadow-sm"><Icon name="edit" className="text-[18px]" /></button>
                                            <button onClick={() => setConfirmDialog({isOpen: true, id: m.id, collection: 'market_sales'})} className="p-1.5 bg-[#fdf2f2] text-[#e57373] rounded-lg shadow-sm"><Icon name="delete" className="text-[18px]" /></button>
                                        </div>
                                        <div className="font-bold text-[#5c4d43] mb-1 text-base flex items-center"><span className="bg-[#bc9f8b] w-2 h-2 rounded-full mr-2"></span>{m.location}</div>
                                        {m.note && <div className="text-xs text-[#a89689] mb-2 pl-4">備註: {m.note}</div>}
                                        <div className="text-sm text-[#7a6453] grid grid-cols-2 gap-y-1.5 mt-3 pt-3 border-t border-[#fdfaf7] pl-4">
                                            <div>營業額: <span className="font-bold text-[#5c4d43]">${m.revenue}</span> <span className="ml-1 bg-orange-50 text-[#bc9f8b] text-[10px] px-1 rounded">{m.soldQty||0}件</span></div>
                                            <div>攤租雜支: <span className="font-medium">-${(Number(m.rent)||0) + dailyMisc}</span></div>
                                            <div className="font-bold text-[#bc9f8b] col-span-2">單日淨收入 (未扣進貨): ${operatingProfit}</div>
                                        </div>
                                    </div>
                                )
                            })}
                        </React.Fragment>
                    ) : (
                        renderSearchResults()
                    )}
                </div>
            );
        };

        // --- 分頁 3：支出紀錄 ---
        const ExpenseTab = ({ expenses, setExpenses, setConfirmDialog }) => {
            const [editingId, setEditingId] = useState(null);
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [type, setType] = useState('wholesale'); 
            const [name, setName] = useState('');
            const [amount, setAmount] = useState('');
            const [qty, setQty] = useState(''); 
            const [isArrived, setIsArrived] = useState(true);

            const resetForm = () => {
                setEditingId(null); setDate(new Date().toISOString().split('T')[0]);
                setType('wholesale'); setName(''); setAmount(''); setQty(''); setIsArrived(true);
            };

            const handleAddExpense = () => {
                if (!name || !amount) return;
                const recordData = { 
                    date, type, name, 
                    amount: Number(amount),
                    qty: type === 'wholesale' ? (Number(qty) || 0) : 0,
                    isArrived: type === 'wholesale' ? isArrived : true 
                };

                if (editingId) {
                    setExpenses(prev => prev.map(e => e.id === editingId ? { ...e, ...recordData } : e).sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                } else {
                    const newRecord = { id: Date.now().toString(), ...recordData };
                    setExpenses(prev => [newRecord, ...prev].sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                }
                resetForm();
            };

            const handleEditClick = (record) => {
                setEditingId(record.id);
                setDate(record.date); setType(record.type); setName(record.name); setAmount(record.amount); setQty(record.qty || '');
                setIsArrived(record.isArrived !== false); 
                scrollToTop();
            };

            const toggleArriveStatus = (id) => {
                setExpenses(prev => prev.map(e => e.id === id ? { ...e, isArrived: true } : e));
            };

            const wholesaleTotal = expenses.filter(e => e.type === 'wholesale').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const inTransitTotal = expenses.filter(e => e.type === 'wholesale' && e.isArrived === false).reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            
            const supplyTotal = expenses.filter(e => e.type === 'supply').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const fixedTotal = expenses.filter(e => e.type === 'fixed').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const trafficTotal = expenses.filter(e => e.type === 'traffic').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const salaryTotal = expenses.filter(e => e.type === 'salary').reduce((sum, e) => sum + (Number(e.amount)||0), 0);

            // 當月累積計算
            const currentMonth = safeStr(date).substring(0, 7);
            const currentMonthExpenses = expenses.filter(e => safeStr(e.date).startsWith(currentMonth));
            
            const wholesaleMonthTotal = currentMonthExpenses.filter(e => e.type === 'wholesale').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const supplyMonthTotal = currentMonthExpenses.filter(e => e.type === 'supply').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const fixedMonthTotal = currentMonthExpenses.filter(e => e.type === 'fixed').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const trafficMonthTotal = currentMonthExpenses.filter(e => e.type === 'traffic').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const salaryMonthTotal = currentMonthExpenses.filter(e => e.type === 'salary').reduce((sum, e) => sum + (Number(e.amount)||0), 0);

            const typeConfig = {
                wholesale: { label: '批貨進貨', color: 'bg-[#e57373]', text: 'text-[#e57373]', bgLight: 'bg-[#ffebee]', placeholder: '批貨品名 / 廠商' },
                supply: { label: '生財包材', color: 'bg-[#64b5f6]', text: 'text-[#64b5f6]', bgLight: 'bg-[#e0f7fa]', placeholder: '如: 品牌袋、衣架、文具' },
                fixed: { label: '倉租水電', color: 'bg-[#81c784]', text: 'text-[#81c784]', bgLight: 'bg-[#e8f5e9]', placeholder: '如: 倉庫租金、水電網費' },
                traffic: { label: '交通油資', color: 'bg-[#ba68c8]', text: 'text-[#ab47bc]', bgLight: 'bg-[#f3e5f5]', placeholder: '如: 加油、高鐵、客運' },
                salary: { label: '老闆支薪', color: 'bg-[#ffd54f]', text: 'text-[#fbc02d]', bgLight: 'bg-[#fffde7]', placeholder: '如: 8月老闆薪水' }
            };

            return (
                <div className="animate-fade-in pb-20">
                    <Card className={editingId && typeConfig[type] ? `border-2 border-${typeConfig[type].color.split('-')[1]}` : ''}>
                        <div className="flex items-center mb-4 text-[#7a6453] font-bold text-lg">
                            <Icon name={editingId ? 'edit' : 'account_balance_wallet'} className="mr-2 text-[#7a6453]" /> 
                            {editingId ? '編輯支出紀錄' : '公司營運支出'}
                        </div>
                        
                        <div className="grid grid-cols-2 gap-2 mb-4">
                            {Object.keys(typeConfig).map(tKey => {
                                const tConf = typeConfig[tKey];
                                return (
                                    <button 
                                        key={tKey}
                                        onClick={() => { setType(tKey); setQty(''); setIsArrived(true); }} 
                                        className={`py-2.5 rounded-xl text-[13px] font-bold transition-all border ${type === tKey ? `${tConf.color} text-white border-transparent shadow-md` : 'bg-white border-[#f0e6e0] text-[#a89689]'} ${tKey === 'salary' ? 'col-span-2' : ''}`}>
                                        {tConf.label}
                                    </button>
                                );
                            })}
                        </div>

                        <Input type="date" value={date} onChange={e => setDate(e.target.value)} />
                        <Input placeholder={typeConfig[type] ? typeConfig[type].placeholder : '名稱'} value={name} onChange={e => setName(e.target.value)} />
                        
                        {type === 'wholesale' ? (
                            <React.Fragment>
                                <div className="grid grid-cols-2 gap-3 mb-3">
                                    <Input type="number" placeholder="支出總金額" value={amount} onChange={e => setAmount(e.target.value)} />
                                    <Input type="number" placeholder="進貨總件數" value={qty} onChange={e => setQty(e.target.value)} />
                                </div>
                                <div className="flex items-center gap-3 mb-4">
                                    <button
                                        className={`flex-1 h-[48px] rounded-xl border text-[14px] transition-colors font-wawa font-bold flex items-center justify-center shadow-sm ${isArrived ? 'border-[#4caf50] bg-[#f0f9f0] text-[#4caf50]' : 'border-[#ffb300] bg-[#fffde7] text-[#f57f17]'}`}
                                        onClick={(e) => { e.preventDefault(); setIsArrived(!isArrived); }}
                                    >
                                        {isArrived ? '📦 已到貨 (算入庫存)' : '🚚 貨在途 (暫不入庫)'}
                                    </button>
                                </div>
                            </React.Fragment>
                        ) : (
                            <Input type="number" placeholder="支出總金額" value={amount} onChange={e => setAmount(e.target.value)} />
                        )}

                        {type === 'wholesale' && amount && qty && (
                            <div className="text-right text-xs text-[#e57373] font-bold mb-3 px-1">
                                單筆平均進價：${(Number(amount) / Number(qty)).toFixed(1)} /件
                            </div>
                        )}
                        
                        <div className="flex gap-3">
                            {editingId && (
                                <Button onClick={resetForm} className="flex-1 bg-[#f2e7df] !text-[#7a6453]">取消</Button>
                            )}
                            <Button onClick={handleAddExpense} className={`${typeConfig[type] ? typeConfig[type].color : 'bg-gray-400'} hover:opacity-90 text-white ${editingId ? 'flex-[2]' : 'w-full'}`}>
                                {editingId ? '儲存修改' : '儲存支出'}
                            </Button>
                        </div>
                    </Card>

                    <div className="grid grid-cols-2 gap-3 mb-6">
                        <div className="bg-white rounded-xl p-3 shadow-sm border border-[#f2e7df] text-center flex flex-col justify-between">
                            <div>
                                <div className="text-[11px] text-[#a89689] font-bold mb-1">歷史總批貨支出</div>
                                <div className="text-lg font-black text-[#e57373]">${wholesaleTotal.toLocaleString()}</div>
                                {inTransitTotal > 0 && <div className="text-[9px] text-[#f57f17] font-bold mt-0.5">含在途未入庫 ${inTransitTotal.toLocaleString()}</div>}
                            </div>
                            <div className="text-[10px] text-[#7a6453] font-bold mt-1.5 pt-1.5 border-t border-[#fdfaf7] bg-[#fdfaf7] rounded -mx-1 -mb-1 pb-1">
                                本月 ({parseInt(currentMonth.substring(5,7))}月): <span className="text-[#e57373]">${wholesaleMonthTotal.toLocaleString()}</span>
                            </div>
                        </div>
                        <div className="bg-white rounded-xl p-3 shadow-sm border border-[#f2e7df] text-center flex flex-col justify-between">
                            <div>
                                <div className="text-[11px] text-[#a89689] font-bold mb-1">歷史總生財/包材</div>
                                <div className="text-lg font-black text-[#64b5f6]">${supplyTotal.toLocaleString()}</div>
                            </div>
                            <div className="text-[10px] text-[#7a6453] font-bold mt-1.5 pt-1.5 border-t border-[#fdfaf7] bg-[#fdfaf7] rounded -mx-1 -mb-1 pb-1">
                                本月 ({parseInt(currentMonth.substring(5,7))}月): <span className="text-[#64b5f6]">${supplyMonthTotal.toLocaleString()}</span>
                            </div>
                        </div>
                        <div className="bg-white rounded-xl p-3 shadow-sm border border-[#f2e7df] text-center flex flex-col justify-between">
                            <div>
                                <div className="text-[11px] text-[#a89689] font-bold mb-1">歷史總倉租/水電</div>
                                <div className="text-lg font-black text-[#81c784]">${fixedTotal.toLocaleString()}</div>
                            </div>
                            <div className="text-[10px] text-[#7a6453] font-bold mt-1.5 pt-1.5 border-t border-[#fdfaf7] bg-[#fdfaf7] rounded -mx-1 -mb-1 pb-1">
                                本月 ({parseInt(currentMonth.substring(5,7))}月): <span className="text-[#81c784]">${fixedMonthTotal.toLocaleString()}</span>
                            </div>
                        </div>
                        <div className="bg-white rounded-xl p-3 shadow-sm border border-[#f2e7df] text-center flex flex-col justify-between">
                            <div>
                                <div className="text-[11px] text-[#a89689] font-bold mb-1">歷史總交通/油資</div>
                                <div className="text-lg font-black text-[#ab47bc]">${trafficTotal.toLocaleString()}</div>
                            </div>
                            <div className="text-[10px] text-[#7a6453] font-bold mt-1.5 pt-1.5 border-t border-[#fdfaf7] bg-[#fdfaf7] rounded -mx-1 -mb-1 pb-1">
                                本月 ({parseInt(currentMonth.substring(5,7))}月): <span className="text-[#ab47bc]">${trafficMonthTotal.toLocaleString()}</span>
                            </div>
                        </div>
                        <div className="bg-white rounded-xl p-3 shadow-sm border border-[#f2e7df] text-center col-span-2 flex flex-col justify-between">
                            <div>
                                <div className="text-[11px] text-[#a89689] font-bold mb-1">歷史總老闆支薪</div>
                                <div className="text-lg font-black text-[#fbc02d]">${salaryTotal.toLocaleString()}</div>
                            </div>
                            <div className="text-[10px] text-[#7a6453] font-bold mt-1.5 pt-1.5 border-t border-[#fdfaf7] bg-[#fdfaf7] rounded -mx-1 -mb-1 pb-1">
                                本月 ({parseInt(currentMonth.substring(5,7))}月): <span className="text-[#fbc02d]">${salaryMonthTotal.toLocaleString()}</span>
                            </div>
                        </div>
                    </div>

                    <div className="mb-2 flex items-center text-[#7a6453] font-bold px-2 text-lg">
                        <Icon name="history" className="mr-1 text-[20px]" /> 近期支出明細
                    </div>
                    {expenses.length === 0 ? <div className="text-center text-[#c4b5aa] text-sm py-8 bg-white rounded-2xl border border-dashed border-[#e0d6ce] mt-4 mx-2">目前尚無支出紀錄</div> : (
                        <div className="mt-4 space-y-3 mx-1">
                        {expenses.map(e => {
                            const conf = typeConfig[e.type] || typeConfig['wholesale'];
                            return (
                                <div key={e.id} className="bg-white rounded-xl p-4 shadow-sm border border-[#f2e7df] flex justify-between items-center">
                                    <div className="flex flex-col flex-1">
                                        <div className="flex items-center gap-2 mb-1">
                                            <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${conf.bgLight} ${conf.text} shrink-0`}>
                                                {conf.label.split('/')[0]}
                                            </span>
                                            <span className="font-bold text-[#5c4d43] text-base truncate max-w-[120px]">{e.name}</span>
                                            {e.type === 'wholesale' && e.isArrived === false && (
                                                <button onClick={() => toggleArriveStatus(e.id)} className="shrink-0 text-[10px] bg-[#fffde7] text-[#f57f17] border border-[#ffe082] px-2 py-0.5 rounded shadow-sm hover:bg-[#fff9c4] transition-colors">
                                                    點擊入庫
                                                </button>
                                            )}
                                            {e.type === 'wholesale' && e.isArrived !== false && (
                                                <span className="shrink-0 text-[10px] bg-[#f0f9f0] text-[#4caf50] px-1.5 py-0.5 rounded">已入庫</span>
                                            )}
                                        </div>
                                        <div className="text-xs text-[#a89689]">
                                            {e.date} {e.type === 'wholesale' && e.qty > 0 && <span className="ml-1 text-[#e57373]">({e.qty}件)</span>}
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-1.5 shrink-0 pl-2">
                                        <div className={`font-black text-lg mr-1 ${conf.text}`}>-${e.amount}</div>
                                        <button onClick={() => handleEditClick(e)} className="p-1.5 bg-[#fdfaf7] text-[#bc9f8b] rounded-lg shadow-sm"><Icon name="edit" className="text-[18px]" /></button>
                                        <button onClick={() => setConfirmDialog({isOpen: true, id: e.id, collection: 'expenses'})} className="p-1.5 bg-[#fdf2f2] text-[#e57373] rounded-lg shadow-sm"><Icon name="delete" className="text-[18px]" /></button>
                                    </div>
                                </div>
                            );
                        })}
                        </div>
                    )}
                </div>
            );
        }

        // --- 分頁 4：報表 ---
        const ReportTab = ({ deliveries, marketSales, expenses, settings, setSettings, marketSoldStats, setMarketSoldStats }) => {
            const [reportMonth, setReportMonth] = useState(() => {
                const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            });
            const [isCheckingInventory, setIsCheckingInventory] = useState(false);
            const [actualInv, setActualInv] = useState('');

            const [expAllRev, setExpAllRev] = useState(false);
            const [expAllWhole, setExpAllWhole] = useState(false);
            const [expAllOther, setExpAllOther] = useState(false);
            const [expAllMarket, setExpAllMarket] = useState(false);
            const [expMoRev, setExpMoRev] = useState(false);
            const [expMoMarket, setExpMoMarket] = useState(false);
            const [expMoOther, setExpMoOther] = useState(false);

            const changeMonth = (offset) => {
                const parts = safeStr(reportMonth).split('-');
                if(parts.length >= 2) {
                    const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1 + offset, 1);
                    setReportMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
                }
                setIsCheckingInventory(false);
                setActualInv('');
                setExpMoRev(false); setExpMoMarket(false); setExpMoOther(false);
            };

            const currentStartupCap = settings && settings.startupCapital !== undefined ? settings.startupCapital : 36284;

            const handleCapitalChange = () => {
                const newCapital = window.prompt("請輸入您的「初期創業本金」(系統會自動幫您推算口袋現金！)：", currentStartupCap);
                if (newCapital && !isNaN(newCapital)) setSettings({ ...(settings || {}), startupCapital: Number(newCapital) });
            };

            // ---- 1. 全期存摺加減法 ----
            const allTimeMarketRev = marketSales.reduce((sum, m) => sum + (Number(m.revenue)||0), 0);
            const allTimeStoreRev = deliveries.reduce((sum, d) => sum + (Number(d.revenue)||0), 0);
            const allTimeStoreShipIn = deliveries.reduce((sum, d) => sum + (Number(d.shippingIncome)||0), 0);
            const allTimeRev = allTimeMarketRev + allTimeStoreRev + allTimeStoreShipIn;
            
            const allTimeMarketRent = marketSales.reduce((sum, m) => sum + (Number(m.rent)||0), 0);
            const allTimeMarketMisc = marketSales.reduce((sum, m) => sum + (Number(m.electricity)||0) + (Number(m.cleaning)||0) + (Number(m.toll)||0) + (Number(m.parking)||0), 0);
            const allTimeStoreShipOut = deliveries.reduce((sum, d) => sum + (Number(d.shippingExpense)||0), 0);
            const allTimeMarketExp = allTimeMarketRent + allTimeMarketMisc + allTimeStoreShipOut;
            
            const allTimeWholeArrived = expenses.filter(e => e.type === 'wholesale' && e.isArrived !== false).reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const allTimeWholeTransit = expenses.filter(e => e.type === 'wholesale' && e.isArrived === false).reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const allTimeWholesale = allTimeWholeArrived + allTimeWholeTransit;

            const allTimeSupply = expenses.filter(e => e.type === 'supply').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const allTimeFixed = expenses.filter(e => e.type === 'fixed').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const allTimeTraffic = expenses.filter(e => e.type === 'traffic').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const allTimeSalary = expenses.filter(e => e.type === 'salary').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const allTimeOtherExp = allTimeSupply + allTimeFixed + allTimeTraffic + allTimeSalary;

            const pocketCash = currentStartupCap + allTimeRev - allTimeMarketExp - allTimeWholesale - allTimeOtherExp;

            // ---- 2. 計算本月瀑布流損益 ----
            const currentDeliveries = deliveries.filter(d => safeStr(d.date).startsWith(reportMonth) && d.status === 'shipped');
            const currentMarket = marketSales.filter(m => safeStr(m.date).startsWith(reportMonth));
            const currentExpenses = expenses.filter(e => safeStr(e.date).startsWith(reportMonth));

            const storeRevenue = currentDeliveries.reduce((sum, d) => sum + (Number(d.revenue) || 0), 0);
            const marketRevenue = currentMarket.reduce((sum, m) => sum + (Number(m.revenue) || 0), 0);
            const monthlyTotalRev = storeRevenue + marketRevenue;

            const marketRent = currentMarket.reduce((sum, m) => sum + (Number(m.rent)||0), 0);
            const marketElec = currentMarket.reduce((sum, m) => sum + (Number(m.electricity)||0), 0);
            const marketClean = currentMarket.reduce((sum, m) => sum + (Number(m.cleaning)||0), 0);
            const marketToll = currentMarket.reduce((sum, m) => sum + (Number(m.toll)||0), 0);
            const marketParking = currentMarket.reduce((sum, m) => sum + (Number(m.parking)||0), 0);
            const marketMiscOnly = marketElec + marketClean + marketToll + marketParking;
            const marketMiscAndRent = marketRent + marketMiscOnly; 

            const storeShippingNetExp = currentDeliveries.reduce((sum, d) => sum + (Number(d.shippingExpense)||0) - (Number(d.shippingIncome)||0), 0);
            const monthlyMarketExp = marketMiscAndRent + (storeShippingNetExp > 0 ? storeShippingNetExp : 0);
            const monthlyShippingProfit = storeShippingNetExp < 0 ? Math.abs(storeShippingNetExp) : 0; 
            
            const frontlineNetIncome = monthlyTotalRev - monthlyMarketExp + monthlyShippingProfit;

            // ---- 3. 庫存與進貨成本 ----
            const wholesaleToMonth = expenses.filter(e => e.type === 'wholesale' && safeStr(e.date).substring(0, 7) <= reportMonth && e.isArrived !== false);
            const accumulatedWholesaleCost = wholesaleToMonth.reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const accumulatedWholesaleQty = wholesaleToMonth.reduce((sum, e) => sum + (Number(e.qty)||0), 0);
            const avgUnitCost = accumulatedWholesaleQty > 0 ? (accumulatedWholesaleCost / accumulatedWholesaleQty) : 0;

            const storeSoldToMonth = deliveries.filter(d => d.status === 'shipped' && safeStr(d.date).substring(0, 7) <= reportMonth);
            const accumulatedStoreSoldQty = storeSoldToMonth.reduce((sum, d) => sum + (Number(d.soldQty) || 1), 0);
            
            const marketSoldToMonth = marketSales.filter(m => safeStr(m.date).substring(0, 7) <= reportMonth);
            const accumulatedMarketDailySoldQty = marketSoldToMonth.reduce((sum, m) => sum + (Number(m.soldQty) || 0), 0);

            let pastAdjustments = 0;
            Object.keys(marketSoldStats || {}).forEach(key => {
                if (key < reportMonth) pastAdjustments += (Number(marketSoldStats[key])||0);
            });
            const currentMonthAdj = Number((marketSoldStats || {})[reportMonth]) || 0;

            const accumulatedTotalSold = accumulatedStoreSoldQty + accumulatedMarketDailySoldQty + pastAdjustments + currentMonthAdj;
            const currentInventoryQty = accumulatedWholesaleQty - accumulatedTotalSold;
            const theoreticalInventory = accumulatedWholesaleQty - accumulatedStoreSoldQty - accumulatedMarketDailySoldQty - pastAdjustments;

            const saveInventoryCheck = () => {
                const actual = Number(actualInv) || 0;
                const diff = theoreticalInventory - actual; 
                setMarketSoldStats({ ...(marketSoldStats || {}), [reportMonth]: diff });
                setIsCheckingInventory(false);
                setActualInv('');
            };

            const currentMonthStoreSold = currentDeliveries.reduce((sum, d) => sum + (Number(d.soldQty) || 1), 0);
            const currentMonthMarketDailySold = currentMarket.reduce((sum, m) => sum + (Number(m.soldQty) || 0), 0);
            const currentMonthTotalSoldQty = currentMonthStoreSold + currentMonthMarketDailySold + currentMonthAdj;
            
            const monthlyCOGS = Math.round(currentMonthTotalSoldQty * avgUnitCost);
            const grossProfit = frontlineNetIncome - monthlyCOGS;

            const monthlySupplyExp = currentExpenses.filter(e => e.type === 'supply').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const monthlyFixedExp = currentExpenses.filter(e => e.type === 'fixed').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const monthlyTrafficExp = currentExpenses.filter(e => e.type === 'traffic').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const monthlySalary = currentExpenses.filter(e => e.type === 'salary').reduce((sum, e) => sum + (Number(e.amount)||0), 0);
            const monthlyOtherTotal = monthlySupplyExp + monthlyFixedExp + monthlyTrafficExp;
            
            const monthlyNetProfit = grossProfit - monthlyOtherTotal - monthlySalary;

            const viewParts = safeStr(reportMonth).split('-');
            const storeGifts = currentDeliveries.reduce((sum, d) => sum + (Number(d.giftCount) || 0), 0);
            const marketGifts = currentMarket.reduce((sum, m) => sum + (Number(m.giftCount) || 0), 0);

            return (
                <div className="animate-fade-in pb-20">
                    <div className="flex justify-between items-center bg-white rounded-2xl p-3 shadow-sm border border-[#f2e7df] mb-4">
                        <button onClick={() => changeMonth(-1)} className="p-2 text-[#a89689]"><Icon name="chevron_left" /></button>
                        <div className="font-bold text-[#7a6453] text-lg">{viewParts[0]||''}年 {parseInt(viewParts[1]||1, 10)}月</div>
                        <button onClick={() => changeMonth(1)} className="p-2 text-[#a89689]"><Icon name="chevron_right" /></button>
                    </div>

                    {/* 🎯 極簡口袋現金存摺 */}
                    <Card className="bg-[#fffde7] border-[#fff59d] mb-4 shadow-md">
                        <div className="flex justify-between items-start mb-2">
                            <div className="flex items-center text-[#f57f17] font-bold text-lg">
                                <Icon name="account_balance_wallet" className="mr-2" /> 我的口袋現金
                            </div>
                            <button onClick={handleCapitalChange} className="text-[10px] bg-white border border-[#ffe082] text-[#f57f17] px-2 py-1 rounded-lg shadow-sm flex items-center">
                                <Icon name="edit" className="text-[12px] mr-1"/> 設本金
                            </button>
                        </div>
                        
                        <div className="text-center py-2 mb-3">
                            <div className="text-xs text-[#a89689] font-bold mb-1">目前手邊實際剩餘現金</div>
                            <div className={`text-5xl font-black tracking-tight ${pocketCash < 0 ? 'text-red-500' : 'text-[#4caf50]'}`}>
                                ${pocketCash.toLocaleString()}
                            </div>
                        </div>

                        {/* 直白存摺明細 */}
                        <div className="bg-white bg-opacity-60 rounded-xl p-3 text-sm text-[#7a6453] font-bold border border-[#fff59d]">
                            <div className="flex justify-between items-center text-[11px] text-[#c4b5aa] mb-2"><span>=== 資金流向明細 ===</span><span>(歷史總累計)</span></div>
                            
                            <div className="flex justify-between items-center mb-1.5">
                                <span className="flex items-center text-[#4caf50]"><Icon name="add" className="text-[16px] mr-1"/> 創業初始本金</span>
                                <span>$ {currentStartupCap.toLocaleString()}</span>
                            </div>
                            
                            {/* 賣衣總收折疊 */}
                            <div className="flex justify-between items-center cursor-pointer mb-1.5" onClick={() => setExpAllRev(!expAllRev)}>
                                <span className="flex items-center text-[#4caf50]">
                                    <Icon name="add" className="text-[16px] mr-1"/> 賣衣總收現金
                                    <Icon name={expAllRev ? "expand_less" : "expand_more"} className="text-[14px] ml-0.5 opacity-60"/>
                                </span>
                                <span>$ {allTimeRev.toLocaleString()}</span>
                            </div>
                            {expAllRev && (
                                <div className="pl-6 pr-2 py-1 mb-2 space-y-1 bg-[#fafafa] rounded text-[11px] text-[#a89689] animate-expand">
                                    {allTimeMarketRev > 0 && <div className="flex justify-between"><span>└ 市場累積業績</span><span>${allTimeMarketRev.toLocaleString()}</span></div>}
                                    {allTimeStoreRev > 0 && <div className="flex justify-between"><span>└ 超商累積業績</span><span>${allTimeStoreRev.toLocaleString()}</span></div>}
                                    {allTimeStoreShipIn > 0 && <div className="flex justify-between"><span>└ 超商運費代收</span><span>${allTimeStoreShipIn.toLocaleString()}</span></div>}
                                </div>
                            )}

                            {/* 買衣服進貨折疊 */}
                            <div className="flex justify-between items-center text-[#e57373] cursor-pointer mb-1.5" onClick={() => setExpAllWhole(!expAllWhole)}>
                                <span className="flex items-center"><Icon name="remove" className="text-[16px] mr-1"/> 買衣服進貨費<Icon name={expAllWhole ? "expand_less" : "expand_more"} className="text-[14px] ml-0.5 opacity-60"/></span>
                                <span>-$ {allTimeWholesale.toLocaleString()}</span>
                            </div>
                            {expAllWhole && (
                                <div className="pl-6 pr-2 py-1 mb-2 space-y-1 bg-[#fafafa] rounded text-[11px] text-[#a89689] animate-expand">
                                    {allTimeWholeArrived > 0 && <div className="flex justify-between"><span>└ 已到貨付款</span><span>-${allTimeWholeArrived.toLocaleString()}</span></div>}
                                    {allTimeWholeTransit > 0 && <div className="flex justify-between"><span>└ 在途預付款</span><span>-${allTimeWholeTransit.toLocaleString()}</span></div>}
                                </div>
                            )}

                            {/* 包材水電折疊 */}
                            <div className="flex justify-between items-center text-[#e57373] cursor-pointer mb-1.5" onClick={() => setExpAllOther(!expAllOther)}>
                                <span className="flex items-center"><Icon name="remove" className="text-[16px] mr-1"/> 公司後勤開銷<Icon name={expAllOther ? "expand_less" : "expand_more"} className="text-[14px] ml-0.5 opacity-60"/></span>
                                <span>-$ {allTimeOtherExp.toLocaleString()}</span>
                            </div>
                            {expAllOther && (
                                <div className="pl-6 pr-2 py-1 mb-2 space-y-1 bg-[#fafafa] rounded text-[11px] text-[#a89689] animate-expand">
                                    {allTimeSupply > 0 && <div className="flex justify-between"><span>└ 生財包材雜支</span><span>-${allTimeSupply.toLocaleString()}</span></div>}
                                    {allTimeFixed > 0 && <div className="flex justify-between"><span>└ 倉租與水電</span><span>-${allTimeFixed.toLocaleString()}</span></div>}
                                    {allTimeTraffic > 0 && <div className="flex justify-between"><span>└ 交通與油資</span><span>-${allTimeTraffic.toLocaleString()}</span></div>}
                                    {allTimeSalary > 0 && <div className="flex justify-between"><span>└ 老闆支薪</span><span>-${allTimeSalary.toLocaleString()}</span></div>}
                                </div>
                            )}

                            {/* 擺攤租金折疊 */}
                            <div className="flex justify-between items-center text-[#e57373] cursor-pointer" onClick={() => setExpAllMarket(!expAllMarket)}>
                                <span className="flex items-center"><Icon name="remove" className="text-[16px] mr-1"/> 擺攤租金與運費<Icon name={expAllMarket ? "expand_less" : "expand_more"} className="text-[14px] ml-0.5 opacity-60"/></span>
                                <span>-$ {allTimeMarketExp.toLocaleString()}</span>
                            </div>
                            {expAllMarket && (

        // --- 分頁 5：留貨 (一鍵轉單) ---
        const ReserveTab = ({ reservations, setReservations, setDeliveries, setConfirmDialog }) => {
            const [editingId, setEditingId] = useState(null);

            const [tDate, setTDate] = useState('');

            const [tSoldQty, setTSoldQty] = useState('');

            const [tShippingIncome, setTShippingIncome] = useState('');

            const resetForm = () => {
                setEditingId(null); setDate(new Date().toISOString().split('T')[0]);
                setCustomerName(''); setItemsCount(''); setNote('');

            const handleAddReserve = () => {
                if (!customerName) return;
                const recordData = { date, customerName, itemsCount: Number(itemsCount) || 1, note };
                
                if (editingId) {
                    setReservations(prev => prev.map(r => r.id === editingId ? { ...r, ...recordData } : r).sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                } else {
                    const newRecord = { id: Date.now().toString(), ...recordData };
                    setReservations(prev => [newRecord, ...prev].sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                }
                resetForm();
            };

            const handleEditClick = (record) => {
                setEditingId(record.id);
                setDate(record.date); setCustomerName(record.customerName);
                setItemsCount(record.itemsCount); setNote(record.note || '');
