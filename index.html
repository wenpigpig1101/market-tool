<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>200%森衣好</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google 字體與 Material 圖示 -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet" />
    
    <!-- React & Babel -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>

    <style>
        body { background-color: #fdfaf7; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .font-wawa { font-family: 'HanziPen TC', 'Hannotate TC', 'DFWawaTC-W5', '華康娃娃體', 'M PLUS Rounded 1c', sans-serif !important; }
        input::placeholder { font-family: 'HanziPen TC', 'Hannotate TC', 'M PLUS Rounded 1c', sans-serif; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .animate-expand { animation: expandDown 0.2s ease-out forwards; transform-origin: top; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes expandDown { from { opacity: 0; transform: scaleY(0.9); } to { opacity: 1; transform: scaleY(1); } }
    </style>
</head>
<body class="font-wawa text-[#5c4d43]">
    <div id="root">
        <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #bc9f8b; font-weight: bold; font-size: 1.2rem;">
            <div style="width: 40px; height: 40px; border: 4px solid #f2e7df; border-top-color: #bc9f8b; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
            載入企業會計系統中...💰
            <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
        </div>
    </div>

    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            var errorHtml = '<div style="padding: 30px; text-align: center; color: #e57373;">' +
                            '<h3 style="font-size:24px; margin-bottom:10px;">🛡️ 系統保護機制</h3>' +
                            '<p style="font-size:14px; margin-bottom:10px;">系統偵測到畫面載入異常。</p>' +
                            '<p style="font-size:14px; margin-bottom:20px; color:#7a6453;">請您<strong>「重新整理網頁」</strong>即可恢復。</p>' +
                            '<pre style="font-size:10px; text-align:left; background:#fff; padding:10px; border-radius:8px; overflow-x:auto;">' + msg + '</pre>' +
                            '</div>';
            document.getElementById('root').innerHTML = errorHtml;
            return false;
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, Component } = React;
        
        const safeStr = (str) => String(str || '');
        const safeTime = (d) => {
            if (!d) return 0;
            const t = new Date(d).getTime();
            return isNaN(t) ? 0 : t;
        };
        const getSafeArr = (arr) => {
            if (!Array.isArray(arr)) return [];
            return arr.filter(i => i !== null && typeof i === 'object' && !Array.isArray(i));
        };

        // 鋼鐵防護版的 ErrorBoundary
        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorStr: '' };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, errorStr: error.toString() };
            }
            componentDidCatch(error, errorInfo) {
                console.error("渲染錯誤：", error, errorInfo);
            }
            safeRepairAndReload() {
                const safeParse = (key) => {
                    try {
                        const raw = localStorage.getItem(key);
                        if(raw) JSON.parse(raw);
                    } catch(e) {
                        localStorage.setItem(key, '[]');
                    }
                };
                safeParse('xq_deliveries');
                safeParse('xq_marketSales');
                safeParse('xq_expenses');
                safeParse('xq_reservations');
                safeParse('xq_preorders');
                safeParse('xq_tab1_preorders');
                
                try {
                    const stats = localStorage.getItem('xq_market_sold');
                    if(stats) {
                        const s = JSON.parse(stats);
                        if(Array.isArray(s) || typeof s !== 'object') localStorage.setItem('xq_market_sold', '{}');
                    }
                } catch(e) { localStorage.setItem('xq_market_sold', '{}'); }

                window.location.reload();
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="flex flex-col h-screen p-8 text-center text-[#e57373] bg-[#fdfaf7] justify-center">
                            <div className="text-5xl mb-4">🛡️</div>
                            <h2 className="text-xl font-bold mb-2">畫面載入異常</h2>
                            <p className="text-sm text-[#a89689] mb-4 leading-relaxed">您的資料安全無虞，請點擊下方按鈕安全重新整理。</p>
                            <textarea className="w-full h-16 p-2 text-[9px] bg-white border border-[#f2e7df] rounded-xl mb-6 opacity-60 custom-scrollbar" readOnly value={this.state.errorStr}></textarea>
                            <button onClick={() => this.safeRepairAndReload()} className="w-full py-4 bg-[#bc9f8b] text-white font-bold rounded-xl shadow-md">
                                安全重新整理
                            </button>
                        </div>
                    );
                }
                return this.props.children; 
            }
        }

        const useLocalStorage = (key, initialValue) => {
            const [value, setValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    if (item) {
                        const parsed = JSON.parse(item);
                        return parsed !== null ? parsed : initialValue;
                    }
                    return initialValue;
                } catch (error) { 
                    return initialValue; 
                }
            });
            useEffect(() => {
                try { window.localStorage.setItem(key, JSON.stringify(value)); } 
                catch (error) { console.warn("寫入失敗", error); }
            }, [key, value]);
            return [value, setValue];
        };

        const scrollToTop = () => {
            const main = document.getElementById('main-content');
            if(main) main.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const Icon = ({ name, className = "" }) => <span className={`material-symbols-outlined ${className}`}>{name}</span>;
        const Card = ({ children, className = "" }) => <div className={`bg-white rounded-2xl p-4 shadow-sm border border-[#f2e7df] mb-4 ${className}`}>{children}</div>;
        
        const Input = ({ label, value, onChange, type = "text", placeholder, disabled }) => (
            <div className="mb-3 w-full">
                <div className={`flex items-center bg-[#fdfdfd] border border-[#f0e6e0] rounded-xl px-3 h-[48px] focus-within:border-[#bc9f8b] transition-colors ${disabled ? 'opacity-60 bg-[#f9f9f9]' : ''}`}>
                    <input type={type} value={value} onChange={onChange} placeholder={placeholder || label} disabled={disabled}
                        className="bg-transparent w-full h-full outline-none text-[#5c4d43] placeholder-[#c4b5aa] text-[15px] font-wawa" />
                </div>
            </div>
        );

        const Button = ({ children, onClick, className = "" }) => (
            <button onClick={onClick} className={`w-full h-[48px] rounded-xl font-bold transition-colors text-[15px] text-center flex justify-center items-center font-wawa tracking-wide shadow-sm ${className}`}>
                {children}
            </button>
        );

        const ConfirmModal = ({ isOpen, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-[100] animate-fade-in px-4">
                    <div className="bg-white rounded-2xl p-6 w-full max-w-xs shadow-xl">
                        <div className="text-center text-[#5c4d43] font-bold mb-6 text-lg">{message}</div>
                        <div className="flex gap-3">
                            <button onClick={onCancel} className="flex-1 py-3 rounded-xl bg-[#f2e7df] text-[#7a6453] font-bold">取消</button>
                            <button onClick={onConfirm} className="flex-1 py-3 rounded-xl bg-[#e57373] text-white font-bold">確定刪除</button>
                        </div>
                    </div>
                </div>
            );
        };

        const formatRevenueStr = (num) => {
            const validNum = Number(num) || 0;
            if (validNum >= 10000) return Number.isInteger(validNum / 10000) ? `${validNum / 10000}萬` : `${(validNum / 10000).toFixed(1)}萬`;
            if (validNum >= 1000) return Number.isInteger(validNum / 1000) ? `${validNum / 1000}千` : `${(validNum / 1000).toFixed(1)}千`;
            return validNum.toString();
        };

        // --- 分頁 1：超商 & 留貨 & 預購建單 ---
        const StoreTab = ({ deliveries, setDeliveries, reservations, setReservations, tab1Preorders, setTab1Preorders, setConfirmDialog }) => {
            const [formMode, setFormMode] = useState('delivery'); 
            const [editingId, setEditingId] = useState(null);
            
            // 寄件表單 State
            const [dDate, setDDate] = useState(new Date().toISOString().split('T')[0]);
            const [dCustomerName, setDCustomerName] = useState('');
            const [dRevenue, setDRevenue] = useState('');
            const [dSoldQty, setDSoldQty] = useState(''); 
            const [dShippingExpense, setDShippingExpense] = useState('');
            const [dShippingIncome, setDShippingIncome] = useState('');
            const [dHasGift, setDHasGift] = useState(false);
            const [dGiftCount, setDGiftCount] = useState('');

            // 留貨表單 State
            const [rDate, setRDate] = useState(new Date().toISOString().split('T')[0]);
            const [rCustomerName, setRCustomerName] = useState('');
            const [rItemsCount, setRItemsCount] = useState('');
            const [rRevenue, setRRevenue] = useState(''); 
            const [rNote, setRNote] = useState('');

            // 預購單表單 State
            const [pDate, setPDate] = useState(new Date().toISOString().split('T')[0]);
            const [pCustomerName, setPCustomerName] = useState('');
            const [pItemsCount, setPItemsCount] = useState('');
            const [pRevenue, setPRevenue] = useState('');
            const [pNote, setPNote] = useState('');

            // 轉單 Modal State
            const [transferRecord, setTransferRecord] = useState(null);
            const [transferSource, setTransferSource] = useState(null); 
            const [tDate, setTDate] = useState('');
            const [tRevenue, setTRevenue] = useState('');
            const [tSoldQty, setTSoldQty] = useState(''); 
            const [tShippingExpense, setTShippingExpense] = useState('');
            const [tShippingIncome, setTShippingIncome] = useState('');
            const [tHasGift, setTHasGift] = useState(false);
            const [tGiftCount, setTGiftCount] = useState('');

            const [expandedMonths, setExpandedMonths] = useState({});

            const resetDeliveryForm = () => {
                setEditingId(null); setDDate(new Date().toISOString().split('T')[0]);
                setDCustomerName(''); setDRevenue(''); setDSoldQty(''); setDShippingExpense(''); setDShippingIncome(''); setDGiftCount(''); setDHasGift(false);
            };

            const resetReserveForm = () => {
                setEditingId(null); setRDate(new Date().toISOString().split('T')[0]);
                setRCustomerName(''); setRItemsCount(''); setRRevenue(''); setRNote('');
            };

            const resetPreorderForm = () => {
                setEditingId(null); setPDate(new Date().toISOString().split('T')[0]);
                setPCustomerName(''); setPItemsCount(''); setPRevenue(''); setPNote('');
            };

            const handleAddDelivery = () => {
                if (!dCustomerName) return;
                const recordData = {
                    date: dDate, customerName: dCustomerName, 
                    revenue: Number(dRevenue) || 0, soldQty: Number(dSoldQty) || 1, 
                    shippingExpense: Number(dShippingExpense) || 0, shippingIncome: Number(dShippingIncome) || 0,
                    hasGift: dHasGift, giftCount: dHasGift ? (Number(dGiftCount) || 0) : 0, status: 'pending'
                };

                if (editingId && formMode === 'delivery') {
                    setDeliveries(prev => prev.map(d => d.id === editingId ? { ...d, ...recordData } : d).sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                } else {
                    const newRecord = { id: Date.now().toString(), ...recordData };
                    setDeliveries(prev => [newRecord, ...prev].sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                }
                resetDeliveryForm();
            };

            const handleAddReserve = () => {
                if (!rCustomerName) return;
                const recordData = { 
                    date: rDate, 
                    customerName: rCustomerName, 
                    itemsCount: Number(rItemsCount) || 1, 
                    revenue: Number(rRevenue) || 0, 
                    note: rNote 
                };
                
                if (editingId && formMode === 'reserve') {
                    setReservations(prev => prev.map(r => r.id === editingId ? { ...r, ...recordData } : r).sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                } else {
                    const newRecord = { id: Date.now().toString(), ...recordData };
                    setReservations(prev => [newRecord, ...prev].sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                }
                resetReserveForm();
            };

            const handleAddPreorder = () => {
                if (!pCustomerName) return;
                const recordData = { 
                    date: pDate, 
                    customerName: pCustomerName, 
                    itemsCount: Number(pItemsCount) || 1, 
                    revenue: Number(pRevenue) || 0, 
                    note: pNote 
                };
                
                if (editingId && formMode === 'preorder') {
                    setTab1Preorders(prev => prev.map(p => p.id === editingId ? { ...p, ...recordData } : p).sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                } else {
                    const newRecord = { id: Date.now().toString(), ...recordData };
                    setTab1Preorders(prev => [newRecord, ...prev].sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                }
                resetPreorderForm();
            };

            const handleEditDelivery = (record) => {
                setFormMode('delivery'); setEditingId(record.id);
                setDDate(record.date); setDCustomerName(record.customerName); 
                setDRevenue(record.revenue || ''); setDSoldQty(record.soldQty || '');
                setDShippingExpense(record.shippingExpense || ''); setDShippingIncome(record.shippingIncome || '');
                setDHasGift(record.hasGift || false); setDGiftCount(record.giftCount || '');
                scrollToTop();
            };

            const handleEditReserve = (record) => {
                setFormMode('reserve'); setEditingId(record.id);
                setRDate(record.date); setRCustomerName(record.customerName);
                setRItemsCount(record.itemsCount); setRRevenue(record.revenue || ''); setRNote(record.note || '');
                scrollToTop();
            };

            const handleEditPreorder = (record) => {
                setFormMode('preorder'); setEditingId(record.id);
                setPDate(record.date); setPCustomerName(record.customerName);
                setPItemsCount(record.itemsCount); setPRevenue(record.revenue || ''); setPNote(record.note || '');
                scrollToTop();
            };

            const toggleDeliveryStatus = (id, currentStatus) => {
                const newStatus = currentStatus === 'pending' ? 'shipped' : 'pending';
                setDeliveries(prev => prev.map(d => d.id === id ? { ...d, status: newStatus } : d));
            };

            const openTransferModal = (record, source) => {
                setTransferRecord(record); 
                setTransferSource(source);
                setTDate(new Date().toISOString().split('T')[0]);
                setTRevenue(record.revenue || ''); 
                setTSoldQty(record.itemsCount || 1); 
                setTShippingExpense(''); setTShippingIncome(''); setTHasGift(false); setTGiftCount('');
            };

            const handleTransferSubmit = () => {
                if (!transferRecord) return;
                const newDelivery = {
                    id: Date.now().toString(), date: tDate, customerName: transferRecord.customerName,
                    revenue: Number(tRevenue) || 0, soldQty: Number(tSoldQty) || 1,
                    shippingExpense: Number(tShippingExpense) || 0, shippingIncome: Number(tShippingIncome) || 0,
                    hasGift: tHasGift, giftCount: tHasGift ? (Number(tGiftCount) || 0) : 0, status: 'pending' 
                };
                setDeliveries(prev => [newDelivery, ...prev].sort((a,b)=> safeTime(b.date) - safeTime(a.date)));
                
                if (transferSource === 'reserve') {
                    setReservations(prev => prev.filter(r => r.id !== transferRecord.id));
                } else if (transferSource === 'tab1_preorder') {
                    setTab1Preorders(prev => prev.filter(p => p.id !== transferRecord.id));
                }
                setTransferRecord(null);
                setTransferSource(null);
            };

            const pending = deliveries.filter(d => d.status === 'pending');
            const shipped = deliveries.filter(d => d.status === 'shipped');
            
            // 將已寄出的資料按月份分組
            const groupedShipped = useMemo(() => {
                const groups = {};
                shipped.forEach(d => {
                    const month = d.date ? d.date.substring(0, 7) : '未知日期';
                    if (!groups[month]) groups[month] = [];
                    groups[month].push(d);
                });
                return groups;
            }, [shipped]);
            const sortedMonths = Object.keys(groupedShipped).sort((a, b) => b.localeCompare(a));
            const toggleMonth = (month) => setExpandedMonths(prev => ({ ...prev, [month]: !prev[month] }));
            
            const pendingAmount = pending.reduce((sum, d) => sum + (Number(d.revenue) || 0), 0);
            const reserveAmount = reservations.reduce((sum, r) => sum + (Number(r.revenue) || 0), 0);
            const preorderAmount = tab1Preorders.reduce((sum, p) => sum + (Number(p.revenue) || 0), 0);

            return (
                <div className="animate-fade-in pb-20">
                    
                    {!editingId && (
                        <div className="flex gap-1 bg-[#fdfaf7] rounded-xl p-1.5 mb-4 border border-[#f2e7df] shadow-inner">
                            <button className={`flex-1 py-2 text-[13px] font-bold rounded-lg transition-all flex items-center justify-center ${formMode === 'delivery' ? 'bg-white shadow text-[#bc9f8b]' : 'text-[#c4b5aa]'}`} 
                                    onClick={() => { setFormMode('delivery'); resetDeliveryForm(); }}><Icon name="inventory_2" className="text-[18px] mr-1" />超商寄件</button>
                            <button className={`flex-1 py-2 text-[13px] font-bold rounded-lg transition-all flex items-center justify-center ${formMode === 'reserve' ? 'bg-[#e3f2fd] shadow-sm text-[#1976d2]' : 'text-[#c4b5aa]'}`} 
                                    onClick={() => { setFormMode('reserve'); resetReserveForm(); }}><Icon name="diamond" className="text-[18px] mr-1" />現貨保留</button>
                            <button className={`flex-1 py-2 text-[13px] font-bold rounded-lg transition-all flex items-center justify-center ${formMode === 'preorder' ? 'bg-[#e8eaf6] shadow-sm text-[#5c6bc0]' : 'text-[#c4b5aa]'}`} 
                                    onClick={() => { setFormMode('preorder'); resetPreorderForm(); }}><Icon name="shopping_cart" className="text-[18px] mr-1" />預購建單</button>
                        </div>
                    )}

                    {editingId && (
                        <div className={`flex items-center mb-4 font-bold text-lg ${formMode === 'reserve' ? 'text-[#1976d2]' : (formMode === 'preorder' ? 'text-[#5c6bc0]' : 'text-[#bc9f8b]')}`}>
                            <Icon name="edit" className="mr-2" />
                            {formMode === 'reserve' ? '編輯現貨保留資料' : (formMode === 'preorder' ? '編輯預購紀錄' : '編輯超商寄件資料')}
                        </div>
                    )}

                    <Card className={editingId ? (formMode === 'reserve' ? 'border-2 border-[#64b5f6]' : (formMode === 'preorder' ? 'border-2 border-[#5c6bc0]' : 'border-2 border-[#bc9f8b]')) : (formMode === 'preorder' ? 'border border-[#c5cae9]' : '')}>
                        {formMode === 'delivery' ? (
                            <React.Fragment>
                                <Input type="date" value={dDate} onChange={e => setDDate(e.target.value)} />
                                <Input placeholder="顧客姓名" value={dCustomerName} onChange={e => setDCustomerName(e.target.value)} />
                                <div className="grid grid-cols-2 gap-3">
                                    <Input type="number" placeholder="商品售價(總額)" value={dRevenue} onChange={e => setDRevenue(e.target.value)} />
                                    <Input type="number" placeholder="售出服飾件數" value={dSoldQty} onChange={e => setDSoldQty(e.target.value)} />
                                </div>
                                
                                {/* 運費快捷鍵 */}
                                <div className="flex gap-2 mb-3 -mt-2 px-1 overflow-x-auto custom-scrollbar">
                                    <button type="button" onClick={() => {setDShippingExpense(38); setDShippingIncome(60);}} className="shrink-0 text-[11px] bg-[#fff8e1] border border-[#ffb300] text-[#f57f17] px-2 py-1.5 rounded-lg font-bold shadow-sm active:bg-[#ffecb3] transition-colors">
                                        ⚡ 7-11本38收60
                                    </button>
                                    <button type="button" onClick={() => {setDShippingExpense(39); setDShippingIncome(60);}} className="shrink-0 text-[11px] bg-[#fff8e1] border border-[#ffb300] text-[#f57f17] px-2 py-1.5 rounded-lg font-bold shadow-sm active:bg-[#ffecb3] transition-colors">
                                        ⚡ 全家本39收60
                                    </button>
                                    <button type="button" onClick={() => {setDShippingExpense(38); setDShippingIncome(38);}} className="shrink-0 text-[11px] bg-[#fdfaf7] border border-[#d6ccc2] text-[#8d6e63] px-2 py-1.5 rounded-lg font-bold shadow-sm active:bg-[#f2e7df] transition-colors">
                                        7-11本38
                                    </button>
                                    <button type="button" onClick={() => {setDShippingExpense(39); setDShippingIncome(39);}} className="shrink-0 text-[11px] bg-[#fdfaf7] border border-[#d6ccc2] text-[#8d6e63] px-2 py-1.5 rounded-lg font-bold shadow-sm active:bg-[#f2e7df] transition-colors">
                                        全家本39
                                    </button>
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <Input type="number" placeholder="賣家付運費(成本)" value={dShippingExpense} onChange={e => setDShippingExpense(e.target.value)} />
                                    <Input type="number" placeholder="買家付運費(代收)" value={dShippingIncome} onChange={e => setDShippingIncome(e.target.value)} />
                                </div>
                                
                                <div className="grid grid-cols-2 gap-3 mb-4">
                                    <button className={`w-full h-[48px] rounded-xl border text-[15px] transition-colors font-wawa font-bold flex items-center justify-center ${dHasGift ? 'border-[#bc9f8b] bg-[#fdfaf7] text-[#bc9f8b]' : 'border-[#f0e6e0] bg-[#fdfdfd] text-[#a89689]'}`} onClick={(e) => { e.preventDefault(); setDHasGift(!dHasGift); }}>🎁 {dHasGift ? '有贈品' : '無贈品'}</button>
                                    <div className={`flex items-center bg-[#fdfdfd] border border-[#f0e6e0] rounded-xl px-3 h-[48px] focus-within:border-[#bc9f8b] transition-colors ${!dHasGift ? 'opacity-60 bg-[#f9f9f9]' : ''}`}>

                                        <input type="number" placeholder="贈品數量" value={tGiftCount} onChange={e => setTGiftCount(e.target.value)} disabled={!tHasGift} className="bg-transparent w-full h-full outline-none text-[#5c4d43] placeholder-[#c4b5aa] text-[15px] font-wawa" />
